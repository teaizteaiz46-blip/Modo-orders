<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>طلبات MODO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23FF773D'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F3; --surface: #FFFFFF; --ink: #1E1B18; --muted: #7C746D; --line: #ECE7E2;
    --brand: #FF773D; --brand-dark: #E2581C; --brand-soft: #FFEEE6;
    --danger: #B42318; --danger-soft: #FDE8E6;
    --radius: 14px;
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- الأزرار والحقول ---------- */
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: #D9D2CB; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn-danger { color: var(--danger); border-color: #F5C6C1; }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: #EFECE8; }
  .btn-wa { background: #E7F6EC; border-color: #CDEBD7; color: #16733A; }
  .btn-sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; min-height: 44px; }
  .field:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }

  /* ---------- تسجيل الدخول ---------- */
  #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
  .wordmark { font-weight: 700; font-size: 28px; letter-spacing: 3px; color: var(--brand); direction: ltr; }
  .login-card h1 { font-size: 20px; margin: 4px 0 20px; }
  .login-card form > * + * { margin-top: 14px; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; }

  /* ---------- الهيدر ---------- */
  header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .top-inner .wordmark { font-size: 22px; }
  .top-title { font-weight: 600; }
  .top-sub { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }

  main.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }

  /* ---------- الأرقام ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .stat.accent { background: var(--brand-soft); border-color: #FFD9C7; }
  .stat.accent .v { color: var(--brand-dark); }

  /* ---------- الفلاتر ---------- */
  .controls { display: flex; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .controls .search { flex: 1 1 240px; position: relative; }
  .controls .search .field { padding-inline-start: 38px; }
  .controls .search svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .controls select.field { flex: 0 0 150px; width: auto; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .tab .count { font-size: 12px; background: #F1EEEA; border-radius: 999px; padding: 0 7px; min-width: 22px; text-align: center; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab[aria-pressed="true"] .count { background: rgba(255,255,255,.18); }

  /* ---------- القائمة والتفاصيل ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
  @media (min-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr) 440px; }
    #detail { position: sticky; top: 76px; max-height: calc(100dvh - 92px); }
  }
  .list { display: grid; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: start; width: 100%; display: grid; gap: 6px; transition: border-color .15s; }
  .card:hover { border-color: #D9D2CB; }
  .card.selected { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .card-row { display: flex; align-items: center; gap: 8px; }
  .card-id { font-weight: 700; }
  .card-time { font-size: 12px; color: var(--muted); }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .card-total { font-weight: 700; font-size: 16px; }
  .new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .st-review { background: #FFF4DB; color: #8A5A00; }
  .st-confirmed { background: #E6F0FF; color: #1D4ED8; }
  .st-ready { background: #F0EBFF; color: #5B3CC4; }
  .st-done { background: #E5F5EA; color: #1E7B3A; }
  .st-cancelled { background: var(--danger-soft); color: var(--danger); }
  .cust-ok { color: #1E7B3A; font-weight: 600; }
  .cust-change { color: var(--danger); font-weight: 600; }
  .cust-box { padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; font-size: 14px; }
  .cust-box.ok { background: #E8F5EC; color: #1E7B3A; }
  .cust-box.change { background: var(--danger-soft); color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
  .more { margin-top: 12px; width: 100%; }

  #detail { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: auto; }
  .detail-empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .d-head { position: sticky; top: 0; background: var(--surface); padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; z-index: 2; }
  .d-head h2 { margin: 0; font-size: 20px; }
  .d-body { padding: 16px; display: grid; gap: 18px; }
  .d-sec h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .d-big { font-size: 18px; font-weight: 700; }
  .d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .addr { background: var(--bg); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; }
  .items { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .item img, .item .ph { width: 52px; height: 64px; border-radius: 10px; object-fit: cover; background: #F0ECE8; }
  .item-name { font-weight: 600; font-size: 14px; }
  .item-sub { font-size: 12px; color: var(--muted); }
  .totals { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
  .totals .row { display: flex; justify-content: space-between; }
  .totals .row.grand { font-weight: 700; font-size: 18px; margin-top: 4px; }
  .muted { color: var(--muted); }
  .flow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12px; }
  .flow span { padding: 3px 8px; border-radius: 999px; background: #F1EEEA; color: var(--muted); }
  .flow span.on { background: var(--ink); color: #fff; }
  .flow i { color: #C9C1B9; font-style: normal; }
  textarea.field { min-height: 70px; resize: vertical; }

  @media (max-width: 979px) {
    #detail.open { position: fixed; inset: 0; z-index: 40; border-radius: 0; border: 0; }
    #detail:not(.open) { display: none; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat .v { font-size: 19px; }
  }
  @media (min-width: 980px) { .only-mobile { display: none !important; } }

  /* ---------- التنبيهات ---------- */
  #toasts { position: fixed; bottom: 16px; inset-inline: 16px; display: grid; gap: 8px; justify-items: center; z-index: 60; pointer-events: none; }
  .toast { background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 500; max-width: 420px; pointer-events: auto; animation: rise .2s ease-out; }
  .toast.err { background: var(--danger); }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  dialog { border: 0; border-radius: 18px; padding: 20px; max-width: 360px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(30, 27, 24, .45); }
  dialog h3 { margin: 0 0 6px; }
  dialog p { margin: 0 0 16px; color: var(--muted); }

  /* ---------- أقسام اللوحة ---------- */
  .section-nav { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .section-nav::-webkit-scrollbar { display: none; }
  .section-nav button { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .section-nav button[aria-pressed="true"] { color: var(--brand-dark); border-bottom-color: var(--brand); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar .grow { flex: 1 1 220px; }
  .prod-list { display: grid; gap: 8px; }
  .prod-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px 8px 8px; text-align: start; width: 100%; }
  .prod-row:hover { border-color: #D9D2CB; }
  .prod-row img, .prod-row .ph { width: 64px; height: 80px; border-radius: 10px; object-fit: cover; background: #F0ECE8; }
  .prod-name { font-weight: 600; }
  .prod-meta { font-size: 13px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: #F1EEEA; color: var(--muted); }
  .badge.red { background: var(--danger-soft); color: var(--danger); }
  .badge.green { background: #E5F5EA; color: #1E7B3A; }
  .badge.orange { background: var(--brand-soft); color: var(--brand-dark); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .tiers { display: grid; gap: 10px; justify-items: start; }
  .tier-row { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .tier-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tier-fields .field { flex: 1 1 110px; width: auto; min-width: 0; }
  .tier-fields .check { min-height: 0; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--brand); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 84px; height: 104px; border-radius: 10px; overflow: hidden; background: #F0ECE8; border: 2px solid transparent; }
  .thumb.main { border-color: var(--brand); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .x, .thumb .star { position: absolute; top: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(30,27,24,.75); color: #fff; font-size: 14px; line-height: 26px; padding: 0; }
  .thumb .x { inset-inline-start: 4px; }
  .thumb .star { inset-inline-end: 4px; }
  .thumb .tag { position: absolute; bottom: 0; inset-inline: 0; background: var(--brand); color: #fff; font-size: 11px; text-align: center; }
  .add-tile { width: 84px; height: 104px; border-radius: 10px; border: 2px dashed #D9D2CB; display: grid; place-items: center; color: var(--muted); font-size: 28px; background: var(--surface); }
  dialog.sheet { max-width: 720px; width: calc(100% - 32px); padding: 0; }
  dialog.sheet .sheet-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 2; }
  dialog.sheet .sheet-head h3 { margin: 0; flex: 1; }
  dialog.sheet .sheet-body { padding: 16px; }
  dialog.sheet .sheet-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .clip-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; }
  .clip-card video { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; background: #000; }
  .clip-card .body { padding: 10px; display: grid; gap: 8px; }
  .new-clip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; margin-bottom: 16px; }
  .look-stage { position: relative; width: 340px; max-width: 100%; border-radius: 14px; overflow: hidden; background: #f0ece8; cursor: crosshair; user-select: none; }
  .look-stage img { width: 100%; display: block; aspect-ratio: 4 / 5; object-fit: cover; pointer-events: none; }
  .look-dot { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #FF773D; color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
  .look-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
  .look-card { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
  .story-thumb { width: 72px; height: 128px; object-fit: cover; border-radius: 10px; background: #f0ece8; }
  .inf-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; display: grid; gap: 10px; }
  .inf-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .inf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .inf-stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .inf-stat .k { font-size: 12px; color: var(--muted); }
  .inf-stat .v { font-weight: 700; font-size: 17px; }
  .inf-stat.due { background: var(--brand-soft); }
  .inf-stat.due .v { color: var(--brand-dark); }
  .inf-pay { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inf-pay .field { width: 150px; }
  .story-preview { width: 180px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 14px; background: #f0ece8; }
  .look-card img { width: 72px; height: 90px; object-fit: cover; border-radius: 10px; }
  .new-clip video { width: 180px; max-width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 12px; background: #000; }

  /* ---------- الموبايل ---------- */
  .field, textarea, select { font-size: 16px; } /* يمنع تكبير الشاشة بالآيفون */
  .icon-btn svg { flex: none; }
  .d-bar { display: none; }
  body { padding-bottom: env(safe-area-inset-bottom); }

  @media (max-width: 979px) {
    .d-bar {
      display: flex; gap: 8px; position: sticky; bottom: 0; z-index: 3;
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .d-bar .btn { flex: 1 1 0; min-height: 50px; font-size: 15px; }
    .d-bar .btn-primary { flex: 1.6 1 0; }
    .only-desktop { display: none !important; }
    .d-head { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
    .d-head .only-mobile { min-height: 42px; font-size: 15px; }
  }

  @media (max-width: 640px) {
    .top-inner { padding: 8px 12px; gap: 6px; padding-top: calc(8px + env(safe-area-inset-top)); }
    .top-inner .wordmark { font-size: 19px; letter-spacing: 2px; }
    .top-title { font-size: 14px; }
    .top-sub { font-size: 11px; }
    .lbl-text { display: none; }
    .icon-btn { width: 42px; min-height: 42px; padding: 0; }

    main.wrap { padding: 12px; }
    .stats { gap: 8px; }
    .stat { padding: 10px; border-radius: 12px; }
    .stat .k { font-size: 11px; line-height: 1.3; }
    .stat .v { font-size: 18px; }

    .controls { margin: 12px 0 0; gap: 8px; }
    .controls .search { flex: 1 1 100%; }
    .controls select.field { flex: 1 1 100%; }

    .tabs-wrap { position: sticky; top: 58px; z-index: 15; background: var(--bg); margin: 0 -12px; padding: 10px 12px 8px; }
    .tab { padding: 8px 14px; }

    .layout { margin-top: 4px; }
    .card { padding: 12px; border-radius: 14px; }
    .card-name { font-size: 15px; }
    .card-total { font-size: 15px; }

    .d-body { padding: 14px 12px 18px; gap: 16px; }
    .d-big { font-size: 17px; }
    .d-actions .btn { flex: 1 1 auto; }
    .d-actions select.field { flex: 1 1 100%; width: 100% !important; }
    .item { grid-template-columns: 46px minmax(0, 1fr) auto; }
    .item img, .item .ph { width: 46px; height: 58px; }

    #toasts { bottom: calc(86px + env(safe-area-inset-bottom)); }
    .login-card { padding: 24px 18px; }
    .section-nav { padding: 0 8px; }
    .section-nav button { flex: 1 0 auto; padding: 10px 8px; }
    .form-grid { grid-template-columns: minmax(0, 1fr); }
    dialog.sheet { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border-radius: 0; }
    .clip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<!-- ================= تسجيل الدخول ================= -->
<section id="login" class="hidden" aria-labelledby="login-title">
  <div class="login-card">
    <div class="wordmark">MODO</div>
    <h1 id="login-title">لوحة متابعة الطلبات</h1>
    <form id="login-form" novalidate>
      <div>
        <label class="lbl" for="email">البريد الإلكتروني</label>
        <input class="field" id="email" type="email" autocomplete="username" required dir="ltr">
      </div>
      <div>
        <label class="lbl" for="password">كلمة المرور</label>
        <input class="field" id="password" type="password" autocomplete="current-password" required dir="ltr">
      </div>
      <div class="error" id="login-error" role="alert"></div>
      <button class="btn btn-primary" id="login-btn" type="submit" style="width:100%">دخول</button>
      <button class="btn btn-ghost btn-sm" id="forgot-btn" type="button" style="width:100%">نسيت كلمة المرور؟</button>
    </form>
  </div>
</section>

<!-- ================= كلمة مرور جديدة ================= -->
<section id="recovery" class="hidden" aria-labelledby="recovery-title">
  <div class="login-card">
    <div class="wordmark">MODO</div>
    <h1 id="recovery-title">تعيين كلمة مرور جديدة</h1>
    <form id="recovery-form" novalidate>
      <div>
        <label class="lbl" for="new-password">كلمة المرور الجديدة</label>
        <input class="field" id="new-password" type="password" autocomplete="new-password" minlength="10" required dir="ltr">
      </div>
      <div>
        <label class="lbl" for="new-password2">أعد كتابتها</label>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(() => {
  'use strict';

  // ================= الإعدادات =================
  // مفتاح anon عام أصلاً (موجود داخل التطبيق). الحماية بتسجيل الدخول وصلاحيات القاعدة.
  const SUPABASE_URL = 'https://pajxormplmloivyankji.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhanhvcm1wbG1sb2l2eWFua2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0ODQ3OTksImV4cCI6MjA3NjA2MDc5OX0.eEPB_Gt5HywU9oGNXLpSNc4IA7CTTL7CX-EMKDE3yec';
  const POLL_MS = 30000;
  const PAGE_LIMIT = 500;
  const TZ = 'Asia/Baghdad';

  const ORDER_COLUMNS = 'id, created_at, customer_name, customer_phone, customer_address, cart_items, status, price, discount_amount, total_amount, delivery_cost, governorate, address_details, source, coupon_id, user_id, admin_note, status_updated_at, stock_restored, options, customer_confirmed_at, customer_change_at';

  const STATUSES = [
    { key: 'قيد المراجعة', cls: 'st-review' },
    { key: 'طلب مثبت', cls: 'st-confirmed' },
    { key: 'مجهز', cls: 'st-ready' },
    { key: 'مكتمل', cls: 'st-done' },
    { key: 'ملغي', cls: 'st-cancelled' },
  ];
  const FLOW = ['قيد المراجعة', 'طلب مثبت', 'مجهز', 'مكتمل'];
  const NEXT_STEP = {
    'قيد المراجعة': { to: 'طلب مثبت', label: 'تثبيت الطلب' },
    'طلب مثبت': { to: 'مجهز', label: 'تم التجهيز' },
    'مجهز': { to: 'مكتمل', label: 'تم التسليم' },
  };

  // لازم نقرا هذا قبل إنشاء العميل، لأنه يمسح الرمز من الرابط
  const OPENED_FROM_RECOVERY = /[#&?]type=recovery(&|$)/.test(location.hash + location.search);

  if (!window.supabase || !window.supabase.createClient) {
    document.body.textContent = 'تعذر تحميل مكتبة Supabase. تحقق من الإنترنت وحدّث الصفحة.';
    return;
  }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });

  // ================= الحالة =================
  const state = {
    orders: [],
    filter: 'الكل',
    search: '',
    rangeDays: 30,
    selectedId: null,
    seenMaxId: 0,
    unseen: new Set(),
    productCache: new Map(),
    itemsCache: new Map(),
    pollTimer: null,
    audio: null,
  };

  // ================= أدوات =================
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  const money = (v) => Math.round(Number(v) || 0).toLocaleString('en-US');
  const numEl = (v, suffix = '') => el('span', { class: 'num', text: money(v) + suffix });

  function normStatus(s) {
    const v = (s || '').trim();
    if (!v || v === 'new') return 'قيد المراجعة';
    return v;
  }
  const statusCls = (s) => (STATUSES.find((x) => x.key === s) || STATUSES[0]).cls;
  const pill = (s) => el('span', { class: 'pill ' + statusCls(s), text: s });

  const dtFull = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: TZ, dateStyle: 'medium', timeStyle: 'short' });
  const dayKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'الآن';
    if (diff < 3600) return `قبل ${Math.floor(diff / 60)} دقيقة`;
    if (diff < 86400) return `قبل ${Math.floor(diff / 3600)} ساعة`;
    if (diff < 86400 * 7) return `قبل ${Math.floor(diff / 86400)} يوم`;
    return dtFull.format(new Date(iso));
  }

  function toDigits(s) {
    return String(s || '')
      .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/\D/g, '');
  }
  function waNumber(phone) {
    let d = toDigits(phone);
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('0')) d = '964' + d.slice(1);
    else if (d.length === 10 && d.startsWith('7')) d = '964' + d;
    return d;
  }

  function itemsCount(order) {
    const m = order.cart_items;
    if (!m || typeof m !== 'object') return 0;
    return Object.values(m).reduce((s, q) => s + (Number(q) || 0), 0);
  }

  function addressParts(order) {
    const raw = (order.customer_address || '').trim();
    const idx = raw.indexOf('| تفاصيل الألوان:');
    const base = idx >= 0 ? raw.slice(0, idx).trim() : raw;
    const colors = idx >= 0 ? raw.slice(idx + '| تفاصيل الألوان:'.length).trim() : '';
    const gov = (order.governorate || '').trim();
    const details = (order.address_details || '').trim();
    return {
      text: gov || details ? [gov, details].filter(Boolean).join('، ') : base,
      colors,
    };
  }

  function toast(text, isError = false) {
    const t = el('div', { class: 'toast' + (isError ? ' err' : ''), role: 'status', text });
    $('toasts').append(t);
    setTimeout(() => t.remove(), isError ? 6000 : 3500);
  }

  function friendlyError(err) {
    const msg = (err && (err.message || err.error_description)) || String(err || '');
    if (/Invalid login credentials/i.test(msg)) return 'البريد أو كلمة المرور غير صحيحة';
    if (/Email not confirmed/i.test(msg)) return 'البريد غير مفعّل';
    if (/Failed to fetch|NetworkError|network/i.test(msg)) return 'تعذر الاتصال بالإنترنت';
    if (/JWT|token/i.test(msg)) return 'انتهت الجلسة، سجّل الدخول مرة ثانية';
    return msg || 'حدث خطأ غير متوقع';
  }

  async function copyText(text, done = 'تم النسخ') {
    try {
      await navigator.clipboard.writeText(text);
      toast(done);
    } catch {
      const ta = el('textarea', { style: 'position:fixed;opacity:0' });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast(done);
    }
  }

  function confirmDialog(title, text, okLabel) {
    return new Promise((resolve) => {
      const d = $('confirm-dialog');
      $('confirm-title').textContent = title;
      $('confirm-text').textContent = text;
      $('confirm-yes').textContent = okLabel;
      const finish = (v) => { d.close(); resolve(v); };
      $('confirm-yes').onclick = () => finish(true);
      $('confirm-no').onclick = () => finish(false);
      d.oncancel = () => resolve(false);
      d.showModal();
    });
  }

  // ================= صوت وتنبيه =================
  function unlockAudio() {
    if (state.audio) return;
    try { state.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* بدون صوت */ }
  }
  function beep() {
    const ctx = state.audio;
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    [0, 0.18].forEach((offset, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = i ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + offset + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + 0.16);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + offset);
      o.stop(ctx.currentTime + offset + 0.18);
    });
  }
  function updateNotifyBtn() {
    const b = $('notify-btn');
    if (!('Notification' in window)) { b.classList.add('hidden'); return; }
    const on = Notification.permission === 'granted';
    b.querySelector('.lbl-text').textContent = on ? 'التنبيهات مفعّلة' : 'تفعيل التنبيهات';
    b.title = on ? 'التنبيهات مفعّلة' : 'تفعيل التنبيهات';
    b.style.color = on ? '#1E7B3A' : '';
    b.disabled = on;
  }
  function notifyNew(orders) {
    beep();
    const first = orders[0];
    const text = orders.length === 1
      ? `طلب جديد #${first.id} من ${first.customer_name || ''} بمبلغ ${money(first.total_amount)} د.ع`
      : `${orders.length} طلبات جديدة`;
    toast(text);
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
      try { new Notification('MODO - طلب جديد', { body: text, tag: 'modo-order' }); } catch { /* تجاهل */ }
    }
  }
  function updateTitle() {
    const n = state.unseen.size;
    document.title = n ? `(${n}) طلبات MODO` : 'طلبات MODO';
  }

  // ================= البيانات =================
  function sinceIso() {
    if (!state.rangeDays) return null;
    const now = new Date();
    // بداية اليوم بتوقيت بغداد (+3)
    const baghdadNow = new Date(now.getTime() + 3 * 3600 * 1000);
    baghdadNow.setUTCHours(0, 0, 0, 0);
    const start = new Date(baghdadNow.getTime() - 3 * 3600 * 1000 - (state.rangeDays - 1) * 86400 * 1000);
    return start.toISOString();
  }

  async function loadOrders({ silent = false } = {}) {
    if (!silent) renderList(true);
    let q = db.from('orders').select(ORDER_COLUMNS).order('id', { ascending: false }).limit(PAGE_LIMIT);
    const since = sinceIso();
    if (since) q = q.gte('created_at', since);
    const { data, error } = await q;
    if (error) {
      toast(friendlyError(error), true);
      renderList();
      return;
    }
    state.orders = data || [];
    let maxId = state.orders.reduce((m, o) => Math.max(m, o.id), 0);
    if (!maxId && !state.seenMaxId) {
      const { data: last } = await db.from('orders').select('id').order('id', { ascending: false }).limit(1);
      maxId = last && last.length ? last[0].id : 0;
    }
    state.seenMaxId = Math.max(state.seenMaxId, maxId);
    markSynced();
    renderAll();
  }

  async function pollNew() {
    const { data, error } = await db.from('orders').select(ORDER_COLUMNS)
      .gt('id', state.seenMaxId).order('id', { ascending: false }).limit(50);
    if (error) return;
    markSynced();
    if (!data || !data.length) return;
    state.seenMaxId = Math.max(state.seenMaxId, ...data.map((o) => o.id));
    data.forEach((o) => state.unseen.add(o.id));
    const known = new Set(state.orders.map((o) => o.id));
    state.orders = [...data.filter((o) => !known.has(o.id)), ...state.orders];
    notifyNew(data);
    updateTitle();
    renderAll();
  }

  function markSynced() {
    $('last-sync').textContent = 'آخر تحديث ' + new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: TZ, timeStyle: 'short' }).format(new Date());
  }

  async function loadItems(order) {
    if (state.itemsCache.has(order.id)) return state.itemsCache.get(order.id);

    let items = [];
    const { data: rows, error } = await db.from('order_items')
      .select('product_id, product_name, product_image, color, quantity, unit_price, line_total')
      .eq('order_id', order.id).order('id');
    if (error) throw error;

    if (rows && rows.length) {
      items = rows.map((r) => ({
        name: r.product_name, image: r.product_image, color: r.color,
        qty: r.quantity, price: r.unit_price, total: r.line_total, productId: r.product_id,
      }));
    } else {
      // طلب قديم: نبني القائمة من cart_items
      const map = order.cart_items && typeof order.cart_items === 'object' ? order.cart_items : {};
      const ids = Object.keys(map).map(Number).filter(Boolean);
      const missing = ids.filter((id) => !state.productCache.has(id));
      if (missing.length) {
        const { data: prods } = await db.from('products').select('id, name, image_url, price').in('id', missing);
        (prods || []).forEach((p) => state.productCache.set(p.id, p));
      }
      items = ids.map((id) => {
        const p = state.productCache.get(id);
        const qty = Number(map[id]) || 0;
        return {
          name: p ? p.name : `منتج رقم ${id} (محذوف)`,
          image: p && Array.isArray(p.image_url) ? p.image_url[0] : null,
          color: null, qty, price: null, total: null, productId: id,
        };
      });
    }
    state.itemsCache.set(order.id, items);
    return items;
  }

  async function updateOrder(order, status, note) {
    const { data, error } = await db.rpc('admin_update_order', {
      p_order_id: order.id,
      p_status: status ?? null,
      p_note: note ?? null,
    });
    if (error) throw error;
    const idx = state.orders.findIndex((o) => o.id === order.id);
    if (idx >= 0) state.orders[idx] = { ...state.orders[idx], ...data };
    return state.orders[idx];
  }

  // ================= العرض =================
  function filteredOrders() {
    const q = state.search.trim();
    const qDigits = toDigits(q);
    return state.orders.filter((o) => {
      const st = normStatus(o.status);
      if (state.filter !== 'الكل' && st !== state.filter) return false;
      if (!q) return true;
      if (String(o.id) === q.replace('#', '')) return true;
      if ((o.customer_name || '').includes(q)) return true;
      if (qDigits.length >= 3 && toDigits(o.customer_phone).includes(qDigits.replace(/^964/, '0'))) return true;
      if ((o.governorate || o.customer_address || '').includes(q)) return true;
      return false;
    });
  }

  function renderStats() {
    const today = dayKey.format(new Date());
    let todayCount = 0, pending = 0, sales = 0;
    for (const o of state.orders) {
      const st = normStatus(o.status);
      if (st === 'قيد المراجعة') pending++;
      if (dayKey.format(new Date(o.created_at)) === today) {
        todayCount++;
        if (st !== 'ملغي') sales += Number(o.total_amount) || 0;
      }
    }
    $('s-today').textContent = todayCount;
    $('s-pending').textContent = pending;
    $('s-sales').textContent = money(sales);
  }

  function renderTabs() {
    const counts = { 'الكل': state.orders.length };
    STATUSES.forEach((s) => { counts[s.key] = 0; });
    state.orders.forEach((o) => { const s = normStatus(o.status); counts[s] = (counts[s] || 0) + 1; });
    const keys = ['الكل', ...STATUSES.map((s) => s.key)];
    $('tabs').replaceChildren(...keys.map((k) => el('button', {
      class: 'tab', type: 'button', 'aria-pressed': String(state.filter === k),
      onclick: () => { state.filter = k; renderAll(); },
    }, k, el('span', { class: 'count num', text: counts[k] || 0 }))));
  }

  function renderList(loading = false) {
    const list = $('list');
    if (loading) {
      list.replaceChildren(el('div', { class: 'empty', text: 'جاري تحميل الطلبات...' }));
      return;
    }
    const rows = filteredOrders();
    if (!rows.length) {
      list.replaceChildren(el('div', { class: 'empty', text: state.orders.length ? 'ماكو طلبات تطابق البحث أو الفلتر' : 'ماكو طلبات بهاي الفترة' }));
      return;
    }
    list.replaceChildren(...rows.map((o) => {
      const st = normStatus(o.status);
      const addr = addressParts(o).text;
      return el('button', {
        class: 'card' + (o.id === state.selectedId ? ' selected' : ''),
        type: 'button',
        onclick: () => selectOrder(o.id),
      },
        el('div', { class: 'card-row' },
          state.unseen.has(o.id) ? el('span', { class: 'new-dot', title: 'جديد' }) : null,
          el('span', { class: 'card-id num', text: '#' + o.id }),
          el('span', { class: 'card-time', text: timeAgo(o.created_at) }),
          el('span', { class: 'spacer' }),
          pill(st),
        ),
        el('div', { class: 'card-row' },
          el('span', { class: 'card-name', text: o.customer_name || 'بدون اسم' }),
          el('span', { class: 'spacer' }),
          el('span', { class: 'card-total' }, numEl(o.total_amount), ' د.ع'),
        ),
        el('div', { class: 'card-meta' },
          el('span', { class: 'num', text: o.customer_phone || '' }),
          el('span', { text: addr.length > 40 ? addr.slice(0, 40) + '…' : addr }),
          el('span', { text: `${itemsCount(o)} قطعة` }),
          o.admin_note ? el('span', { text: '📝 ملاحظة' }) : null,
          o.customer_confirmed_at ? el('span', { class: 'cust-ok', text: '✅ أكّد من التطبيق' }) : null,
          o.customer_change_at && st === 'قيد المراجعة' ? el('span', { class: 'cust-change', text: '⚠️ يريد يعدّل/يلغي' }) : null,
        ),
      );
    }));
  }

  function renderAll() {
    renderStats();
    renderTabs();
    renderList();
    if (state.selectedId) renderDetail();
  }

  function selectOrder(id) {
    state.selectedId = id;
    if (state.unseen.delete(id)) updateTitle();
    renderList();
    renderDetail();
    const d = $('detail');
    d.classList.add('open');
    d.scrollTop = 0;
    if (window.matchMedia('(max-width: 979px)').matches) document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    state.selectedId = null;
    const d = $('detail');
    d.classList.remove('open');
    document.body.style.overflow = '';
    d.replaceChildren(el('div', { class: 'detail-empty', text: 'اختر طلب من القائمة حتى تشوف تفاصيله' }));
    renderList();
  }

  function deliveryLabel(order, items) {
    const addr = addressParts(order);
    const lines = [
      `طلب #${order.id} - MODO`,
      `الاسم: ${order.customer_name || ''}`,
      `الهاتف: ${order.customer_phone || ''}`,
      `العنوان: ${addr.text}`,
      'المنتجات:',
      ...items.map((i) => `- ${i.name} × ${i.qty}${i.color ? ` (لون ${i.color})` : ''}`),
    ];
    if (!items.some((i) => i.color) && addr.colors) lines.push(`الألوان: ${addr.colors}`);
    lines.push(`المبلغ المطلوب: ${money(order.total_amount)} د.ع`);
    (order.options || []).forEach((o) => lines.push(`📌 ${o}`));
    if (order.admin_note) lines.push(`ملاحظة: ${order.admin_note}`);
    return lines.join('\n');
  }

  async function renderDetail() {
    const order = state.orders.find((o) => o.id === state.selectedId);
    const d = $('detail');
    if (!order) { closeDetail(); return; }

    const st = normStatus(order.status);
    const addr = addressParts(order);
    const next = NEXT_STEP[st];
    const renderToken = Symbol();
    d._token = renderToken;

    const itemsBox = el('div', { class: 'items' }, el('div', { class: 'muted', text: 'جاري تحميل المنتجات...' }));
    const noteField = el('textarea', { class: 'field', id: 'note', placeholder: 'ملاحظة داخلية (مثلاً: اتصلنا وأكد، يريد التوصيل بعد العصر)' });
    noteField.value = order.admin_note || '';

    const setBusy = (busy) => d.querySelectorAll('[data-action]').forEach((b) => { b.disabled = busy; });

    async function changeStatus(to) {

          `إلغاء الطلب #${order.id}؟`,
          'راح ترجع القطع للمخزون، وما تگدر ترجع تفتح الطلب بعدها.',
          'إلغاء الطلب',

        if (!ok) return;

      setBusy(true);
      try {
        await updateOrder(order, to, null);
        toast(`الطلب #${order.id}: ${to}`);

        toast(friendlyError(e), true);
        setBusy(false);

    const wa = waNumber(order.customer_phone);
    const waText = encodeURIComponent(

    d.replaceChildren(
      el('div', { class: 'd-head' },

      el('div', { class: 'd-body' },

            el('span', { class: s === st ? 'on' : '', text: s }),
          ]),

        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'الزبون' }),
          el('div', { class: 'd-big', text: order.customer_name || 'بدون اسم' }),
          el('div', { class: 'num', style: 'font-size:17px', text: order.customer_phone || '' }),
          el('div', { class: 'd-actions' },
            el('a', { class: 'btn btn-sm only-desktop', href: 'tel:' + toDigits(order.customer_phone) }, '📞 اتصال'),
            wa ? el('a', { class: 'btn btn-sm btn-wa only-desktop', href: `https://wa.me/${wa}?text=${waText}`, target: '_blank', rel: 'noopener' }, 'واتساب') : null,
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(order.customer_phone || '', 'تم نسخ الرقم') }, 'نسخ الرقم'),
            order.user_id ? el('span', { class: 'pill st-confirmed', text: 'زبون مسجّل' }) : null,
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'العنوان' }),
          el('div', { class: 'addr', text: addr.text || '—' }),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: `المنتجات (${itemsCount(order)} قطعة)` }),
          itemsBox,
          addr.colors ? el('div', { class: 'item-sub', style: 'margin-top:8px' }, 'تفاصيل الألوان: ', addr.colors) : null,
          (order.options || []).length ? el('div', { style: 'margin-top:10px;display:flex;flex-wrap:wrap;gap:6px' },
            ...order.options.map((o) => el('span', { class: 'badge orange', text: '📌 ' + o }))) : null,
          el('div', { class: 'totals', style: 'margin-top:12px' },
            el('div', { class: 'row' }, el('span', { class: 'muted', text: 'المنتجات' }), el('span', null, numEl(order.price), ' د.ع')),
            el('div', { class: 'row' }, el('span', { class: 'muted', text: 'التوصيل' }),
              el('span', null, numEl(order.delivery_cost ?? (Number(order.total_amount) - Number(order.price) + Number(order.discount_amount || 0))), ' د.ع')),
            Number(order.discount_amount) > 0
              ? el('div', { class: 'row', style: 'color:#1E7B3A' }, el('span', { text: 'خصم الكوبون' }), el('span', null, el('span', { class: 'num', text: '-' + money(order.discount_amount) }), ' د.ع'))
              : null,
            el('div', { class: 'row grand' }, el('span', { text: 'المطلوب من الزبون' }), el('span', null, numEl(order.total_amount), ' د.ع')),
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'ملاحظة داخلية' }),
          noteField,
          el('div', { class: 'd-actions' },
            el('button', {
              class: 'btn btn-sm', type: 'button', 'data-action': 'note',
              onclick: async () => {
                setBusy(true);
                try {
                  await updateOrder(order, null, noteField.value);
                  toast('انحفظت الملاحظة');
                  renderAll();
                } catch (e) { toast(friendlyError(e), true); setBusy(false); }
              },
            }, 'حفظ الملاحظة'),
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'الإجراءات' }),
          // رد الزبون من التطبيق (نافذة تأكيد الطلب)
          order.customer_change_at && st === 'قيد المراجعة'
            ? el('div', { class: 'cust-box change', text: `⚠️ الزبون طلب تعديل أو إلغاء من التطبيق (${timeAgo(order.customer_change_at)})، اتصلوا بيه.` })
            : order.customer_confirmed_at
              ? el('div', { class: 'cust-box ok', text: `✅ الزبون أكّد الطلب من التطبيق (${timeAgo(order.customer_confirmed_at)})` })
              : null,
          st === 'ملغي'
            ? el('div', { class: 'muted', text: order.stock_restored ? 'الطلب ملغي، والقطع رجعت للمخزون.' : 'الطلب ملغي.' })
            : el('div', { class: 'd-actions', style: 'margin-top:0' },
                next ? el('button', { class: 'btn btn-primary', type: 'button', 'data-action': 'next', onclick: () => changeStatus(next.to) }, next.label) : null,
                el('select', {
                  class: 'field', 'aria-label': 'تغيير الحالة يدوياً', style: 'width:auto;min-height:42px',
                  'data-action': 'select',
                  onchange: (ev) => { const v = ev.target.value; ev.target.value = ''; if (v) changeStatus(v); },
                },
                  el('option', { value: '', text: 'تغيير الحالة...' }),
                  ...FLOW.filter((s) => s !== st).map((s) => el('option', { value: s, text: s })),
                ),
                el('button', { class: 'btn btn-danger', type: 'button', 'data-action': 'cancel', onclick: () => changeStatus('ملغي') }, 'إلغاء الطلب'),
              ),
          el('div', { class: 'd-actions' },
            el('button', {
              class: 'btn btn-sm', type: 'button', 'data-action': 'label',
              onclick: async () => {
                try { copyText(deliveryLabel(order, await loadItems(order)), 'تم نسخ بيانات التوصيل'); }
                catch (e) { toast(friendlyError(e), true); }
              },
            }, '📋 نسخ بيانات التوصيل'),
          ),
        ),

        el('div', { class: 'd-sec item-sub' },
          el('div', null, 'تاريخ الطلب: ', el('span', { class: 'num', text: dtFull.format(new Date(order.created_at)) })),
          order.status_updated_at ? el('div', null, 'آخر تغيير حالة: ', el('span', { class: 'num', text: dtFull.format(new Date(order.status_updated_at)) })) : null,
          el('div', { text: 'المصدر: ' + (order.source === 'app_v2' ? 'التطبيق (النسخة الجديدة)' : 'نسخة قديمة / غير معروف') }),
        ),
      ),
      el('div', { class: 'd-bar' },
        el('a', { class: 'btn', href: 'tel:' + toDigits(order.customer_phone), 'aria-label': 'اتصال بالزبون' }, '📞 اتصال'),
        wa ? el('a', { class: 'btn btn-wa', href: `https://wa.me/${wa}?text=${waText}`, target: '_blank', rel: 'noopener' }, 'واتساب') : null,
        next && st !== 'ملغي'
          ? el('button', { class: 'btn btn-primary', type: 'button', 'data-action': 'next-bar', onclick: () => changeStatus(next.to) }, next.label)
          : null,
      ),
    );

    try {
      const items = await loadItems(order);
      if (d._token !== renderToken) return;
      itemsBox.replaceChildren(...(items.length ? items.map((i) => el('div', { class: 'item' },
        i.image ? el('img', { src: i.image, alt: '', loading: 'lazy' }) : el('div', { class: 'ph' }),
        el('div', null,
          el('div', { class: 'item-name', text: i.name }),
          el('div', { class: 'item-sub' },
            i.color ? `اللون: ${i.color} · ` : '',
            'الكمية: ', el('span', { class: 'num', text: i.qty }),
            i.price != null ? [' × ', numEl(i.price)] : '',
          ),
        ),
        i.total != null ? el('div', { style: 'font-weight:600' }, numEl(i.total)) : el('div'),
      )) : [el('div', { class: 'muted', text: 'ماكو منتجات مسجّلة لهذا الطلب' })]));
    } catch (e) {
      if (d._token !== renderToken) return;
      itemsBox.replaceChildren(el('div', { class: 'error', text: friendlyError(e) }));
    }
  }

  // ================= الجلسة =================
  async function showApp() {
    const { data: isAdmin, error } = await db.rpc('is_modo_admin');
    if (error || !isAdmin) {
      await db.auth.signOut();
      showLogin(error ? friendlyError(error) : 'هذا الحساب ما عنده صلاحية على لوحة الطلبات');
      return;
    }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    updateNotifyBtn();
    loadCategories();
    await loadOrders();
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(() => { if (!document.hidden) pollNew(); }, POLL_MS);
  }

  function clearAuthHash() {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function showRecovery() {
    clearInterval(state.pollTimer);
    clearAuthHash();
    $('app').classList.add('hidden');
    $('login').classList.add('hidden');
    $('recovery').classList.remove('hidden');
    $('new-password').focus();
  }

  $('recovery-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const p1 = $('new-password').value;
    const p2 = $('new-password2').value;
    const err = $('recovery-error');
    if (p1.length < 10 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) {
      err.textContent = 'كلمة المرور لازم تكون 10 خانات على الأقل وبيها حروف وأرقام';
      return;
    }
    if (p1 !== p2) { err.textContent = 'كلمتا المرور غير متطابقتين'; return; }
    err.textContent = '';
    $('recovery-btn').disabled = true;
    const { error } = await db.auth.updateUser({ password: p1 });
    $('recovery-btn').disabled = false;
    if (error) {
      err.textContent = /session|expired|JWT/i.test(error.message)
        ? 'انتهت صلاحية الرابط، اطلب رابط استعادة جديد'
        : friendlyError(error);
      return;
    }
    $('new-password').value = '';
    $('new-password2').value = '';
    $('recovery').classList.add('hidden');
    toast('انحفظت كلمة المرور الجديدة');
    await showApp();
  });

  $('forgot-btn').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) { $('login-error').textContent = 'اكتب بريدك الإلكتروني أولاً، وبعدها اضغط نسيت كلمة المرور'; return; }
    $('forgot-btn').disabled = true;
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname,
    });
    $('forgot-btn').disabled = false;
    if (error) { $('login-error').textContent = friendlyError(error); return; }
    $('login-error').textContent = '';
    toast('إذا البريد مسجّل، راح توصلك رسالة فيها رابط تغيير كلمة المرور');
  });

  function showLogin(message = '') {
    clearInterval(state.pollTimer);
    $('app').classList.add('hidden');
    $('recovery').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-error').textContent = message;
    $('login-btn').disabled = false;
    $('login-btn').textContent = 'دخول';
  }

  // ================= المنتجات والمقاطع =================
  const BUCKET = 'hijabat';
  const MAX_VIDEO_MB = 50;
  const PRODUCT_COLS = 'id, name, price, old_price, stock, product_cost, category_id, colors, description, is_offer, offer_ends_at, image_url, sales_count, created_at, bulk_tiers, unit_tiers, offer_group, is_wholesale, min_qty';
  const adm = {
    section: 'orders',
    categories: [],
    products: [],
    productsLoaded: false,
    clips: [],
    clipsLoaded: false,
    search: '',
    cat: 0,
    stock: 'all',
  };

  function showSection(name) {
    adm.section = name;
    ['orders', 'products', 'clips', 'push', 'looks', 'stories', 'splash', 'influencers', 'gifts', 'offers'].forEach((s) => $('sec-' + s).classList.toggle('hidden', s !== name));
    document.querySelectorAll('.section-nav button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.section === name)));
    if (name !== 'orders' && state.selectedId) closeDetail();
    if (name === 'products' && !adm.productsLoaded) loadProducts();
    if (name === 'clips' && !adm.clipsLoaded) loadClips();
    if (name === 'push') openPush();
    if (name === 'looks') openLooks();
    if (name === 'stories') openStories();
    if (name === 'splash') openSplash();
    if (name === 'influencers') openInfluencers();
    if (name === 'gifts') openGifts();
    if (name === 'offers') openOffers();
    window.scrollTo(0, 0);
  }

  const catName = (id) => (adm.categories.find((c) => c.id === id) || {}).name || 'بدون فئة';
  const productName = (id) => (adm.products.find((p) => p.id === id) || {}).name || (id ? `منتج رقم ${id}` : 'بدون منتج');

  async function loadCategories() {
    const { data, error } = await db.from('categories').select('id, name').order('id');
    if (error) { toast(friendlyError(error), true); return; }
    adm.categories = data || [];
    $('prod-cat').replaceChildren(
      el('option', { value: '0', text: 'كل الفئات' }),
      ...adm.categories.map((c) => el('option', { value: c.id, text: c.name })),
    );
  }

  async function loadProducts() {
    $('prod-list').replaceChildren(el('div', { class: 'empty', text: 'جاري تحميل المنتجات...' }));
    if (!adm.categories.length) await loadCategories();
    const { data, error } = await db.from('products').select(PRODUCT_COLS).order('id', { ascending: false }).limit(2000);
    if (error) {
      $('prod-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) }));
      return;
    }
    // كلفة الشراء محفوظة بجدول خاص بالأدمن بس (ما تنقرا من جدول المنتجات)
    const costs = await productCosts();
    adm.products = (data || []).map((p) => (costs.has(p.id) ? { ...p, product_cost: costs.get(p.id) } : p));
    adm.productsLoaded = true;
    renderProducts();
  }

  async function productCosts() {
    const { data, error } = await db.rpc('admin_product_costs');
    if (error) return new Map();
    return new Map((data || []).map((c) => [c.product_id, c.cost]));
  }

  function renderProducts() {
    const q = adm.search.trim();
    const rows = adm.products.filter((p) => {
      if (adm.cat && p.category_id !== adm.cat) return false;
      if (adm.stock === 'in' && !(p.stock > 0)) return false;
      if (adm.stock === 'out' && p.stock > 0) return false;
      if (q && !(p.name || '').includes(q) && String(p.id) !== q) return false;
      return true;
    });
    $('prod-count').textContent = `${rows.length} منتج`;
    if (!rows.length) {
      $('prod-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو منتجات تطابق البحث' }));
      return;
    }
    $('prod-list').replaceChildren(...rows.map((p) => {
      const img = Array.isArray(p.image_url) && p.image_url[0];
      const stock = Number(p.stock) || 0;
      return el('button', { class: 'prod-row', type: 'button', onclick: () => openProductEditor(p) },
        img ? el('img', { src: img, alt: '', loading: 'lazy' }) : el('div', { class: 'ph' }),
        el('div', null,
          el('div', { class: 'prod-name', text: p.name || 'بدون اسم' }),
          el('div', { class: 'prod-meta' },
            el('span', { text: catName(p.category_id) }),
            el('span', { class: 'num', text: '#' + p.id }),
            p.sales_count ? el('span', { text: `بيع ${p.sales_count}` }) : null,
          ),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            stock > 0 ? el('span', { class: 'badge green', text: `المخزون ${stock}` }) : el('span', { class: 'badge red', text: 'مخفي / نفد' }),
            p.is_offer ? el('span', { class: 'badge orange', text: 'عرض' }) : null,
            (p.colors || []).length ? el('span', { class: 'badge', text: `${p.colors.length} ألوان` }) : null,
            (p.bulk_tiers || []).length ? el('span', { class: 'badge orange', text: 'عرض كمية' }) : null,
            p.is_wholesale ? el('span', { class: 'badge', text: p.min_qty ? `جملة · أقل ${p.min_qty}` : 'جملة' }) : null,
            p.offer_group ? el('span', { class: 'badge', text: `مجموعة: ${p.offer_group}` }) : null,
          ),
        ),
        el('div', { style: 'text-align:end' },
          el('div', { style: 'font-weight:700' }, numEl(p.price), ' د.ع'),
          Number(p.old_price) > Number(p.price) ? el('div', { class: 'muted', style: 'font-size:12px;text-decoration:line-through' }, numEl(p.old_price)) : null,
        ),
      );
    }));
  }

  // ---------- رفع الملفات ----------
  function safeFileName(name, ext) {
    const base = String(name || 'file').replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '_').slice(-40) || 'file';
    return `${base}.${ext}`;
  }

  async function compressImage(file, maxSide = 1400, quality = 0.85) {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch {
      throw new Error(`صيغة الصورة "${file.name}" غير مدعومة، استخدم JPG أو PNG`);
    }
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale);
    const h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
    if (!blob) throw new Error('تعذر تجهيز الصورة');
    return blob;
  }

  async function uploadFile(blob, originalName, ext, contentType) {
    const path = `public/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeFileName(originalName, ext)}`;
    const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType, cacheControl: '31536000', upsert: false });
    if (error) throw error;
    return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  function storagePathFromUrl(url) {
    const marker = `/object/public/${BUCKET}/`;
    const i = String(url || '').indexOf(marker);
    return i >= 0 ? decodeURIComponent(url.slice(i + marker.length)) : null;
  }

  // ---------- محرر المنتج ----------
  function openProductEditor(product) {
    const dlg = $('product-dialog');
    const isNew = !product;
    const p = product || { name: '', price: '', old_price: '', stock: 1, product_cost: '', category_id: adm.cat || (adm.categories[0] || {}).id, colors: [], description: '', is_offer: false, offer_ends_at: null, image_url: [], bulk_tiers: [], unit_tiers: null, offer_group: null, is_wholesale: false, min_qty: null };
    // كل صورة: { url } موجودة أو { file, preview } جديدة
    let images = (p.image_url || []).map((url) => ({ url }));

    const f = {
      name: el('input', { class: 'field', required: true, maxlength: 150 }),
      category: el('select', { class: 'field' }, ...adm.categories.map((c) => el('option', { value: c.id, text: c.name }))),
      price: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      oldPrice: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      stock: el('input', { class: 'field', type: 'number', min: 0, step: 1, inputmode: 'numeric', dir: 'ltr' }),
      cost: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      colors: el('input', { class: 'field', placeholder: 'مثال: أسود، بيج، وردي' }),
      desc: el('textarea', { class: 'field', rows: 4 }),
      offer: el('input', { type: 'checkbox' }),
      ends: el('input', { class: 'field', type: 'datetime-local', dir: 'ltr' }),
      group: el('input', { class: 'field', maxlength: 60, list: 'offer-groups', placeholder: 'مثال: برا 8 آلاف' }),
      wholesale: el('input', { type: 'checkbox' }),
      minQty: el('input', { class: 'field', type: 'number', min: 2, step: 1, inputmode: 'numeric', dir: 'ltr', placeholder: 'مثال: 12' }),
      files: el('input', { type: 'file', accept: 'image/*', multiple: true, class: 'hidden' }),
    };
    f.name.value = p.name || '';
    f.category.value = String(p.category_id || '');
    f.price.value = p.price ?? '';
    f.oldPrice.value = p.old_price ?? '';
    f.stock.value = p.stock ?? 0;
    f.cost.value = p.product_cost ?? '';
    f.colors.value = (p.colors || []).join('، ');
    f.desc.value = p.description || '';
    f.offer.checked = !!p.is_offer;
    f.group.value = p.offer_group || '';
    f.wholesale.checked = !!p.is_wholesale;
    f.minQty.value = p.min_qty ?? '';
    if (p.offer_ends_at) {
      const d = new Date(p.offer_ends_at);
      f.ends.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    const thumbs = el('div', { class: 'thumbs' });
    const renderThumbs = () => {
      thumbs.replaceChildren(
        ...images.map((img, i) => el('div', { class: 'thumb' + (i === 0 ? ' main' : '') },
          el('img', { src: img.url || img.preview, alt: '' }),
          el('button', { class: 'x', type: 'button', title: 'حذف الصورة', onclick: () => { images.splice(i, 1); renderThumbs(); } }, '×'),
          i > 0 ? el('button', { class: 'star', type: 'button', title: 'اجعلها الصورة الرئيسية', onclick: () => { images.unshift(images.splice(i, 1)[0]); renderThumbs(); } }, '★') : null,
          i === 0 ? el('div', { class: 'tag', text: 'الرئيسية' }) : null,
        )),
        el('button', { class: 'add-tile', type: 'button', title: 'إضافة صور', onclick: () => f.files.click() }, '+'),
      );
    };
    f.files.addEventListener('change', () => {
      for (const file of f.files.files) {
        if (!file.type.startsWith('image/')) continue;
        images.push({ file, preview: URL.createObjectURL(file) });
      }
      f.files.value = '';
      renderThumbs();
    });
    renderThumbs();

    // ---- عروض الكمية (bulk_tiers): باقات، مثلاً 3 قطع بسعر كلي. الحساب النهائي بالسيرفر (private.bulk_price).
    let tiers = (Array.isArray(p.bulk_tiers) ? p.bulk_tiers : []).map((t) => ({
      qty: t.qty ?? '', price: t.price ?? '', free: t.free_delivery === true,
    }));
    const tiersBox = el('div', { class: 'tiers' });
    const renderTiers = () => {
      const unit = Number(f.price.value) || 0;
      tiersBox.replaceChildren(
        ...tiers.map((t, i) => {
          const qty = el('input', { class: 'field', type: 'number', min: 2, step: 1, inputmode: 'numeric', dir: 'ltr', placeholder: 'عدد القطع' });
          const price = el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr', placeholder: 'السعر الكلي' });
          const free = el('input', { type: 'checkbox' });
          qty.value = t.qty; price.value = t.price; free.checked = t.free;
          const note = el('div', { class: 'help' });
          const updateNote = () => {
            const q = Number(t.qty), pr = Number(t.price), u = Number(f.price.value) || 0;
            if (!(q >= 2) || !(pr > 0)) { note.textContent = ''; return; }
            const regular = q * u;
            note.textContent = `القطعة بـ ${money(pr / q)} د.ع` +
              (regular > pr ? ` · الزبون يوفّر ${money(regular - pr)} د.ع` : '') +
              (regular && regular <= pr && !t.free ? ' · ⚠️ السعر مو أرخص من السعر العادي' : '');
          };
          qty.addEventListener('input', () => { t.qty = qty.value; updateNote(); });
          price.addEventListener('input', () => { t.price = price.value; updateNote(); });
          free.addEventListener('change', () => { t.free = free.checked; updateNote(); });
          updateNote();
          return el('div', { class: 'tier-row' },
            el('div', { class: 'tier-fields' },
              qty,
              el('span', { class: 'muted', text: 'قطع بـ' }),
              price,
              el('label', { class: 'check' }, free, 'توصيل مجاني'),
              el('button', { class: 'btn btn-ghost btn-sm', type: 'button', title: 'حذف العرض', onclick: () => { tiers.splice(i, 1); renderTiers(); } }, '✕'),
            ),
            note,
          );
        }),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { tiers.push({ qty: '', price: '', free: false }); renderTiers(); } }, '+ إضافة عرض كمية'),
        ...(unit ? [] : [el('div', { class: 'help', text: 'اكتب سعر المنتج أول حتى يبين التوفير.' })]),
      );
    };
    f.price.addEventListener('change', renderTiers);
    renderTiers();

    // ---- أسعار الجملة (unit_tiers): كل القطع بسعر الدرجة إذا العدد وصلها. فارغ = الخصم الافتراضي.
    const UNIT_DEFAULT = [{ min: 6, pct: 27.5 }, { min: 12, pct: 27.5 }, { min: 12, pct: 30, mix: true }];
    const srcUnit = Array.isArray(p.unit_tiers) ? p.unit_tiers : (p.unit_tiers == null ? UNIT_DEFAULT : []);
    const unitSlots = [
      { key: '6', label: '6-11 قطعة', min: 6, mix: false },
      { key: '12', label: '12+ قطعة', min: 12, mix: false },
      { key: 'mix', label: 'مكس 12+', min: 12, mix: true },
    ].map((s) => {
      const t = srcUnit.find((x) => Number(x.min) === s.min && !!x.mix === s.mix);
      return { ...s, pct: t ? t.pct ?? null : null, price: t && t.price != null ? t.price : '', on: !!t };
    });
    const unitOff = el('input', { type: 'checkbox' });
    unitOff.checked = Array.isArray(p.unit_tiers) && p.unit_tiers.length === 0;
    const tierUnit = (base, pct) => Math.round(base * (100 - pct) / 100 / 250) * 250;
    const unitBox = el('div', { class: 'tiers' });
    const renderUnit = () => {
      const base = Number(f.price.value) || 0;
      unitBox.replaceChildren(
        el('label', { class: 'check' }, unitOff, 'بدون أسعار جملة لهذا المنتج'),
        ...(unitOff.checked ? [] : unitSlots.map((s) => {
          const def = s.pct != null ? s.pct : (UNIT_DEFAULT.find((x) => x.min === s.min && !!x.mix === s.mix) || {}).pct;
          const input = el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr',
            placeholder: base ? money(tierUnit(base, def)) : 'سعر القطعة' });
          input.value = s.price;
          input.addEventListener('input', () => { s.price = input.value; });
          return el('div', { class: 'tier-row' }, el('div', { class: 'tier-fields' },
            el('span', { class: 'muted', text: s.label }), input, el('span', { class: 'muted', text: `للقطعة (فارغ = خصم ${def}%)` })));
        })),
      );
    };
    unitOff.addEventListener('change', renderUnit);
    f.price.addEventListener('change', renderUnit);
    renderUnit();

    function readUnitTiers(unitPrice) {
      if (unitOff.checked) return [];
      const out = [];
      for (const s of unitSlots) {
        const def = s.pct != null ? s.pct : (UNIT_DEFAULT.find((x) => x.min === s.min && !!x.mix === s.mix) || {}).pct;
        const base = { min: s.min, ...(s.mix ? { mix: true } : {}) };
        if (s.price === '' || s.price == null) { out.push({ ...base, pct: def }); continue; }
        const v = Number(s.price);
        if (!(v > 0) || v >= unitPrice) return `سعر ${s.label} لازم يكون أقل من سعر القطعة (${money(unitPrice)} د.ع)`;
        out.push({ ...base, price: v });
      }
      return out;
    }

    // يرجع مصفوفة jsonb أو رسالة خطأ
    function readTiers(unitPrice) {
      const out = [];
      for (const t of tiers) {
        if (t.qty === '' && t.price === '') continue;
        const qty = Number(t.qty), price = Number(t.price);
        if (!Number.isInteger(qty) || qty < 2) return 'عدد القطع بعرض الكمية لازم يكون 2 أو أكثر';
        if (!(price > 0)) return 'اكتب سعر صحيح لعرض الكمية';
        const pcs = qty === 2 ? 'قطعتين' : `${qty} قطع`;
        if (out.some((x) => x.qty === qty)) return `اكو عرضين لنفس العدد (${pcs})`;
        if (price >= qty * unitPrice && !t.free) return `عرض ${pcs} مو أرخص من السعر العادي (${money(qty * unitPrice)} د.ع)`;
        out.push(t.free ? { qty, price, free_delivery: true } : { qty, price });
      }
      return out.sort((a, b) => a.qty - b.qty);
    }

    const err = el('div', { class: 'error', role: 'alert' });
    const saveBtn = el('button', { class: 'btn btn-primary', type: 'button' }, isNew ? 'إضافة المنتج' : 'حفظ التعديلات');

    const field = (label, input, opts = {}) => el('div', { class: opts.full ? 'full' : null },
      el('label', { class: 'lbl', text: label }), input, opts.help ? el('div', { class: 'help', text: opts.help }) : null);

    async function save(extra = {}) {
      err.textContent = '';
      const name = f.name.value.trim();
      const price = Number(f.price.value);
      const stock = Number(f.stock.value);
      const oldPrice = f.oldPrice.value === '' ? null : Number(f.oldPrice.value);
      const cost = f.cost.value === '' ? null : Number(f.cost.value);
      const colors = f.colors.value.split(/[،,]/).map((c) => c.trim()).filter(Boolean);
      if (!name) { err.textContent = 'اكتب اسم المنتج'; return; }
      if (!f.category.value) { err.textContent = 'اختر الفئة'; return; }
      if (!(price > 0)) { err.textContent = 'اكتب سعر صحيح'; return; }
      if (!(stock >= 0) || !Number.isInteger(stock)) { err.textContent = 'اكتب كمية صحيحة'; return; }
      if (oldPrice !== null && oldPrice <= price) { err.textContent = 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي، أو اتركه فارغ'; return; }
      if (!images.length) { err.textContent = 'أضف صورة وحدة على الأقل'; return; }
      const bulkTiers = readTiers(price);
      if (typeof bulkTiers === 'string') { err.textContent = bulkTiers; return; }
      const unitTiers = readUnitTiers(price);
      if (typeof unitTiers === 'string') { err.textContent = unitTiers; return; }
      const offerGroup = f.group.value.trim() || null;
      const minQty = f.minQty.value === '' ? null : Number(f.minQty.value);
      if (minQty !== null && (!Number.isInteger(minQty) || minQty < 2 || minQty > 1000)) { err.textContent = 'أقل كمية لازم رقم صحيح من 2 إلى 1000، أو اتركها فارغة'; return; }
      if (offerGroup) {
        if (!bulkTiers.length) { err.textContent = 'مجموعة العرض تحتاج عرض كمية على المنتج'; return; }
        // كل منتجات المجموعة لازم نفس السعر ونفس عروض الكمية، حتى ما تختلط عروض مختلفة
        const sig = (tiers) => JSON.stringify((tiers || []).map((t) => [Number(t.qty), Number(t.price), t.free_delivery === true]).sort((a, b) => a[0] - b[0]));
        const other = adm.products.find((x) => x.id !== p.id && (x.offer_group || '').trim() === offerGroup
          && (Number(x.price) !== price || sig(x.bulk_tiers) !== sig(bulkTiers)));
        if (other) {
          err.textContent = `المجموعة "${offerGroup}" بيها "${other.name}" (#${other.id}) بسعر أو عرض مختلف. خلي السعر والعرض نفسه، أو غيّر اسم المجموعة.`;
          return;
        }
      }

      dlg.querySelectorAll('button, input, select, textarea').forEach((x) => { x.disabled = true; });
      try {
        const urls = [];
        let n = 0;
        const toUpload = images.filter((i) => i.file).length;
        for (const img of images) {
          if (img.url) { urls.push(img.url); continue; }
          n++;
          saveBtn.textContent = `جاري رفع الصور ${n}/${toUpload}...`;
          const blob = await compressImage(img.file);
          urls.push(await uploadFile(blob, img.file.name, 'jpg', 'image/jpeg'));
        }
        saveBtn.textContent = 'جاري الحفظ...';
        const payload = {
          name,
          category_id: Number(f.category.value),
          price,
          old_price: oldPrice,
          stock,
          product_cost: cost,
          colors,
          description: f.desc.value.trim() || null,
          is_offer: f.offer.checked,
          offer_ends_at: f.offer.checked && f.ends.value ? new Date(f.ends.value).toISOString() : null,
          image_url: urls,
          bulk_tiers: bulkTiers,
          unit_tiers: unitTiers,
          offer_group: offerGroup,
          is_wholesale: f.wholesale.checked,
          min_qty: minQty,
          ...extra,
        };
        const q = isNew
          ? db.from('products').insert(payload).select(PRODUCT_COLS).single()
          : db.from('products').update(payload).eq('id', p.id).select(PRODUCT_COLS).single();
        const { data, error } = await q;
        if (error) throw error;
        // السيرفر ينقل الكلفة للجدول الخاص ويرجّعها فارغة، فنعرض القيمة اللي انحفظت
        if (cost != null) data.product_cost = cost;
        else if (!isNew && p.product_cost != null) data.product_cost = p.product_cost;
        if (isNew) adm.products.unshift(data);
        else adm.products[adm.products.findIndex((x) => x.id === p.id)] = data;
        dlg.close();
        renderProducts();
        toast(isNew ? `انضاف المنتج #${data.id} وصار يظهر بالتطبيق` : 'انحفظت التعديلات');
      } catch (e) {
        err.textContent = friendlyError(e);
        dlg.querySelectorAll('button, input, select, textarea').forEach((x) => { x.disabled = false; });
        saveBtn.textContent = isNew ? 'إضافة المنتج' : 'حفظ التعديلات';
      }
    }
    saveBtn.addEventListener('click', () => save());

    dlg.replaceChildren(
      el('div', { class: 'sheet-head' },
        el('h3', { text: isNew ? 'منتج جديد' : `تعديل المنتج #${p.id}` }),
        el('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: () => dlg.close(), 'aria-label': 'إغلاق' }, '✕'),
      ),
      el('div', { class: 'sheet-body' },
        el('div', { class: 'form-grid' },
          field('الصور (الأولى هي الرئيسية)', el('div', null, thumbs, f.files), { full: true, help: 'تنضغط تلقائياً قبل الرفع حتى تفتح بسرعة بالتطبيق.' }),
          field('اسم المنتج *', f.name, { full: true }),
          field('الفئة *', f.category),
          field('الكمية بالمخزون *', f.stock, { help: 'إذا صارت 0 المنتج يختفي من التطبيق.' }),
          field('السعر (د.ع) *', f.price),
          field('السعر قبل الخصم', f.oldPrice, { help: 'اتركه فارغ إذا ماكو خصم.' }),
          field('الألوان', f.colors, { full: true, help: 'افصل بينها بفاصلة. إذا كتبت ألوان، الزبون لازم يختار واحد قبل الإضافة للسلة.' }),
          field('أسعار الجملة (سعر القطعة حسب العدد)', unitBox, { full: true, help: 'إذا مجموع القطع (كل الألوان) وصل 6، كل القطع تنحسب بسعر 6-11، وإذا وصل 12 بسعر 12+. "مكس" للزبونة الي تختار "مكس ألوان" (إنتو تختارون الألوان) إذا طلبت 12 أو أكثر. إذا المنتج بيه "عروض كمية" (باقات)، الباقات هي الي تنحسب بداله.' }),
          field('عروض الكمية', tiersBox, { full: true, help: 'مثال: 3 قطع بـ 15,000. تنحسب باقات: 7 قطع مع عرض 3 = باقتين + قطعة بالسعر العادي. الكمية تنجمع عبر كل الألوان، وإذا وصل عرض بيه توصيل مجاني يصير التوصيل مجاني على الطلب كله.' }),
          el('div', null, el('label', { class: 'check' }, f.wholesale, 'منتج جملة (اختيار ألوان متعددة)'),
            el('div', { class: 'help', text: 'الزبون يختار أكثر من لون مرة وحدة، ولكل لون عدد.' })),
          field('أقل كمية للطلب (اختياري)', f.minQty, { help: 'مجموع كل الألوان. السيرفر يرفض الطلب إذا أقل.' }),
          field('مجموعة العرض (اختياري)', el('div', null, f.group,
            el('datalist', { id: 'offer-groups' }, ...[...new Set(adm.products.map((x) => (x.offer_group || '').trim()).filter(Boolean))].map((g) => el('option', { value: g })))),
            { full: true, help: 'المنتجات بنفس المجموعة تتجمع قطعها للعرض، مثلاً قطعة من موديل وقطعة من موديل ثاني = قطعتين. لازم كلها نفس السعر ونفس عرض الكمية. اتركه فارغ إذا المنتج لحاله.' }),

        el('div', null, el('label', { class: 'lbl', text: 'الترتيب (الأصغر يطلع أول)' }), order),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'الصورة' }), file),
      ),
      preview,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'زر "تسوّقي هسه" يفتح' }), linkType),
        el('div', null, el('label', { class: 'lbl', text: ' ' }), valueBox),
        el('div', null, el('label', { class: 'lbl', text: 'يبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'ينتهي (اختياري)' }), ends),
      ),
      el('label', { style: 'display:flex;gap:8px;align-items:center' }, active, 'فعال (يطلع بالتطبيق)'),

      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
