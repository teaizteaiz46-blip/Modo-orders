            i ? el('i', { text: '←' }) : null,
            el('span', { class: s === st ? 'on' : '', text: s }),
          ]),
          st === 'ملغي' ? el('span', { class: 'on', style: 'background:var(--danger)', text: 'ملغي' }) : null,
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'الزبون' }),
          el('div', { class: 'd-big', text: order.customer_name || 'بدون اسم' }),
          el('div', { class: 'num', style: 'font-size:17px', text: order.customer_phone || '' }),
          el('div', { class: 'd-actions' },
            el('a', { class: 'btn btn-sm only-desktop', href: 'tel:' + toDigits(order.customer_phone) }, '📞 اتصال'),
            wa ? el('a', { class: 'btn btn-sm btn-wa only-desktop', href: `https://wa.me/${wa}?text=${waText}`, target: '_blank', rel: 'noopener' }, 'واتساب') : null,
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(order.customer_phone || '', 'تم نسخ الرقم') }, 'نسخ الرقم'),
            order.user_id ? el('span', { class: 'pill st-confirmed', text: 'زبون مسجّل' }) : null,
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'العنوان' }),
          el('div', { class: 'addr', text: addr.text || '—' }),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: `المنتجات (${itemsCount(order)} قطعة)` }),
          itemsBox,
          addr.colors ? el('div', { class: 'item-sub', style: 'margin-top:8px' }, 'تفاصيل الألوان: ', addr.colors) : null,
          (order.options || []).length ? el('div', { style: 'margin-top:10px;display:flex;flex-wrap:wrap;gap:6px' },
            ...order.options.map((o) => el('span', { class: 'badge orange', text: '📌 ' + o }))) : null,
          el('div', { class: 'totals', style: 'margin-top:12px' },
            el('div', { class: 'row' }, el('span', { class: 'muted', text: 'المنتجات' }), el('span', null, numEl(order.price), ' د.ع')),
            el('div', { class: 'row' }, el('span', { class: 'muted', text: 'التوصيل' }),
              el('span', null, numEl(order.delivery_cost ?? (Number(order.total_amount) - Number(order.price) + Number(order.discount_amount || 0))), ' د.ع')),
            Number(order.discount_amount) > 0
              ? el('div', { class: 'row', style: 'color:#1E7B3A' }, el('span', { text: 'خصم الكوبون' }), el('span', null, el('span', { class: 'num', text: '-' + money(order.discount_amount) }), ' د.ع'))
              : null,
            el('div', { class: 'row grand' }, el('span', { text: 'المطلوب من الزبون' }), el('span', null, numEl(order.total_amount), ' د.ع')),
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'ملاحظة داخلية' }),
          noteField,
          el('div', { class: 'd-actions' },
            el('button', {
              class: 'btn btn-sm', type: 'button', 'data-action': 'note',
              onclick: async () => {
                setBusy(true);
                try {
                  await updateOrder(order, null, noteField.value);
                  toast('انحفظت الملاحظة');
                  renderAll();
                } catch (e) { toast(friendlyError(e), true); setBusy(false); }
              },
            }, 'حفظ الملاحظة'),
          ),
        ),

        el('div', { class: 'd-sec' },
          el('h3', { text: 'الإجراءات' }),
          // رد الزبون من التطبيق (نافذة تأكيد الطلب)
          order.customer_change_at && st === 'قيد المراجعة'
            ? el('div', { class: 'cust-box change', text: `⚠️ الزبون طلب تعديل أو إلغاء من التطبيق (${timeAgo(order.customer_change_at)})، اتصلوا بيه.` })
            : order.customer_confirmed_at
              ? el('div', { class: 'cust-box ok', text: `✅ الزبون أكّد الطلب من التطبيق (${timeAgo(order.customer_confirmed_at)})` })
              : null,
          st === 'ملغي'
            ? el('div', { class: 'muted', text: order.stock_restored ? 'الطلب ملغي، والقطع رجعت للمخزون.' : 'الطلب ملغي.' })
            : el('div', { class: 'd-actions', style: 'margin-top:0' },
                next ? el('button', { class: 'btn btn-primary', type: 'button', 'data-action': 'next', onclick: () => changeStatus(next.to) }, next.label) : null,
                el('select', {
                  class: 'field', 'aria-label': 'تغيير الحالة يدوياً', style: 'width:auto;min-height:42px',
                  'data-action': 'select',
                  onchange: (ev) => { const v = ev.target.value; ev.target.value = ''; if (v) changeStatus(v); },
                },
                  el('option', { value: '', text: 'تغيير الحالة...' }),
                  ...FLOW.filter((s) => s !== st).map((s) => el('option', { value: s, text: s })),
                ),
                el('button', { class: 'btn btn-danger', type: 'button', 'data-action': 'cancel', onclick: () => changeStatus('ملغي') }, 'إلغاء الطلب'),
              ),
          el('div', { class: 'd-actions' },
            el('button', {
              class: 'btn btn-sm', type: 'button', 'data-action': 'label',
              onclick: async () => {
                try { copyText(deliveryLabel(order, await loadItems(order)), 'تم نسخ بيانات التوصيل'); }
                catch (e) { toast(friendlyError(e), true); }
              },
            }, '📋 نسخ بيانات التوصيل'),
          ),
        ),

        el('div', { class: 'd-sec item-sub' },
          el('div', null, 'تاريخ الطلب: ', el('span', { class: 'num', text: dtFull.format(new Date(order.created_at)) })),
          order.status_updated_at ? el('div', null, 'آخر تغيير حالة: ', el('span', { class: 'num', text: dtFull.format(new Date(order.status_updated_at)) })) : null,
          el('div', { text: 'المصدر: ' + (order.source === 'app_v2' ? 'التطبيق (النسخة الجديدة)' : 'نسخة قديمة / غير معروف') }),
        ),
      ),
      el('div', { class: 'd-bar' },
        el('a', { class: 'btn', href: 'tel:' + toDigits(order.customer_phone), 'aria-label': 'اتصال بالزبون' }, '📞 اتصال'),
        wa ? el('a', { class: 'btn btn-wa', href: `https://wa.me/${wa}?text=${waText}`, target: '_blank', rel: 'noopener' }, 'واتساب') : null,
        next && st !== 'ملغي'
          ? el('button', { class: 'btn btn-primary', type: 'button', 'data-action': 'next-bar', onclick: () => changeStatus(next.to) }, next.label)
          : null,
      ),
    );

    try {
      const items = await loadItems(order);
      if (d._token !== renderToken) return;
      itemsBox.replaceChildren(...(items.length ? items.map((i) => el('div', { class: 'item' },
        i.image ? el('img', { src: i.image, alt: '', loading: 'lazy' }) : el('div', { class: 'ph' }),
        el('div', null,
          el('div', { class: 'item-name', text: i.name }),
          el('div', { class: 'item-sub' },
            i.color ? `اللون: ${i.color} · ` : '',
            'الكمية: ', el('span', { class: 'num', text: i.qty }),
            i.price != null ? [' × ', numEl(i.price)] : '',
          ),
        ),
        i.total != null ? el('div', { style: 'font-weight:600' }, numEl(i.total)) : el('div'),
      )) : [el('div', { class: 'muted', text: 'ماكو منتجات مسجّلة لهذا الطلب' })]));
    } catch (e) {
      if (d._token !== renderToken) return;
      itemsBox.replaceChildren(el('div', { class: 'error', text: friendlyError(e) }));
    }
  }

  // ================= الجلسة =================
  async function showApp() {
    // admin = كل الأقسام، staff (موظف) = الطلبات والدردشة بس
    const { data: role, error } = await db.rpc('my_staff_role');
    if (error || !role) {
      await db.auth.signOut();
      showLogin(error ? friendlyError(error) : 'هذا الحساب ما عنده صلاحية على لوحة الطلبات');
      return;
    }
    adm.role = role;
    document.querySelectorAll('.section-nav button').forEach((b) => {
      b.classList.toggle('hidden', role !== 'admin' && !['orders', 'chat'].includes(b.dataset.section));
    });
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    updateNotifyBtn();
    loadCategories();
    await loadOrders();
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(() => { if (!document.hidden) pollNew(); }, POLL_MS);
    // المحادثات: عدد اللي تنتظر رد + تنبيه من يراسل زبون
    chat.primed = false;
    chatPoll();
    clearInterval(chat.listTimer);
    chat.listTimer = setInterval(() => { if (!document.hidden) chatPoll(); }, 15000);
    handleDeepLink();
  }

  // روابط إشعارات الموظفين: #order=123 يفتح الطلب، #chat=45 يفتح المحادثة
  function handleDeepLink() {
    const m = location.hash.match(/^#(order|chat)=(\d+)$/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    const id = Number(m[2]);
    if (m[1] === 'chat') { chat.openId = id; showSection('chat'); return; }
    openOrderById(id);
  }

  async function openOrderById(id) {
    showSection('orders');
    if (!state.orders.some((o) => o.id === id)) {
      const { data } = await db.from('orders').select(ORDER_COLUMNS).eq('id', id).maybeSingle();
      if (!data) { toast('الطلب غير موجود', true); return; }
      state.orders = [data, ...state.orders];
      renderAll();
    }
    selectOrder(id);
  }
  window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden')) handleDeepLink(); });

  function clearAuthHash() {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }

  function showRecovery() {
    clearInterval(state.pollTimer);
    clearAuthHash();
    $('app').classList.add('hidden');
    $('login').classList.add('hidden');
    $('recovery').classList.remove('hidden');
    $('new-password').focus();
  }

  $('recovery-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const p1 = $('new-password').value;
    const p2 = $('new-password2').value;
    const err = $('recovery-error');
    if (p1.length < 10 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) {
      err.textContent = 'كلمة المرور لازم تكون 10 خانات على الأقل وبيها حروف وأرقام';
      return;
    }
    if (p1 !== p2) { err.textContent = 'كلمتا المرور غير متطابقتين'; return; }
    err.textContent = '';
    $('recovery-btn').disabled = true;
    const { error } = await db.auth.updateUser({ password: p1 });
    $('recovery-btn').disabled = false;
    if (error) {
      err.textContent = /session|expired|JWT/i.test(error.message)
        ? 'انتهت صلاحية الرابط، اطلب رابط استعادة جديد'
        : friendlyError(error);
      return;
    }
    $('new-password').value = '';
    $('new-password2').value = '';
    $('recovery').classList.add('hidden');
    toast('انحفظت كلمة المرور الجديدة');
    await showApp();
  });

  $('forgot-btn').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) { $('login-error').textContent = 'اكتب بريدك الإلكتروني أولاً، وبعدها اضغط نسيت كلمة المرور'; return; }
    $('forgot-btn').disabled = true;
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname,
    });
    $('forgot-btn').disabled = false;
    if (error) { $('login-error').textContent = friendlyError(error); return; }
    $('login-error').textContent = '';
    toast('إذا البريد مسجّل، راح توصلك رسالة فيها رابط تغيير كلمة المرور');
  });

  function showLogin(message = '') {
    clearInterval(state.pollTimer);
    if (typeof chat !== 'undefined') { clearInterval(chat.listTimer); stopThreadPoll(); }
    $('app').classList.add('hidden');
    $('recovery').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-error').textContent = message;
    $('login-btn').disabled = false;
    $('login-btn').textContent = 'دخول';
  }

  // ================= المنتجات والمقاطع =================
  const BUCKET = 'hijabat';
  const MAX_VIDEO_MB = 50;
  const PRODUCT_COLS = 'id, name, price, old_price, stock, product_cost, category_id, colors, description, is_offer, offer_ends_at, image_url, sales_count, created_at, bulk_tiers, unit_tiers, offer_group, is_wholesale, min_qty';
  const adm = {
    section: 'orders',
    categories: [],
    products: [],
    productsLoaded: false,
    clips: [],
    clipsLoaded: false,
    search: '',
    cat: 0,
    stock: 'all',
  };

  function showSection(name) {
    adm.section = name;
    ['orders', 'chat', 'products', 'clips', 'push', 'looks', 'stories', 'splash', 'influencers', 'gifts', 'offers', 'appui', 'profit'].forEach((s) => $('sec-' + s).classList.toggle('hidden', s !== name));
    document.querySelectorAll('.section-nav button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.section === name)));
    if (name !== 'orders' && state.selectedId) closeDetail();
    if (name === 'products' && !adm.productsLoaded) loadProducts();
    if (name === 'clips' && !adm.clipsLoaded) loadClips();
    if (name === 'push') openPush();
    if (name === 'looks') openLooks();
    if (name === 'stories') openStories();
    if (name === 'splash') openSplash();
    if (name === 'influencers') openInfluencers();
    if (name === 'gifts') openGifts();
    if (name === 'offers') openOffers();
    if (name === 'appui') openAppUi();
    if (name === 'profit') openProfit();
    if (name === 'chat') openChat(); else stopThreadPoll();
    window.scrollTo(0, 0);
  }

  const catName = (id) => (adm.categories.find((c) => c.id === id) || {}).name || 'بدون فئة';
  const productName = (id) => (adm.products.find((p) => p.id === id) || {}).name || (id ? `منتج رقم ${id}` : 'بدون منتج');

  async function loadCategories() {
    const { data, error } = await db.from('categories').select('id, name').order('id');
    if (error) { toast(friendlyError(error), true); return; }
    adm.categories = data || [];
    $('prod-cat').replaceChildren(
      el('option', { value: '0', text: 'كل الفئات' }),
      ...adm.categories.map((c) => el('option', { value: c.id, text: c.name })),
    );
  }

  async function loadProducts() {
    $('prod-list').replaceChildren(el('div', { class: 'empty', text: 'جاري تحميل المنتجات...' }));
    if (!adm.categories.length) await loadCategories();
    const { data, error } = await db.from('products').select(PRODUCT_COLS).order('id', { ascending: false }).limit(2000);
    if (error) {
      $('prod-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) }));
      return;
    }
    // كلفة الشراء محفوظة بجدول خاص بالأدمن بس (ما تنقرا من جدول المنتجات)
    const costs = await productCosts();
    adm.products = (data || []).map((p) => (costs.has(p.id) ? { ...p, product_cost: costs.get(p.id) } : p));
    adm.productsLoaded = true;
    renderProducts();
  }

  async function productCosts() {
    const { data, error } = await db.rpc('admin_product_costs');
    if (error) return new Map();
    return new Map((data || []).map((c) => [c.product_id, c.cost]));
  }

  function renderProducts() {
    const q = adm.search.trim();
    const rows = adm.products.filter((p) => {
      if (adm.cat && p.category_id !== adm.cat) return false;
      if (adm.stock === 'in' && !(p.stock > 0)) return false;
      if (adm.stock === 'out' && p.stock > 0) return false;
      if (q && !(p.name || '').includes(q) && String(p.id) !== q) return false;
      return true;
    });
    $('prod-count').textContent = `${rows.length} منتج`;
    if (!rows.length) {
      $('prod-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو منتجات تطابق البحث' }));
      return;
    }
    $('prod-list').replaceChildren(...rows.map((p) => {
      const img = Array.isArray(p.image_url) && p.image_url[0];
      const stock = Number(p.stock) || 0;
      return el('button', { class: 'prod-row', type: 'button', onclick: () => openProductEditor(p) },
        img ? el('img', { src: img, alt: '', loading: 'lazy' }) : el('div', { class: 'ph' }),
        el('div', null,
          el('div', { class: 'prod-name', text: p.name || 'بدون اسم' }),
          el('div', { class: 'prod-meta' },
            el('span', { text: catName(p.category_id) }),
            el('span', { class: 'num', text: '#' + p.id }),
            p.sales_count ? el('span', { text: `بيع ${p.sales_count}` }) : null,
          ),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            stock > 0 ? el('span', { class: 'badge green', text: `المخزون ${stock}` }) : el('span', { class: 'badge red', text: 'مخفي / نفد' }),
            p.is_offer ? el('span', { class: 'badge orange', text: 'عرض' }) : null,
            (p.colors || []).length ? el('span', { class: 'badge', text: `${p.colors.length} ألوان` }) : null,
            (p.bulk_tiers || []).length ? el('span', { class: 'badge orange', text: 'عرض كمية' }) : null,
            p.is_wholesale ? el('span', { class: 'badge', text: p.min_qty ? `جملة · أقل ${p.min_qty}` : 'جملة' }) : null,
            p.offer_group ? el('span', { class: 'badge', text: `مجموعة: ${p.offer_group}` }) : null,
          ),
        ),
        el('div', { style: 'text-align:end' },
          el('div', { style: 'font-weight:700' }, numEl(p.price), ' د.ع'),
          Number(p.old_price) > Number(p.price) ? el('div', { class: 'muted', style: 'font-size:12px;text-decoration:line-through' }, numEl(p.old_price)) : null,
        ),
      );
    }));
  }

  // ---------- رفع الملفات ----------
  function safeFileName(name, ext) {
    const base = String(name || 'file').replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '_').slice(-40) || 'file';
    return `${base}.${ext}`;
  }

  async function compressImage(file, maxSide = 1400, quality = 0.85) {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch {
      throw new Error(`صيغة الصورة "${file.name}" غير مدعومة، استخدم JPG أو PNG`);
    }
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale);
    const h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
    if (!blob) throw new Error('تعذر تجهيز الصورة');
    return blob;
  }

  async function uploadFile(blob, originalName, ext, contentType) {
    const path = `public/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeFileName(originalName, ext)}`;
    const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType, cacheControl: '31536000', upsert: false });
    if (error) throw error;
    return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  function storagePathFromUrl(url) {
    const marker = `/object/public/${BUCKET}/`;
    const i = String(url || '').indexOf(marker);
    return i >= 0 ? decodeURIComponent(url.slice(i + marker.length)) : null;
  }

  // ---------- محرر المنتج ----------
  function openProductEditor(product) {
    const dlg = $('product-dialog');
    const isNew = !product;
    const p = product || { name: '', price: '', old_price: '', stock: 1, product_cost: '', category_id: adm.cat || (adm.categories[0] || {}).id, colors: [], description: '', is_offer: false, offer_ends_at: null, image_url: [], bulk_tiers: [], unit_tiers: null, offer_group: null, is_wholesale: false, min_qty: null };
    // كل صورة: { url } موجودة أو { file, preview } جديدة
    let images = (p.image_url || []).map((url) => ({ url }));

    const f = {
      name: el('input', { class: 'field', required: true, maxlength: 150 }),
      category: el('select', { class: 'field' }, ...adm.categories.map((c) => el('option', { value: c.id, text: c.name }))),
      price: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      oldPrice: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      stock: el('input', { class: 'field', type: 'number', min: 0, step: 1, inputmode: 'numeric', dir: 'ltr' }),
      cost: el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr' }),
      colors: tagInput(p.colors, 'اكتب اللون واضغط Enter'),
      desc: el('textarea', { class: 'field', rows: 4 }),
      offer: el('input', { type: 'checkbox' }),
      ends: el('input', { class: 'field', type: 'datetime-local', dir: 'ltr' }),
      group: el('input', { class: 'field', maxlength: 60, list: 'offer-groups', placeholder: 'مثال: برا 8 آلاف' }),
      wholesale: el('input', { type: 'checkbox' }),
      minQty: el('input', { class: 'field', type: 'number', min: 2, step: 1, inputmode: 'numeric', dir: 'ltr', placeholder: 'مثال: 12' }),
      files: el('input', { type: 'file', accept: 'image/*', multiple: true, class: 'hidden' }),
    };
    f.name.value = p.name || '';
    f.category.value = String(p.category_id || '');
    f.price.value = p.price ?? '';
    f.oldPrice.value = p.old_price ?? '';
    f.stock.value = p.stock ?? 0;
    f.cost.value = p.product_cost ?? '';
    f.desc.value = p.description || '';
    f.offer.checked = !!p.is_offer;
    f.group.value = p.offer_group || '';
    f.wholesale.checked = !!p.is_wholesale;
    f.minQty.value = p.min_qty ?? '';
    if (p.offer_ends_at) {
      const d = new Date(p.offer_ends_at);
      f.ends.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    const thumbs = el('div', { class: 'thumbs' });
    const renderThumbs = () => {
      thumbs.replaceChildren(
        ...images.map((img, i) => el('div', { class: 'thumb' + (i === 0 ? ' main' : '') },
          el('img', { src: img.url || img.preview, alt: '' }),
          el('button', { class: 'x', type: 'button', title: 'حذف الصورة', onclick: () => { images.splice(i, 1); renderThumbs(); } }, '×'),
          i > 0 ? el('button', { class: 'star', type: 'button', title: 'اجعلها الصورة الرئيسية', onclick: () => { images.unshift(images.splice(i, 1)[0]); renderThumbs(); } }, '★') : null,
          i === 0 ? el('div', { class: 'tag', text: 'الرئيسية' }) : null,
        )),
        el('button', { class: 'add-tile', type: 'button', title: 'إضافة صور', onclick: () => f.files.click() }, '+'),
      );
    };
    f.files.addEventListener('change', () => {
      for (const file of f.files.files) {
        if (!file.type.startsWith('image/')) continue;
        images.push({ file, preview: URL.createObjectURL(file) });
      }
      f.files.value = '';
      renderThumbs();
    });
    renderThumbs();

    // ---- عروض الكمية (bulk_tiers): باقات، مثلاً 3 قطع بسعر كلي. الحساب النهائي بالسيرفر (private.bulk_price).
    let tiers = (Array.isArray(p.bulk_tiers) ? p.bulk_tiers : []).map((t) => ({
      qty: t.qty ?? '', price: t.price ?? '', free: t.free_delivery === true,
    }));
    const tiersBox = el('div', { class: 'tiers' });
    const renderTiers = () => {
      const unit = Number(f.price.value) || 0;
      tiersBox.replaceChildren(
        ...tiers.map((t, i) => {
          const qty = el('input', { class: 'field', type: 'number', min: 2, step: 1, inputmode: 'numeric', dir: 'ltr', placeholder: 'عدد القطع' });
          const price = el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr', placeholder: 'السعر الكلي' });
          const free = el('input', { type: 'checkbox' });
          qty.value = t.qty; price.value = t.price; free.checked = t.free;
          const note = el('div', { class: 'help' });
          const updateNote = () => {
            const q = Number(t.qty), pr = Number(t.price), u = Number(f.price.value) || 0;
            if (!(q >= 2) || !(pr > 0)) { note.textContent = ''; return; }
            const regular = q * u;
            note.textContent = `القطعة بـ ${money(pr / q)} د.ع` +
              (regular > pr ? ` · الزبون يوفّر ${money(regular - pr)} د.ع` : '') +
              (regular && regular <= pr && !t.free ? ' · ⚠️ السعر مو أرخص من السعر العادي' : '');
          };
          qty.addEventListener('input', () => { t.qty = qty.value; updateNote(); });
          price.addEventListener('input', () => { t.price = price.value; updateNote(); });
          free.addEventListener('change', () => { t.free = free.checked; updateNote(); });
          updateNote();
          return el('div', { class: 'tier-row' },
            el('div', { class: 'tier-fields' },
              qty,
              el('span', { class: 'muted', text: 'قطع بـ' }),
              price,
              el('label', { class: 'check' }, free, 'توصيل مجاني'),
              el('button', { class: 'btn btn-ghost btn-sm', type: 'button', title: 'حذف العرض', onclick: () => { tiers.splice(i, 1); renderTiers(); } }, '✕'),
            ),
            note,
          );
        }),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { tiers.push({ qty: '', price: '', free: false }); renderTiers(); } }, '+ إضافة عرض كمية'),
        ...(unit ? [] : [el('div', { class: 'help', text: 'اكتب سعر المنتج أول حتى يبين التوفير.' })]),
      );
    };
    f.price.addEventListener('change', renderTiers);
    renderTiers();

    // ---- أسعار الجملة (unit_tiers): كل القطع بسعر الدرجة إذا العدد وصلها. فارغ = الخصم الافتراضي.
    const UNIT_DEFAULT = [{ min: 6, pct: 27.5 }, { min: 12, pct: 27.5 }, { min: 12, pct: 30, mix: true }];
    // "توصيل مجاني من N قطع": درجة بـ unit_tiers عليها free_delivery. بدون سعر = pct 0 (السعر ما يتغير ولا تطلع بشريط الأسعار)،
    // ويه سعر = عرض "من N قطع القطعة بكذا + توصيل مجاني". السيرفر (private.cart_price) والتطبيق يحسبونها.
    const allUnit = Array.isArray(p.unit_tiers) ? p.unit_tiers : (p.unit_tiers == null ? UNIT_DEFAULT : []);
    const fdTier = allUnit.find((t) => t && t.free_delivery === true && !t.mix);
    const isSlotTier = (t) => (Number(t.min) === 6 && !t.mix) || Number(t.min) === 12;
    const srcUnit = allUnit.filter((t) => t !== fdTier && isSlotTier(t));
    // درجات إضافية (مو 6 أو 12 ومو التوصيل المجاني)، مثلاً عرض من 4 قطع: تنحفظ مثل ما هي
    let extraUnit = allUnit.filter((t) => t !== fdTier && !isSlotTier(t));
    const fdMin = el('input', { class: 'field', type: 'number', min: 2, max: 100, step: 1, inputmode: 'numeric', dir: 'ltr', placeholder: 'مثلاً 2', style: 'max-width:110px' });
    fdMin.value = fdTier ? fdTier.min : '';
    const fdPrice = el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr', placeholder: 'نفس السعر', style: 'max-width:140px' });
    fdPrice.value = fdTier && fdTier.price != null && Number(fdTier.price) < Number(p.price) ? fdTier.price : '';
    const extraBox = el('div');
    const renderExtra = () => extraBox.replaceChildren(...extraUnit.map((t, i) => el('div', { class: 'help', style: 'display:flex;gap:8px;align-items:center' },
      `درجة إضافية: من ${t.min} قطع ${t.mix ? '(مكس) ' : ''}القطعة بـ ${t.price != null ? money(t.price) + ' د.ع' : 'خصم ' + t.pct + '%'}`,
      el('button', { class: 'btn btn-ghost btn-sm', type: 'button', title: 'حذف', onclick: () => { extraUnit.splice(i, 1); renderExtra(); } }, '✕'))));
    renderExtra();
    const fdBox = el('div', null,
      el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
        el('span', { class: 'muted', text: 'من' }), fdMin, el('span', { class: 'muted', text: 'قطع، وسعر القطعة' }), fdPrice,
        el('span', { class: 'muted', text: '(فارغ = نفس السعر)' })),
      extraBox);
    function readFd(unitPrice) {
      if (fdMin.value === '') return fdPrice.value === '' ? null : 'اكتبوا عدد القطع للتوصيل المجاني، أو امسحوا السعر';
      const n = Number(fdMin.value);
      if (!Number.isInteger(n) || n < 2 || n > 100) return 'عدد قطع التوصيل المجاني لازم من 2 إلى 100، أو اتركه فارغ';
      if (fdPrice.value === '') return { min: n, pct: 0, free_delivery: true };
      const v = Number(fdPrice.value);
      if (!(v > 0) || v >= unitPrice) return `سعر القطعة بعرض التوصيل المجاني لازم أقل من السعر (${money(unitPrice)} د.ع)، أو اتركه فارغ`;
      return { min: n, price: v, free_delivery: true };
    }
    const unitSlots = [
      { key: '6', label: '6-11 قطعة', min: 6, mix: false },
      { key: '12', label: '12+ قطعة', min: 12, mix: false },
      { key: 'mix', label: 'مكس 12+', min: 12, mix: true },
    ].map((s) => {
      const t = srcUnit.find((x) => Number(x.min) === s.min && !!x.mix === s.mix);
      return { ...s, pct: t ? t.pct ?? null : null, price: t && t.price != null ? t.price : '', on: !!t };
    });
    const unitOff = el('input', { type: 'checkbox' });
    unitOff.checked = Array.isArray(p.unit_tiers) && srcUnit.length === 0;
    const tierUnit = (base, pct) => Math.round(base * (100 - pct) / 100 / 250) * 250;
    const unitBox = el('div', { class: 'tiers' });
    const renderUnit = () => {
      const base = Number(f.price.value) || 0;
      unitBox.replaceChildren(
        el('label', { class: 'check' }, unitOff, 'بدون أسعار جملة لهذا المنتج'),
        ...(unitOff.checked ? [] : unitSlots.map((s) => {
          const def = s.pct != null ? s.pct : (UNIT_DEFAULT.find((x) => x.min === s.min && !!x.mix === s.mix) || {}).pct;
          const input = el('input', { class: 'field', type: 'number', min: 0, step: 250, inputmode: 'numeric', dir: 'ltr',
            placeholder: base ? money(tierUnit(base, def)) : 'سعر القطعة' });
          input.value = s.price;
          input.addEventListener('input', () => { s.price = input.value; });
          return el('div', { class: 'tier-row' }, el('div', { class: 'tier-fields' },
            el('span', { class: 'muted', text: s.label }), input, el('span', { class: 'muted', text: `للقطعة (فارغ = خصم ${def}%)` })));
        })),
      );
    };
    unitOff.addEventListener('change', renderUnit);
    f.price.addEventListener('change', renderUnit);
    renderUnit();

    function readUnitTiers(unitPrice) {
      if (unitOff.checked) return [];
      const out = [];
      for (const s of unitSlots) {
        const def = s.pct != null ? s.pct : (UNIT_DEFAULT.find((x) => x.min === s.min && !!x.mix === s.mix) || {}).pct;
        const base = { min: s.min, ...(s.mix ? { mix: true } : {}) };
        if (s.price === '' || s.price == null) { out.push({ ...base, pct: def }); continue; }
        const v = Number(s.price);
        if (!(v > 0) || v >= unitPrice) return `سعر ${s.label} لازم يكون أقل من سعر القطعة (${money(unitPrice)} د.ع)`;
        out.push({ ...base, price: v });
      }
      return out;
    }

    // يرجع مصفوفة jsonb أو رسالة خطأ
    function readTiers(unitPrice) {
      const out = [];
      for (const t of tiers) {
        if (t.qty === '' && t.price === '') continue;
        const qty = Number(t.qty), price = Number(t.price);
        if (!Number.isInteger(qty) || qty < 2) return 'عدد القطع بعرض الكمية لازم يكون 2 أو أكثر';
        if (!(price > 0)) return 'اكتب سعر صحيح لعرض الكمية';
        const pcs = qty === 2 ? 'قطعتين' : `${qty} قطع`;
        if (out.some((x) => x.qty === qty)) return `اكو عرضين لنفس العدد (${pcs})`;
        if (price >= qty * unitPrice && !t.free) return `عرض ${pcs} مو أرخص من السعر العادي (${money(qty * unitPrice)} د.ع)`;
        out.push(t.free ? { qty, price, free_delivery: true } : { qty, price });
      }
      return out.sort((a, b) => a.qty - b.qty);
    }

    const err = el('div', { class: 'error', role: 'alert' });
    const saveBtn = el('button', { class: 'btn btn-primary', type: 'button' }, isNew ? 'إضافة المنتج' : 'حفظ التعديلات');

    const field = (label, input, opts = {}) => el('div', { class: opts.full ? 'full' : null },
      el('label', { class: 'lbl', text: label }), input, opts.help ? el('div', { class: 'help', text: opts.help }) : null);

    async function save(extra = {}) {
      err.textContent = '';
      const name = f.name.value.trim();
      const price = Number(f.price.value);
      const stock = Number(f.stock.value);
      const oldPrice = f.oldPrice.value === '' ? null : Number(f.oldPrice.value);
      const cost = f.cost.value === '' ? null : Number(f.cost.value);
      const colors = f.colors.values();
      if (!name) { err.textContent = 'اكتب اسم المنتج'; return; }
      if (!f.category.value) { err.textContent = 'اختر الفئة'; return; }
      if (!(price > 0)) { err.textContent = 'اكتب سعر صحيح'; return; }
      if (!(stock >= 0) || !Number.isInteger(stock)) { err.textContent = 'اكتب كمية صحيحة'; return; }
      if (oldPrice !== null && oldPrice <= price) { err.textContent = 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي، أو اتركه فارغ'; return; }
      if (!images.length) { err.textContent = 'أضف صورة وحدة على الأقل'; return; }
      const bulkTiers = readTiers(price);
      if (typeof bulkTiers === 'string') { err.textContent = bulkTiers; return; }
      const unitTiers = readUnitTiers(price);
      if (typeof unitTiers === 'string') { err.textContent = unitTiers; return; }
      const fdT = readFd(price);
      if (typeof fdT === 'string') { err.textContent = fdT; return; }
      // الباقات تلغي أسعار الجملة (بالتطبيق والسيرفر)، فننبه إذا الثنين موجودين
      if (bulkTiers.length && unitTiers.length) {
        const onlyFree = bulkTiers.every((t) => t.free_delivery && Number(t.price) >= t.qty * price);
        const ok = await confirmDialog('عروض كمية + أسعار جملة؟',
          'عروض الكمية (الباقات) تلغي أسعار الجملة (6-11 و 12+) لهذا المنتج، فالزبون ما راح يشوفها ولا تنحسب.'
          + (onlyFree
            ? ' عرض الكمية هنا بس توصيل مجاني بنفس السعر: الأفضل تحذفونه وتكتبون العدد بخانة "توصيل مجاني من"، حتى تبقى أسعار الجملة.'
            : ' حتى تبقى أسعار الجملة: احذفوا عرض الكمية واكتبوا العدد وسعر القطعة بخانة "توصيل مجاني من".')
          + ' تكملون الحفظ هيج؟', 'أحفظ هيج');
        if (!ok) return;
      }
      const offerGroup = f.group.value.trim() || null;
      const minQty = f.minQty.value === '' ? null : Number(f.minQty.value);
      if (minQty !== null && (!Number.isInteger(minQty) || minQty < 2 || minQty > 1000)) { err.textContent = 'أقل كمية لازم رقم صحيح من 2 إلى 1000، أو اتركها فارغة'; return; }
      if (offerGroup) {
        if (!bulkTiers.length && !fdT && !unitTiers.length) { err.textContent = 'مجموعة العرض تحتاج عرض كمية أو أسعار جملة أو توصيل مجاني على المنتج'; return; }
        // كل منتجات المجموعة لازم نفس السعر ونفس عروض الكمية، حتى ما تختلط عروض مختلفة
        const sig = (tiers) => JSON.stringify((tiers || []).map((t) => [Number(t.qty), Number(t.price), t.free_delivery === true]).sort((a, b) => a[0] - b[0]));
        const other = adm.products.find((x) => x.id !== p.id && (x.offer_group || '').trim() === offerGroup
          && (Number(x.price) !== price || sig(x.bulk_tiers) !== sig(bulkTiers)));
        if (other) {
          err.textContent = `المجموعة "${offerGroup}" بيها "${other.name}" (#${other.id}) بسعر أو عرض مختلف. خلي السعر والعرض نفسه، أو غيّر اسم المجموعة.`;
          return;
        }
      }

      dlg.querySelectorAll('button, input, select, textarea').forEach((x) => { x.disabled = true; });
      try {
        const urls = [];
        let n = 0;
        const toUpload = images.filter((i) => i.file).length;
        for (const img of images) {
          if (img.url) { urls.push(img.url); continue; }
          n++;
          saveBtn.textContent = `جاري رفع الصور ${n}/${toUpload}...`;
          const blob = await compressImage(img.file);
          urls.push(await uploadFile(blob, img.file.name, 'jpg', 'image/jpeg'));
        }
        saveBtn.textContent = 'جاري الحفظ...';
        const payload = {
          name,
          category_id: Number(f.category.value),
          price,
          old_price: oldPrice,
          stock,
          product_cost: cost,
          colors,
          description: f.desc.value.trim() || null,
          is_offer: f.offer.checked,
          offer_ends_at: f.offer.checked && f.ends.value ? new Date(f.ends.value).toISOString() : null,
          image_url: urls,
          bulk_tiers: bulkTiers,
          unit_tiers: [...unitTiers, ...extraUnit, ...(fdT ? [fdT] : [])],
          offer_group: offerGroup,
          is_wholesale: f.wholesale.checked,
          min_qty: minQty,
          ...extra,
        };
        const q = isNew
          ? db.from('products').insert(payload).select(PRODUCT_COLS).single()
          : db.from('products').update(payload).eq('id', p.id).select(PRODUCT_COLS).single();
        const { data, error } = await q;
        if (error) throw error;
        // السيرفر ينقل الكلفة للجدول الخاص ويرجّعها فارغة، فنعرض القيمة اللي انحفظت
        if (cost != null) data.product_cost = cost;
        else if (!isNew && p.product_cost != null) data.product_cost = p.product_cost;
        if (isNew) adm.products.unshift(data);
        else adm.products[adm.products.findIndex((x) => x.id === p.id)] = data;
        dlg.close();
        renderProducts();
        toast(isNew ? `انضاف المنتج #${data.id} وصار يظهر بالتطبيق` : 'انحفظت التعديلات');
      } catch (e) {
        err.textContent = friendlyError(e);
        dlg.querySelectorAll('button, input, select, textarea').forEach((x) => { x.disabled = false; });
        saveBtn.textContent = isNew ? 'إضافة المنتج' : 'حفظ التعديلات';
      }
    }
    saveBtn.addEventListener('click', () => save());

    dlg.replaceChildren(
      el('div', { class: 'sheet-head' },
        el('h3', { text: isNew ? 'منتج جديد' : `تعديل المنتج #${p.id}` }),
        el('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: () => dlg.close(), 'aria-label': 'إغلاق' }, '✕'),
      ),
      el('div', { class: 'sheet-body' },
        el('div', { class: 'form-grid' },
          field('الصور (الأولى هي الرئيسية)', el('div', null, thumbs, f.files), { full: true, help: 'تنضغط تلقائياً قبل الرفع حتى تفتح بسرعة بالتطبيق.' }),
          field('اسم المنتج *', f.name, { full: true }),
          field('الفئة *', f.category),
          field('الكمية بالمخزون *', f.stock, { help: 'إذا صارت 0 المنتج يختفي من التطبيق.' }),
          field('السعر (د.ع) *', f.price),
          field('السعر قبل الخصم', f.oldPrice, { help: 'اتركه فارغ إذا ماكو خصم.' }),
          field('الألوان', f.colors.node, { full: true, help: 'اكتب اللون واضغط Enter (أو فاصلة) حتى يثبت، و× يمسحه. تكدر تلصق قائمة كاملة مفصولة بفواصل. إذا اكو ألوان، الزبون لازم يختار واحد قبل الإضافة للسلة.' }),
          field('أسعار الجملة (سعر القطعة حسب العدد)', unitBox, { full: true, help: 'إذا مجموع القطع (كل الألوان) وصل 6، كل القطع تنحسب بسعر 6-11، وإذا وصل 12 بسعر 12+. "مكس" للزبونة الي تختار "مكس ألوان" (إنتو تختارون الألوان) إذا طلبت 12 أو أكثر. إذا المنتج بيه "عروض كمية" (باقات)، الباقات هي الي تنحسب بداله.' }),
          field('🚚 توصيل مجاني من (عدد القطع، اختياري)', fdBox, { full: true, help: 'إذا الزبون طلب هذا العدد من المنتج (كل الألوان، ويه منتجات مجموعة العرض إذا اكو)، التوصيل يصير مجاني. سعر القطعة اختياري: إذا كتبتوه، من هذا العدد كل القطع بهذا السعر (مثلاً من 4 قطع بـ 3,750) وأسعار الجملة 6+ و 12+ تبقى. فارغ = بدون. (منفصل عن "التوصيل المجاني حسب عدد القطع" للطلب كله بقسم العروض.)' }),
          field('عروض الكمية', tiersBox, { full: true, help: 'مثال: 3 قطع بـ 15,000. تنحسب باقات: 7 قطع مع عرض 3 = باقتين + قطعة بالسعر العادي. الكمية تنجمع عبر كل الألوان، وإذا وصل عرض بيه توصيل مجاني يصير التوصيل مجاني على الطلب كله.' }),
          el('div', null, el('label', { class: 'check' }, f.wholesale, 'منتج جملة (اختيار ألوان متعددة)'),
            el('div', { class: 'help', text: 'الزبون يختار أكثر من لون مرة وحدة، ولكل لون عدد.' })),
          field('أقل كمية للطلب (اختياري)', f.minQty, { help: 'مجموع كل الألوان. السيرفر يرفض الطلب إذا أقل.' }),
          field('مجموعة العرض (اختياري)', el('div', null, f.group,
            el('datalist', { id: 'offer-groups' }, ...[...new Set(adm.products.map((x) => (x.offer_group || '').trim()).filter(Boolean))].map((g) => el('option', { value: g })))),
            { full: true, help: 'المنتجات بنفس المجموعة تتجمع قطعها للعرض، مثلاً قطعة من موديل وقطعة من موديل ثاني = قطعتين. لازم كلها نفس السعر ونفس عرض الكمية. اتركه فارغ إذا المنتج لحاله.' }),
          field('الوصف', f.desc, { full: true }),
          el('div', null, el('label', { class: 'check' }, f.offer, 'يظهر بقسم العروض')),
          field('ينتهي العرض (اختياري)', f.ends, { help: 'إذا حددته، يظهر عدّاد تنازلي بعروض الفلاش. لما يخلص الوقت العرض يخلص فعلاً: إذا اكو سعر قديم مشطوب، السعر يرجع له تلقائياً والمنتج يطلع من العروض.' }),
          field('كلفة الشراء (داخلي)', f.cost, { help: 'لحساب الربح، ما تنعرض بصفحة المنتج.' }),
        ),
        err,
      ),
      el('div', { class: 'sheet-foot' },
        saveBtn,
        !isNew && Number(p.stock) > 0
          ? el('button', { class: 'btn btn-danger', type: 'button', onclick: async () => {
              const ok = await confirmDialog('إخفاء المنتج؟', 'راح يصير المخزون 0 ويختفي من التطبيق. تگدر ترجعه بتغيير الكمية.', 'إخفاء');
              if (ok) { f.stock.value = 0; save(); }
            } }, 'إخفاء من التطبيق')
          : null,
        el('button', { class: 'btn', type: 'button', onclick: () => dlg.close() }, 'إلغاء'),
      ),
    );
    dlg.showModal();
    if (isNew) setTimeout(() => f.name.focus(), 50);
  }

  // ---------- المقاطع ----------
  async function loadClips() {
    $('clip-list').replaceChildren(el('div', { class: 'empty', text: 'جاري تحميل المقاطع...' }));
    if (!adm.productsLoaded) await loadProducts();
    renderNewClip();
    const { data, error } = await db.from('clips').select('id, created_at, video_url, product_id').order('created_at', { ascending: false });
    if (error) {
      $('clip-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) }));
      return;
    }
    adm.clips = data || [];
    adm.clipsLoaded = true;
    renderClips();
  }

  // ---------- إعلان الافتتاح ----------
  // صورة كاملة تطلع لما ينفتح التطبيق (نسخة 1.7.8+). التطبيق ياخذ أول إعلان فعّال حسب الترتيب.
  adm.splash = [];
  async function openSplash() {
    if (!adm.productsLoaded) await loadProducts();
    if (!adm.categories.length) await loadCategories();
    if (!$('splash-editor').childElementCount) renderSplashEditor(null);
    loadSplash();
  }

  async function loadSplash() {
    $('splash-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('splash_ads').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
    if (error) { $('splash-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    adm.splash = data || [];
    renderSplash();
  }

  function renderSplash() {
    if (!adm.splash.length) {
      $('splash-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو إعلانات افتتاح لحد هسه' }));
      return;
    }
    const now = Date.now();
    const live = (a) => a.is_active && (!a.starts_at || new Date(a.starts_at) <= now) && (!a.ends_at || new Date(a.ends_at) > now);
    const current = adm.splash.find(live);
    $('splash-list').replaceChildren(
      el('h3', { text: 'الإعلانات', style: 'margin:6px 0 10px' }),
      el('div', { class: 'help', style: 'margin-bottom:10px', text: 'يطلع إعلان واحد بس: أول واحد فعّال حسب الترتيب. الإعلان الجديد يوصل للموبايل بالخلفية ويطلع من الفتحة الجاية للتطبيق.' }),
      ...adm.splash.map((a) => el('div', { class: 'look-card' },
        el('img', { class: 'story-thumb', src: a.image_url, alt: '' }),
        el('div', { style: 'flex:1' },
          el('div', { class: 'prod-name', text: a.title || '(بدون عنوان)' }),
          el('div', { class: 'help', text: storyLinkText(a) + (a.link_type !== 'none' ? ' · زر: ' + a.button_text : '') }),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            current && current.id === a.id ? el('span', { class: 'badge green', text: 'ظاهر بالتطبيق' })
              : el('span', { class: 'badge ' + (live(a) ? '' : 'red'), text: !a.is_active ? 'موقوف' : live(a) ? 'بالانتظار (ترتيبه بعد غيره)' : 'خارج وقته' }),
            el('span', { text: a.duration_sec + ' ثواني' }),
            el('span', { text: a.min_hours_between ? 'مرة كل ' + a.min_hours_between + ' ساعة' : 'كل فتحة' }),
            a.ends_at ? el('span', { text: 'ينتهي ' + dtFull.format(new Date(a.ends_at)) }) : null,
          ),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderSplashEditor(a); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'تعديل'),
            el('button', { class: 'btn btn-sm', type: 'button', onclick: async () => {
              const { error } = await db.from('splash_ads').update({ is_active: !a.is_active }).eq('id', a.id);
              if (error) { toast(friendlyError(error), true); return; }
              loadSplash();
            } }, a.is_active ? 'إيقاف' : 'تفعيل'),
            el('button', { class: 'btn btn-danger btn-sm', type: 'button', onclick: async () => {
              const ok = await confirmDialog('حذف الإعلان؟', 'راح ينشال من التطبيق.', 'حذف');
              if (!ok) return;
              const { error } = await db.from('splash_ads').delete().eq('id', a.id);
              if (error) { toast(friendlyError(error), true); return; }
              const path = storagePathFromUrl(a.image_url);
              if (path) await db.storage.from(BUCKET).remove([path]);
              toast('انحذف');
              loadSplash();
            } }, 'حذف'),
          ),
        ),
      )),
    );
  }

  function renderSplashEditor(ad) {
    const box = $('splash-editor');
    let image = ad ? ad.image_url : null;
    const title = el('input', { class: 'field', maxlength: 40, placeholder: 'للإدارة بس، مثال: عرض الجفسة', value: ad ? ad.title : '' });
    const order = el('input', { class: 'field', type: 'number', value: ad ? ad.sort_order : 0, style: 'max-width:120px' });
    const active = el('input', { type: 'checkbox' });
    active.checked = ad ? ad.is_active : true;
    const toLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
    const starts = el('input', { class: 'field', type: 'datetime-local', value: toLocal(ad && ad.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: toLocal(ad && ad.ends_at) });
    const duration = el('select', { class: 'field' }, ...[2, 3, 4, 5, 6, 8].map((n) => el('option', { value: n, text: n + ' ثواني' })));
    duration.value = String(ad ? ad.duration_sec : 3);
    const hours = el('select', { class: 'field' },
      ...[[0, 'كل مرة ينفتح التطبيق'], [3, 'مرة كل 3 ساعات'], [6, 'مرة كل 6 ساعات'], [12, 'مرة كل 12 ساعة'], [24, 'مرة باليوم']].map(([v, t]) => el('option', { value: v, text: t })));
    hours.value = String(ad ? ad.min_hours_between : 6);
    const buttonText = el('input', { class: 'field', maxlength: 30, value: ad ? ad.button_text : 'تسوّقي هسه' });
    const file = el('input', { type: 'file', accept: 'image/*', class: 'field' });
    const preview = el('img', { class: 'story-preview', alt: '' });
    const linkType = el('select', { class: 'field' }, ...STORY_LINKS.map(([v, t]) => el('option', { value: v, text: t })));
    linkType.value = ad ? ad.link_type : 'none';
    const picker = productPicker(ad && ad.link_type === 'product' ? Number(ad.link_value) : null, 'ابحث عن المنتج');
    const cat = el('select', { class: 'field' }, ...adm.categories.map((c) => el('option', { value: c.id, text: c.name })));
    if (ad && ad.link_type === 'category') cat.value = ad.link_value;
    const price = el('input', { class: 'field', type: 'number', min: 500, step: 500, placeholder: 'مثلاً 5000', value: ad && ad.link_type === 'price' ? ad.link_value : '' });
    const valueBox = el('div');
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, ad ? 'حفظ التعديل' : 'حفظ الإعلان');

    const drawPreview = () => { preview.classList.toggle('hidden', !image); if (image) preview.src = image; };
    const drawValue = () => {
      const t = linkType.value;
      valueBox.replaceChildren(
        t === 'product' ? el('div', null, picker.search, el('div', { style: 'height:4px' }), picker.select) : '',
        t === 'category' ? cat : '',
        t === 'price' ? price : '',
      );
    };
    linkType.addEventListener('change', drawValue);

    file.addEventListener('change', async () => {
      err.textContent = '';
      const img = file.files[0];
      if (!img) return;
      save.disabled = true;
      try {
        const blob = await compressImage(img, 1920, 0.85);
        image = await uploadFile(blob, img.name, 'jpg', 'image/jpeg');
        drawPreview();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        save.disabled = false;
      }
    });

    save.addEventListener('click', async () => {
      err.textContent = '';
      if (!image) { err.textContent = 'ارفع صورة الإعلان'; return; }
      const t = linkType.value;
      let value = null;
      if (t === 'product') { value = picker.select.value; if (!value) { err.textContent = 'اختر المنتج'; return; } }
      if (t === 'category') { value = cat.value; if (!value) { err.textContent = 'اختر القسم'; return; } }
      if (t === 'price') { value = price.value; if (!(Number(value) > 0)) { err.textContent = 'اكتب السعر'; return; } }
      if (t !== 'none' && !buttonText.value.trim()) { err.textContent = 'اكتب نص الزر'; return; }
      const row = {
        title: title.value.trim(),
        image_url: image,
        link_type: t,
        link_value: value,
        button_text: buttonText.value.trim() || 'تسوّقي هسه',
        duration_sec: Number(duration.value),
        min_hours_between: Number(hours.value),
        is_active: active.checked,
        sort_order: Number(order.value) || 0,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
      };
      save.disabled = true;
      const q = ad ? db.from('splash_ads').update(row).eq('id', ad.id) : db.from('splash_ads').insert(row);
      const { error } = await q;
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(ad ? 'انحفظ التعديل ✅' : 'انضاف الإعلان ✅');
      renderSplashEditor(null);
      loadSplash();
    });

    drawPreview();
    drawValue();
    box.replaceChildren(
      el('h3', { text: ad ? 'تعديل إعلان الافتتاح' : 'إعلان افتتاح جديد', style: 'margin:0' }),
      el('div', { class: 'help', text: 'صورة طولية (1080×1920 أحسن). تطلع بالشاشة كاملة لما ينفتح التطبيق، ويه زر "تخطي". خلي الكتابة المهمة بنص الصورة، لأن زر العرض يطلع تحت.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'اسم الإعلان' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'الترتيب (الأصغر يطلع أول)' }), order),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'الصورة' }), file),
      ),
      preview,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'الزر يفتح' }), linkType),
        el('div', null, el('label', { class: 'lbl', text: ' ' }), valueBox),
        el('div', null, el('label', { class: 'lbl', text: 'نص الزر' }), buttonText),
        el('div', null, el('label', { class: 'lbl', text: 'مدة العرض' }), duration),
        el('div', null, el('label', { class: 'lbl', text: 'كم مرة يطلع للزبونة' }), hours),
        el('div', null, el('label', { class: 'lbl', text: ' ' }), el('label', { style: 'display:flex;gap:8px;align-items:center;margin-top:10px' }, active, 'فعّال')),
        el('div', null, el('label', { class: 'lbl', text: 'يبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'ينتهي (اختياري)' }), ends),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
        save,
        ad ? el('button', { class: 'btn', type: 'button', onclick: () => renderSplashEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ---------- ستوري الصور ----------
  // صورة طولية (1080×1920 أحسن) تطلع بأول الواجهة. بالتطبيق تبقى 5 ثواني، وزر "تسوّقي هسه" يفتح الرابط.
  const STORY_LINKS = [
    ['none', 'بدون رابط'],
    ['product', 'منتج'],
    ['category', 'قسم'],
    ['price', 'تحت سعر معيّن'],
    ['bulk', 'عروض الكمية'],
    ['offers', 'العروض'],
  ];
  adm.stories = [];
  async function openStories() {
    if (!adm.productsLoaded) await loadProducts();
    if (!adm.categories.length) await loadCategories();
    if (!$('story-editor').childElementCount) renderStoryEditor(null);
    loadStories();
  }

  async function loadStories() {
    $('story-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('stories').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
    if (error) { $('story-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    adm.stories = data || [];
    renderStories();
  }

  function storyLinkText(st) {
    const v = st.link_value;
    switch (st.link_type) {
      case 'product': { const p = adm.products.find((x) => String(x.id) === String(v)); return 'منتج: ' + (p ? p.name : '#' + v); }
      case 'category': return 'قسم: ' + catName(Number(v));
      case 'price': return 'تحت ' + Number(v).toLocaleString('en') + ' د.ع';
      case 'bulk': return 'عروض الكمية';
      case 'offers': return 'العروض';
      default: return 'بدون رابط';
    }
  }

  function renderStories() {
    if (!adm.stories.length) {
      $('story-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو ستوريات صور لحد هسه' }));
      return;
    }
    const now = Date.now();
    const live = (st) => st.is_active && (!st.starts_at || new Date(st.starts_at) <= now) && (!st.ends_at || new Date(st.ends_at) > now);
    $('story-list').replaceChildren(
      el('h3', { text: 'الستوريات', style: 'margin:6px 0 10px' }),
      el('div', { class: 'help', style: 'margin-bottom:10px', text: 'الترتيب الأصغر يطلع أول. فيديوهات قسم "المقاطع" تطلع هم ستوري بعد الصور.' }),
      ...adm.stories.map((st) => el('div', { class: 'look-card' },
        el('img', { class: 'story-thumb', src: st.image_url, alt: '' }),
        el('div', { style: 'flex:1' },
          el('div', { class: 'prod-name', text: st.title || '(بدون عنوان)' }),
          el('div', { class: 'help', text: storyLinkText(st) }),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            live(st) ? el('span', { class: 'badge green', text: 'ظاهر بالتطبيق' }) : el('span', { class: 'badge red', text: st.is_active ? 'خارج وقته' : 'موقوف' }),
            el('span', { text: 'ترتيب ' + st.sort_order }),
            st.ends_at ? el('span', { text: 'ينتهي ' + dtFull.format(new Date(st.ends_at)) }) : null,
          ),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderStoryEditor(st); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'تعديل'),
            el('button', { class: 'btn btn-sm', type: 'button', onclick: async () => {
              const { error } = await db.from('stories').update({ is_active: !st.is_active }).eq('id', st.id);
              if (error) { toast(friendlyError(error), true); return; }
              loadStories();

  function renderStoryEditor(story) {
    const box = $('story-editor');
    let image = story ? story.image_url : null;
    const title = el('input', { class: 'field', maxlength: 20, placeholder: 'مثال: عرض الجفسة', value: story ? story.title : '' });
    const order = el('input', { class: 'field', type: 'number', value: story ? story.sort_order : 0, style: 'max-width:120px' });
    const active = el('input', { type: 'checkbox' });
    active.checked = story ? story.is_active : true;
    const toLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
    const starts = el('input', { class: 'field', type: 'datetime-local', value: toLocal(story && story.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: toLocal(story && story.ends_at) });
    const file = el('input', { type: 'file', accept: 'image/*', class: 'field' });
    const preview = el('img', { class: 'story-preview', alt: '' });
    const linkType = el('select', { class: 'field' }, ...STORY_LINKS.map(([v, t]) => el('option', { value: v, text: t })));
    linkType.value = story ? story.link_type : 'none';
    const picker = productPicker(story && story.link_type === 'product' ? Number(story.link_value) : null, 'ابحث عن المنتج');
    const cat = el('select', { class: 'field' }, ...adm.categories.map((c) => el('option', { value: c.id, text: c.name })));
    if (story && story.link_type === 'category') cat.value = story.link_value;
    const price = el('input', { class: 'field', type: 'number', min: 500, step: 500, placeholder: 'مثلاً 5000', value: story && story.link_type === 'price' ? story.link_value : '' });
    const valueBox = el('div');
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, story ? 'حفظ التعديل' : 'حفظ الستوري');

    const drawPreview = () => {
      preview.classList.toggle('hidden', !image);
      if (image) preview.src = image;
    };
    const drawValue = () => {
      const t = linkType.value;
      valueBox.replaceChildren(
        t === 'product' ? el('div', null, picker.search, el('div', { style: 'height:4px' }), picker.select) : '',
        t === 'category' ? cat : '',
        t === 'price' ? price : '',
      );
    };
    linkType.addEventListener('change', drawValue);

    file.addEventListener('change', async () => {
      err.textContent = '';
      const img = file.files[0];
      if (!img) return;
      save.disabled = true;
      try {
        const blob = await compressImage(img, 1920, 0.85);
        image = await uploadFile(blob, img.name, 'jpg', 'image/jpeg');
        drawPreview();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        save.disabled = false;
      }
    });

    save.addEventListener('click', async () => {
      err.textContent = '';
      if (!image) { err.textContent = 'ارفع صورة الستوري'; return; }
      const t = linkType.value;
      let value = null;
      if (t === 'product') { value = picker.select.value; if (!value) { err.textContent = 'اختر المنتج'; return; } }
      if (t === 'category') { value = cat.value; if (!value) { err.textContent = 'اختر القسم'; return; } }
      if (t === 'price') { value = price.value; if (!(Number(value) > 0)) { err.textContent = 'اكتب السعر'; return; } }
      const row = {
        title: title.value.trim(),
        image_url: image,
        link_type: t,
        link_value: value,
        is_active: active.checked,
        sort_order: Number(order.value) || 0,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
      };
      save.disabled = true;
      const q = story ? db.from('stories').update(row).eq('id', story.id) : db.from('stories').insert(row);
      const { error } = await q;
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(story ? 'انحفظ التعديل ✅' : 'انضاف الستوري ✅');
      renderStoryEditor(null);
      loadStories();
    });

    drawPreview();
    drawValue();
    box.replaceChildren(
      el('h3', { text: story ? 'تعديل ستوري' : 'ستوري صورة جديد', style: 'margin:0' }),
      el('div', { class: 'help', text: 'صورة طولية بقياس 1080×1920 (مثل ستوري الإنستغرام). خلي الكتابة بعيدة عن الحواف وعن أسفل الصورة، لأن بالتطبيق اكو زر "تسوّقي هسه" تحت.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'الاسم تحت الدائرة' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'الترتيب (الأصغر يطلع أول)' }), order),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'الصورة' }), file),
      ),
      preview,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'زر "تسوّقي هسه" يفتح' }), linkType),
        el('div', null, el('label', { class: 'lbl', text: ' ' }), valueBox),
        el('div', null, el('label', { class: 'lbl', text: 'يبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'ينتهي (اختياري)' }), ends),
      ),
      el('label', { style: 'display:flex;gap:8px;align-items:center' }, active, 'فعال (يطلع بالتطبيق)'),
      err,
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
        save,
        story ? el('button', { class: 'btn', type: 'button', onclick: () => renderStoryEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ---------- اطلالة اليوم ----------
  // صورة موديل + نقاط على القطع. اضغط على الصورة تنضاف نقطة، واختر منتجها.
  // التطبيق يعرض أول اطلالة فعالة (الترتيب الأصغر، وبعدين الأحدث).
  adm.looks = [];
  async function openLooks() {
    if (!adm.productsLoaded) await loadProducts();
    if (!$('look-editor').childElementCount) renderLookEditor(null);
    loadLooks();
  }

  async function loadLooks() {
    $('look-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('looks').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
    if (error) { $('look-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    adm.looks = data || [];
    renderLooks();
  }

  function lookProductName(id) {
    const p = adm.products.find((x) => x.id === Number(id));
    return p ? p.name : 'منتج #' + id;
  }

  function renderLooks() {
    if (!adm.looks.length) {
      $('look-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو اطلالات لحد هسه. ارفع صورة فوق وحط النقاط.' }));
      return;
    }
    const now = Date.now();
    const live = adm.looks.find((l) => l.is_active && (!l.starts_at || new Date(l.starts_at) <= now) && (!l.ends_at || new Date(l.ends_at) > now));
    $('look-list').replaceChildren(
      el('h3', { text: 'الاطلالات', style: 'margin:6px 0 10px' }),

        el('img', { src: l.image_url, alt: '' }),
        el('div', { style: 'flex:1' },
          el('div', { class: 'prod-name', text: l.title }),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            live && live.id === l.id ? el('span', { class: 'badge green', text: 'ظاهرة بالتطبيق هسه' }) : null,
            el('span', { class: 'badge ' + (l.is_active ? '' : 'red'), text: l.is_active ? 'فعالة' : 'موقوفة' }),
            el('span', { text: (l.hotspots || []).length + ' قطعة' }),
            el('span', { text: 'ترتيب ' + l.sort_order }),
          ),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap' },

            el('button', { class: 'btn btn-sm', type: 'button', onclick: async () => {
              const { error } = await db.from('looks').update({ is_active: !l.is_active }).eq('id', l.id);
              if (error) { toast(friendlyError(error), true); return; }
              loadLooks();
            } }, l.is_active ? 'إيقاف' : 'تفعيل'),
            el('button', { class: 'btn btn-danger btn-sm', type: 'button', onclick: async () => {
              const ok = await confirmDialog('حذف الاطلالة؟', 'راح تنشال من التطبيق.', 'حذف');
              if (!ok) return;
              const { error } = await db.from('looks').delete().eq('id', l.id);
              if (error) { toast(friendlyError(error), true); return; }
              const path = storagePathFromUrl(l.image_url);
              if (path) await db.storage.from(BUCKET).remove([path]);
              toast('انحذفت');
              loadLooks();
            } }, 'حذف'),
          ),
        ),
      )),
    );
  }

  function renderLookEditor(look) {
    const box = $('look-editor');
    const state = {
      image: look ? look.image_url : null,
      spots: look ? (look.hotspots || []).map((h) => ({ x: h.x, y: h.y, product_id: h.product_id })) : [],
    };
    const title = el('input', { class: 'field', maxlength: 40, value: look ? look.title : 'اطلالة اليوم' });
    const order = el('input', { class: 'field', type: 'number', value: look ? look.sort_order : 0, style: 'max-width:120px' });
    const active = el('input', { type: 'checkbox' });
    active.checked = look ? look.is_active : true;
    const toLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
    const starts = el('input', { class: 'field', type: 'datetime-local', value: toLocal(look && look.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: toLocal(look && look.ends_at) });
    const file = el('input', { type: 'file', accept: 'image/*', class: 'field' });
    const stage = el('div', { class: 'look-stage' });
    const rows = el('div', { style: 'display:grid;gap:8px' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, look ? 'حفظ التعديل' : 'حفظ الاطلالة');

    function draw() {
      stage.replaceChildren(
        state.image ? el('img', { src: state.image, alt: '' }) : el('div', { class: 'empty', style: 'aspect-ratio:4/5;display:grid;place-items:center', text: 'ارفع صورة الموديل' }),
        ...state.spots.map((sp, i) => el('span', { class: 'look-dot', style: 'left:' + (sp.x * 100) + '%;top:' + (sp.y * 100) + '%', text: String(i + 1) })),
      );
      rows.replaceChildren(...state.spots.map((sp, i) => {
        const picker = productPicker(sp.product_id, 'ابحث عن القطعة ' + (i + 1));
        picker.select.addEventListener('change', () => { sp.product_id = Number(picker.select.value) || null; });
        return el('div', { class: 'look-row' },
          el('span', { class: 'look-dot', style: 'position:static;margin:0', text: String(i + 1) }),
          el('div', null, picker.search, el('div', { style: 'height:4px' }), picker.select),
          el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { state.spots.splice(i, 1); draw(); } }, 'شيل'),
        );
      }));
    }

    stage.addEventListener('click', (ev) => {
      if (!state.image) return;
      const r = stage.getBoundingClientRect();
      const x = Math.min(0.96, Math.max(0.04, (ev.clientX - r.left) / r.width));
      const y = Math.min(0.96, Math.max(0.04, (ev.clientY - r.top) / r.height));
      if (state.spots.length >= 8) { err.textContent = 'أكثر شي 8 قطع بالاطلالة'; return; }
      state.spots.push({ x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000, product_id: null });
      draw();
    });

    file.addEventListener('change', async () => {
      err.textContent = '';
      const img = file.files[0];
      if (!img) return;
      save.disabled = true;
      try {
        const blob = await compressImage(img, 1400, 0.85);
        state.image = await uploadFile(blob, img.name, 'jpg', 'image/jpeg');
        draw();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        save.disabled = false;
      }
    });

    save.addEventListener('click', async () => {
      err.textContent = '';
      if (!state.image) { err.textContent = 'ارفع صورة الموديل'; return; }
      const spots = state.spots.filter((sp) => sp.product_id);
      if (!spots.length) { err.textContent = 'اضغط على الصورة فوق كل قطعة واختر منتجها (قطعة وحدة على الأقل)'; return; }
      if (spots.length < state.spots.length) { err.textContent = 'اكو نقطة بدون منتج، اختر منتجها أو شيلها'; return; }
      const row = {
        title: title.value.trim() || 'اطلالة اليوم',
        image_url: state.image,
        hotspots: spots,
        is_active: active.checked,
        sort_order: Number(order.value) || 0,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
      };
      save.disabled = true;
      const q = look ? db.from('looks').update(row).eq('id', look.id) : db.from('looks').insert(row);
      const { error } = await q;
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(look ? 'انحفظ التعديل ✅' : 'انضافت الاطلالة ✅');
      renderLookEditor(null);
      loadLooks();
    });

    draw();
    box.replaceChildren(
      el('h3', { text: look ? 'تعديل الاطلالة' : 'اطلالة جديدة', style: 'margin:0' }),
      el('div', { class: 'help', text: '1) ارفع صورة موديل (طولية أحسن). 2) اضغط على الصورة فوق كل قطعة لابستها، تطلع نقطة برقم. 3) اختر منتج كل نقطة. بالتطبيق الزبونة تضغط النقطة ويطلعلها اسم القطعة وسعرها.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'العنوان' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'الترتيب (الأصغر يطلع أول)' }), order),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'صورة الموديل' }), file),
      ),
      stage,
      rows,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'تبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'تخلص (اختياري)' }), ends),
      ),
      el('label', { style: 'display:flex;gap:8px;align-items:center' }, active, 'فعالة (تطلع بالتطبيق)'),
      err,
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
        save,
        look ? el('button', { class: 'btn', type: 'button', onclick: () => renderLookEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ---------- الإشعارات (Firebase) ----------
  let pushFormReady = false;
  async function openPush() {
    renderChatBotCard();
    if (!adm.productsLoaded) await loadProducts();
    if (!pushFormReady) renderPushForm();
    loadPushLog();
  }

  // ---------- بوت دردشة الزبائن (@modo_chat_bot) ----------
  async function chatBotCall(action) {
    const { data, error } = await db.functions.invoke('chat-bot', { body: { action } });
    if (error) return { ok: false, error: 'network' };
    return data || { ok: false };
  }

  function chatBotMessage(r) {
    if (r.ok && r.group_connected) return `✅ البوت @${r.bot} شغّال ومربوط بگروب رسائل الزبائن.`;
    if (r.ok) return `✅ البوت @${r.bot} جاهز. هسه اكتبوا /connect داخل گروب رسائل الزبائن (بموضوع General).`;
    if (r.error === 'token_missing') return '⚠️ التوكن مو موجود. حطّوه بلوحة Supabase ← Edge Functions ← Secrets باسم CHAT_BOT_TOKEN';
    if (r.error === 'bad_token') return '⚠️ التوكن غلط. تأكدوا منه بـ BotFather وحدّثوه بالـ Secrets';
    if (r.error === 'webhook') return '⚠️ ما انربط الـ webhook، جرّبوا مرة ثانية';
    return '⚠️ تعذر الاتصال، جرّبوا مرة ثانية';
  }

  async function renderChatBotCard() {
    const box = $('chatbot-card');
    const status = el('div', { class: 'muted', text: 'جاري فحص البوت...' });
    const btn = el('button', { class: 'btn btn-sm', type: 'button', text: 'ربط بوت الدردشة' });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'جاري الربط...';
      status.textContent = chatBotMessage(await chatBotCall('setup'));
      btn.disabled = false;
    });
    box.replaceChildren(
      el('h3', { text: '💬 دردشة الزبائن' }),
      el('div', { class: 'muted', text: 'الزبائن يراسلون من التطبيق، والرسائل توصل لگروب تيليگرام "رسائل الزبائن" (كل زبون بموضوع خاص). الرد يكون داخل موضوع الزبون، ولإرسال منتج: /p رقم_المنتج أو /p رقم_المنتج رقم_الصورة' }),
      status,
      btn,
    );
    status.textContent = chatBotMessage(await chatBotCall('status'));
  }

  function renderPushForm() {
    pushFormReady = true;
    const title = el('input', { class: 'field', maxlength: 80, placeholder: 'مثال: وصل موديل جديد 🤍' });
    const body = el('textarea', { class: 'field', rows: 3, maxlength: 300, placeholder: 'مثال: برا ليزري ناعم، أي قطعتين بـ 16 ألف والتوصيل مجاني' });
    const picker = productPicker(null, 'ابحث عن منتج يفتحه الإشعار (اختياري)');
    const err = el('div', { class: 'error', role: 'alert' });
    const preview = el('div', { class: 'help' });
    const updatePreview = () => {
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      preview.textContent = p
        ? 'لمن الزبون يضغط الإشعار ينفتح: ' + p.name + ' (#' + p.id + ')' + (p.stock > 0 ? '' : ' ⚠️ المنتج مخفي')
        : 'لمن الزبون يضغط الإشعار تنفتح الرئيسية.';
    };
    picker.select.addEventListener('change', updatePreview);
    updatePreview();

    // صورة الإشعار: افتراضياً صورة المنتج، أو صورة خاصة (بانر مثلاً)، أو بدون صورة
    const imgMode = el('select', { class: 'field' },
      el('option', { value: 'product', text: 'صورة المنتج المختار' }),
      el('option', { value: 'custom', text: 'صورة خاصة (ارفعها)' }),
      el('option', { value: 'none', text: 'بدون صورة' }),
    );
    const imgFile = el('input', { type: 'file', accept: 'image/*', class: 'field hidden' });
    const imgThumb = el('img', { alt: '', style: 'display:none;max-width:260px;max-height:150px;border-radius:12px;margin-top:8px;object-fit:cover;border:1px solid #eee' });
    let customImageUrl = null;
    const currentImage = () => {
      if (imgMode.value === 'none') return null;
      if (imgMode.value === 'custom') return customImageUrl;
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      return p && Array.isArray(p.image_url) ? (p.image_url[0] || null) : null;
    };
    const refreshThumb = () => {
      imgFile.classList.toggle('hidden', imgMode.value !== 'custom');
      const u = currentImage();
      imgThumb.style.display = u ? 'block' : 'none';
      if (u) imgThumb.src = u;
    };
    imgMode.addEventListener('change', refreshThumb);
    picker.select.addEventListener('change', refreshThumb);
    imgFile.addEventListener('change', async () => {
      const file = imgFile.files && imgFile.files[0];
      if (!file) return;
      err.textContent = '';
      buttons.forEach((x) => { x.disabled = true; });
      try {
        const blob = await compressImage(file, 1200, 0.85);
        customImageUrl = await uploadFile(blob, file.name, 'jpg', 'image/jpeg');
        refreshThumb();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        buttons.forEach((x) => { x.disabled = false; });
      }
    });
    refreshThumb();

    const buttons = [];
    async function send(target) {
      err.textContent = '';
      const t = title.value.trim();
      const b = body.value.trim();
      if (!t || !b) { err.textContent = 'اكتب العنوان والنص'; return; }
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      if (imgMode.value === 'custom' && !customImageUrl) { err.textContent = 'ارفع الصورة أول، أو اختار صورة المنتج'; return; }
      if (target === 'all') {

      select.replaceChildren(
        el('option', { value: '', text: list.length ? 'اختر المنتج...' : 'ماكو نتائج' }),
        ...list.map((p) => el('option', { value: p.id, text: `${p.name} (#${p.id})${p.stock > 0 ? '' : ' - مخفي'}` })),

      if (selectedId && list.some((p) => p.id === selectedId)) select.value = String(selectedId);

  // ================= الأرباح (أدمن بس) =================
  // كل الأرقام من admin_profit_report. الكلف مخفية عن الموظفين والزبائن، وكل قطعة محفوظة ويّاها كلفتها وقت البيع.
  // صافي الطلب = البضاعة − كلفتها − الخصم + التوصيل الي دفعه الزبون − كلفة شركة التوصيل − عمولة المؤثر
  const PF_DAY = 86400000;
  const pf = {
    tab: 'overview', preset: 'month', from: null, to: null, compare: true,
    data: null, m: null, pm: null, range: null, prevRange: null, loading: false, error: null, seq: 0,
    ord: { filter: 'all', gov: '', st: '', q: '', sort: 'net_asc', sel: null, product: null, limit: 100 },
    prod: { filter: 'sold', cat: '', q: '', sel: null, limit: 150 },
    set: { month: null },
  };
  const pfEsc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pfPill = (s) => `<span class="pill ${statusCls(s)}">${pfEsc(s)}</span>`;
  const pfN = (v) => `<span class="num">${money(v)}</span>`;
  const pfS = (v) => (Math.round(v) < 0 ? `<span class="num">−${money(-v)}</span>` : pfN(v));
  const pfPct = (v) => (v == null || !isFinite(v) ? '—' : `<span class="num">${v < 0 ? '−' : ''}${Math.abs(Math.round(v * 100))}%</span>`);
  const pfBg = (ymd) => new Date(`${ymd}T00:00:00+03:00`);
  const pfYmd = (d) => dayKey.format(d);
  const pfAdd = (ymd, n) => pfYmd(new Date(pfBg(ymd).getTime() + n * PF_DAY + 3600000));
  const pfPad = (n) => String(n).padStart(2, '0');
  const pfDaysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const pfDayFmt = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: TZ, day: 'numeric', month: 'long', year: 'numeric' });
  const pfShortFmt = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: TZ, day: 'numeric', month: 'numeric' });
  const pfWeekday = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });

  function pfRange() {
    const today = pfYmd(new Date());
    const [y, m] = today.split('-').map(Number);
    const first = (yy, mm) => `${yy}-${pfPad(mm)}-01`;
    switch (pf.preset) {
      case 'today': return { from: today, to: pfAdd(today, 1) };
      case 'yesterday': return { from: pfAdd(today, -1), to: today };
      case 'week': { // الأسبوع يبدي من السبت
        const dow = new Date(pfBg(today).getTime() + 3 * 3600000).getUTCDay();
        return { from: pfAdd(today, -((dow + 1) % 7)), to: pfAdd(today, 1) };
      }
      case 'lastmonth': { const [py, pm] = m === 1 ? [y - 1, 12] : [y, m - 1]; return { from: first(py, pm), to: first(y, m) }; }
      case 'custom': return { from: pf.from, to: pfAdd(pf.to, 1) };
      default: return { from: first(y, m), to: pfAdd(today, 1) };
    }
  }

  // الفترة الي قبلها: للأشهر نفس الأيام من الشهر الفائت، والباقي نفس الطول قبلها مباشرة
  function pfPrevRange(r) {
