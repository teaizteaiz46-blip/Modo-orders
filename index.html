  // ---------- اطلالة اليوم ----------
  // صورة موديل + نقاط على القطع. اضغط على الصورة تنضاف نقطة، واختر منتجها.
  // التطبيق يعرض أول اطلالة فعالة (الترتيب الأصغر، وبعدين الأحدث).
  adm.looks = [];
  async function openLooks() {
    if (!adm.productsLoaded) await loadProducts();
    if (!$('look-editor').childElementCount) renderLookEditor(null);
    loadLooks();
  }

  async function loadLooks() {
    $('look-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('looks').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
    if (error) { $('look-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    adm.looks = data || [];
    renderLooks();
  }

  function lookProductName(id) {
    const p = adm.products.find((x) => x.id === Number(id));
    return p ? p.name : 'منتج #' + id;
  }

  function renderLooks() {
    if (!adm.looks.length) {
      $('look-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو اطلالات لحد هسه. ارفع صورة فوق وحط النقاط.' }));
      return;
    }
    const now = Date.now();
    const live = adm.looks.find((l) => l.is_active && (!l.starts_at || new Date(l.starts_at) <= now) && (!l.ends_at || new Date(l.ends_at) > now));
    $('look-list').replaceChildren(
      el('h3', { text: 'الاطلالات', style: 'margin:6px 0 10px' }),
      ...adm.looks.map((l) => el('div', { class: 'look-card' },
        el('img', { src: l.image_url, alt: '' }),
        el('div', { style: 'flex:1' },
          el('div', { class: 'prod-name', text: l.title }),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            live && live.id === l.id ? el('span', { class: 'badge green', text: 'ظاهرة بالتطبيق هسه' }) : null,
            el('span', { class: 'badge ' + (l.is_active ? '' : 'red'), text: l.is_active ? 'فعالة' : 'موقوفة' }),
            el('span', { text: (l.hotspots || []).length + ' قطعة' }),
            el('span', { text: 'ترتيب ' + l.sort_order }),
          ),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderLookEditor(l); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'تعديل'),
            el('button', { class: 'btn btn-sm', type: 'button', onclick: async () => {
              const { error } = await db.from('looks').update({ is_active: !l.is_active }).eq('id', l.id);
              if (error) { toast(friendlyError(error), true); return; }
              loadLooks();
            } }, l.is_active ? 'إيقاف' : 'تفعيل'),
            el('button', { class: 'btn btn-danger btn-sm', type: 'button', onclick: async () => {
              const ok = await confirmDialog('حذف الاطلالة؟', 'راح تنشال من التطبيق.', 'حذف');
              if (!ok) return;
              const { error } = await db.from('looks').delete().eq('id', l.id);
              if (error) { toast(friendlyError(error), true); return; }
              const path = storagePathFromUrl(l.image_url);
              if (path) await db.storage.from(BUCKET).remove([path]);
              toast('انحذفت');
              loadLooks();
            } }, 'حذف'),
          ),
        ),
      )),
    );
  }

  function renderLookEditor(look) {
    const box = $('look-editor');
    const state = {
      image: look ? look.image_url : null,
      spots: look ? (look.hotspots || []).map((h) => ({ x: h.x, y: h.y, product_id: h.product_id })) : [],
    };
    const title = el('input', { class: 'field', maxlength: 40, value: look ? look.title : 'اطلالة اليوم' });
    const order = el('input', { class: 'field', type: 'number', value: look ? look.sort_order : 0, style: 'max-width:120px' });
    const active = el('input', { type: 'checkbox' });
    active.checked = look ? look.is_active : true;
    const toLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
    const starts = el('input', { class: 'field', type: 'datetime-local', value: toLocal(look && look.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: toLocal(look && look.ends_at) });
    const file = el('input', { type: 'file', accept: 'image/*', class: 'field' });
    const stage = el('div', { class: 'look-stage' });
    const rows = el('div', { style: 'display:grid;gap:8px' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, look ? 'حفظ التعديل' : 'حفظ الاطلالة');

    function draw() {
      stage.replaceChildren(
        state.image ? el('img', { src: state.image, alt: '' }) : el('div', { class: 'empty', style: 'aspect-ratio:4/5;display:grid;place-items:center', text: 'ارفع صورة الموديل' }),
        ...state.spots.map((sp, i) => el('span', { class: 'look-dot', style: 'left:' + (sp.x * 100) + '%;top:' + (sp.y * 100) + '%', text: String(i + 1) })),
      );
      rows.replaceChildren(...state.spots.map((sp, i) => {
        const picker = productPicker(sp.product_id, 'ابحث عن القطعة ' + (i + 1));
        picker.select.addEventListener('change', () => { sp.product_id = Number(picker.select.value) || null; });
        return el('div', { class: 'look-row' },
          el('span', { class: 'look-dot', style: 'position:static;margin:0', text: String(i + 1) }),
          el('div', null, picker.search, el('div', { style: 'height:4px' }), picker.select),
          el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { state.spots.splice(i, 1); draw(); } }, 'شيل'),
        );
      }));
    }

    stage.addEventListener('click', (ev) => {
      if (!state.image) return;
      const r = stage.getBoundingClientRect();
      const x = Math.min(0.96, Math.max(0.04, (ev.clientX - r.left) / r.width));
      const y = Math.min(0.96, Math.max(0.04, (ev.clientY - r.top) / r.height));
      if (state.spots.length >= 8) { err.textContent = 'أكثر شي 8 قطع بالاطلالة'; return; }
      state.spots.push({ x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000, product_id: null });
      draw();
    });

    file.addEventListener('change', async () => {
      err.textContent = '';
      const img = file.files[0];
      if (!img) return;
      save.disabled = true;
      try {
        const blob = await compressImage(img, 1400, 0.85);
        state.image = await uploadFile(blob, img.name, 'jpg', 'image/jpeg');
        draw();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        save.disabled = false;
      }
    });

    save.addEventListener('click', async () => {
      err.textContent = '';
      if (!state.image) { err.textContent = 'ارفع صورة الموديل'; return; }
      const spots = state.spots.filter((sp) => sp.product_id);
      if (!spots.length) { err.textContent = 'اضغط على الصورة فوق كل قطعة واختر منتجها (قطعة وحدة على الأقل)'; return; }
      if (spots.length < state.spots.length) { err.textContent = 'اكو نقطة بدون منتج، اختر منتجها أو شيلها'; return; }
      const row = {
        title: title.value.trim() || 'اطلالة اليوم',
        image_url: state.image,
        hotspots: spots,
        is_active: active.checked,
        sort_order: Number(order.value) || 0,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
      };
      save.disabled = true;
      const q = look ? db.from('looks').update(row).eq('id', look.id) : db.from('looks').insert(row);
      const { error } = await q;
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(look ? 'انحفظ التعديل ✅' : 'انضافت الاطلالة ✅');
      renderLookEditor(null);
      loadLooks();
    });

    draw();
    box.replaceChildren(
      el('h3', { text: look ? 'تعديل الاطلالة' : 'اطلالة جديدة', style: 'margin:0' }),
      el('div', { class: 'help', text: '1) ارفع صورة موديل (طولية أحسن). 2) اضغط على الصورة فوق كل قطعة لابستها، تطلع نقطة برقم. 3) اختر منتج كل نقطة. بالتطبيق الزبونة تضغط النقطة ويطلعلها اسم القطعة وسعرها.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'العنوان' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'الترتيب (الأصغر يطلع أول)' }), order),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'صورة الموديل' }), file),
      ),
      stage,
      rows,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'تبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'تخلص (اختياري)' }), ends),
      ),
      el('label', { style: 'display:flex;gap:8px;align-items:center' }, active, 'فعالة (تطلع بالتطبيق)'),
      err,
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
        save,
        look ? el('button', { class: 'btn', type: 'button', onclick: () => renderLookEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ---------- الإشعارات (Firebase) ----------
  let pushFormReady = false;
  async function openPush() {
    renderChatBotCard();
    if (!adm.productsLoaded) await loadProducts();
    if (!pushFormReady) renderPushForm();
    loadPushLog();
  }

  // ---------- بوت دردشة الزبائن (@modo_chat_bot) ----------
  async function chatBotCall(action) {
    const { data, error } = await db.functions.invoke('chat-bot', { body: { action } });
    if (error) return { ok: false, error: 'network' };
    return data || { ok: false };
  }

  function chatBotMessage(r) {
    if (r.ok && r.group_connected) return `✅ البوت @${r.bot} شغّال ومربوط بگروب رسائل الزبائن.`;
    if (r.ok) return `✅ البوت @${r.bot} جاهز. هسه اكتبوا /connect داخل گروب رسائل الزبائن (بموضوع General).`;
    if (r.error === 'token_missing') return '⚠️ التوكن مو موجود. حطّوه بلوحة Supabase ← Edge Functions ← Secrets باسم CHAT_BOT_TOKEN';
    if (r.error === 'bad_token') return '⚠️ التوكن غلط. تأكدوا منه بـ BotFather وحدّثوه بالـ Secrets';
    if (r.error === 'webhook') return '⚠️ ما انربط الـ webhook، جرّبوا مرة ثانية';
    return '⚠️ تعذر الاتصال، جرّبوا مرة ثانية';
  }

  async function renderChatBotCard() {
    const box = $('chatbot-card');
    const status = el('div', { class: 'muted', text: 'جاري فحص البوت...' });
    const btn = el('button', { class: 'btn btn-sm', type: 'button', text: 'ربط بوت الدردشة' });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'جاري الربط...';
      status.textContent = chatBotMessage(await chatBotCall('setup'));
      btn.disabled = false;
    });
    box.replaceChildren(
      el('h3', { text: '💬 دردشة الزبائن' }),
      el('div', { class: 'muted', text: 'الزبائن يراسلون من التطبيق، والرسائل توصل لگروب تيليگرام "رسائل الزبائن" (كل زبون بموضوع خاص). الرد يكون داخل موضوع الزبون، ولإرسال منتج: /p رقم_المنتج أو /p رقم_المنتج رقم_الصورة' }),
      status,
      btn,
    );
    status.textContent = chatBotMessage(await chatBotCall('status'));
  }

  function renderPushForm() {
    pushFormReady = true;
    const title = el('input', { class: 'field', maxlength: 80, placeholder: 'مثال: وصل موديل جديد 🤍' });
    const body = el('textarea', { class: 'field', rows: 3, maxlength: 300, placeholder: 'مثال: برا ليزري ناعم، أي قطعتين بـ 16 ألف والتوصيل مجاني' });
    const picker = productPicker(null, 'ابحث عن منتج يفتحه الإشعار (اختياري)');
    const err = el('div', { class: 'error', role: 'alert' });
    const preview = el('div', { class: 'help' });
    const updatePreview = () => {
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      preview.textContent = p
        ? 'لمن الزبون يضغط الإشعار ينفتح: ' + p.name + ' (#' + p.id + ')' + (p.stock > 0 ? '' : ' ⚠️ المنتج مخفي')
        : 'لمن الزبون يضغط الإشعار تنفتح الرئيسية.';
    };
    picker.select.addEventListener('change', updatePreview);
    updatePreview();

    // صورة الإشعار: افتراضياً صورة المنتج، أو صورة خاصة (بانر مثلاً)، أو بدون صورة
    const imgMode = el('select', { class: 'field' },
      el('option', { value: 'product', text: 'صورة المنتج المختار' }),
      el('option', { value: 'custom', text: 'صورة خاصة (ارفعها)' }),
      el('option', { value: 'none', text: 'بدون صورة' }),
    );
    const imgFile = el('input', { type: 'file', accept: 'image/*', class: 'field hidden' });
    const imgThumb = el('img', { alt: '', style: 'display:none;max-width:260px;max-height:150px;border-radius:12px;margin-top:8px;object-fit:cover;border:1px solid #eee' });
    let customImageUrl = null;
    const currentImage = () => {
      if (imgMode.value === 'none') return null;
      if (imgMode.value === 'custom') return customImageUrl;
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      return p && Array.isArray(p.image_url) ? (p.image_url[0] || null) : null;
    };
    const refreshThumb = () => {
      imgFile.classList.toggle('hidden', imgMode.value !== 'custom');
      const u = currentImage();
      imgThumb.style.display = u ? 'block' : 'none';
      if (u) imgThumb.src = u;
    };
    imgMode.addEventListener('change', refreshThumb);
    picker.select.addEventListener('change', refreshThumb);
    imgFile.addEventListener('change', async () => {
      const file = imgFile.files && imgFile.files[0];
      if (!file) return;
      err.textContent = '';
      buttons.forEach((x) => { x.disabled = true; });
      try {
        const blob = await compressImage(file, 1200, 0.85);
        customImageUrl = await uploadFile(blob, file.name, 'jpg', 'image/jpeg');
        refreshThumb();
      } catch (e) {
        err.textContent = 'ما انرفعت الصورة: ' + (e.message || e);
      } finally {
        buttons.forEach((x) => { x.disabled = false; });
      }
    });
    refreshThumb();

    const buttons = [];
    async function send(target) {
      err.textContent = '';
      const t = title.value.trim();
      const b = body.value.trim();
      if (!t || !b) { err.textContent = 'اكتب العنوان والنص'; return; }
      const p = adm.products.find((x) => String(x.id) === picker.select.value);
      if (imgMode.value === 'custom' && !customImageUrl) { err.textContent = 'ارفع الصورة أول، أو اختار صورة المنتج'; return; }
      if (target === 'all') {
        const ok = await confirmDialog('إرسال لكل الزبائن؟', 'راح يوصل الإشعار "' + t + '" لكل الي منزلين التطبيق، وما ينگدر يتراجع بعد الإرسال.', 'إرسال للكل');
        if (!ok) return;
      }
      buttons.forEach((x) => { x.disabled = true; });
      try {
        const { error } = await db.functions.invoke('send-push', {
          body: {
            target, title: t, body: b,
            product_id: p ? p.id : null,
            image: currentImage(),
          },
        });
        if (error) {
          let msg = error.message;
          try { const j = await error.context.json(); msg = j.error || msg; } catch (_) {}
          throw new Error(msg);
        }
        toast(target === 'all' ? 'انرسل الإشعار لكل الزبائن ✅' : 'انرسلت التجربة لأجهزة المشرفين ✅');
        loadPushLog();
      } catch (e) {
        err.textContent = 'ما انرسل: ' + (e.message || e);
      } finally {
        buttons.forEach((x) => { x.disabled = false; });
      }
    }
    buttons.push(
      el('button', { class: 'btn', type: 'button', onclick: () => send('test') }, '🧪 إرسال تجربة (أجهزة المشرفين)'),
      el('button', { class: 'btn btn-primary', type: 'button', onclick: () => send('all') }, '📣 إرسال لكل الزبائن'),
    );

    $('push-form').replaceChildren(
      el('h3', { text: 'إشعار جديد', style: 'margin:0 0 10px' }),
      el('div', { class: 'form-grid' },
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'العنوان *' }), title),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'النص *' }), body),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'منتج (اختياري)' }), picker.search, picker.select, preview),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'صورة الإشعار' }), imgMode, imgFile, imgThumb),
      ),
      el('div', { class: 'help', text: 'التجربة توصل بس لأجهزة المشرفين المسجلين دخول بنسخة التطبيق 1.7.5 أو أحدث. الصورة تطلع بالأندرويد، وبالآيفون من نسخة 1.7.11 وأحدث. الصورة العريضة (مثل البانر) تطلع أحلى.' }),
      err,
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px' }, ...buttons),
    );
  }

  async function loadPushLog() {
    $('push-log').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('push_log')
      .select('id, created_at, target, title, body, product_id, ok, error')
      .order('id', { ascending: false }).limit(30);
    if (error) { $('push-log').replaceChildren(el('div', { class: 'empty', text: friendlyError(error) })); return; }
    if (!data.length) { $('push-log').replaceChildren(el('div', { class: 'empty', text: 'ماكو إشعارات مرسلة لحد هسه' })); return; }
    $('push-log').replaceChildren(
      el('h3', { text: 'آخر الإشعارات', style: 'margin:18px 0 10px' }),
      ...data.map((r) => el('div', { class: 'prod-row', style: 'cursor:default' },
        el('div', null,
          el('div', { class: 'prod-name', text: r.title }),
          el('div', { class: 'muted', style: 'font-size:13px', text: r.body }),
          el('div', { class: 'prod-meta', style: 'margin-top:4px' },
            el('span', { class: 'badge ' + (r.target === 'all' ? 'orange' : ''), text: r.target === 'all' ? 'لكل الزبائن' : 'تجربة' }),
            el('span', { class: 'badge ' + (r.ok ? 'green' : 'red'), text: r.ok ? 'انرسل' : 'فشل' }),
            r.product_id ? el('span', { text: 'منتج #' + r.product_id }) : null,
            el('span', { text: new Date(r.created_at).toLocaleString('ar-IQ-u-nu-latn', { timeZone: 'Asia/Baghdad', dateStyle: 'short', timeStyle: 'short' }) }),
          ),
          r.error ? el('div', { class: 'error', style: 'margin-top:4px', text: r.error }) : null,
        ),
      )),
    );
  }

  function productPicker(selectedId, placeholder = 'ابحث عن المنتج المرتبط بالمقطع') {
    const search = el('input', { class: 'field', type: 'search', placeholder });
    const select = el('select', { class: 'field' });
    const fill = () => {
      const q = search.value.trim();
      const list = adm.products.filter((p) => !q || (p.name || '').includes(q) || String(p.id) === q).slice(0, 300);
      select.replaceChildren(
        el('option', { value: '', text: list.length ? 'اختر المنتج...' : 'ماكو نتائج' }),
        ...list.map((p) => el('option', { value: p.id, text: `${p.name} (#${p.id})${p.stock > 0 ? '' : ' - مخفي'}` })),
      );
      if (selectedId && list.some((p) => p.id === selectedId)) select.value = String(selectedId);
    };
    search.addEventListener('input', fill);
    fill();
    return { search, select };
  }

  function renderNewClip() {
    const box = $('new-clip');
    const picker = productPicker(null);
    const file = el('input', { type: 'file', accept: 'video/mp4,video/quicktime,video/webm', class: 'field' });
    const preview = el('video', { class: 'hidden', muted: true, playsinline: true, controls: true });
    const err = el('div', { class: 'error', role: 'alert' });
    const btn = el('button', { class: 'btn btn-primary', type: 'button' }, 'رفع المقطع');

    file.addEventListener('change', () => {
      err.textContent = '';
      const v = file.files[0];
      if (!v) { preview.classList.add('hidden'); return; }
      if (v.size > MAX_VIDEO_MB * 1024 * 1024) {
        err.textContent = `حجم المقطع ${(v.size / 1048576).toFixed(0)} ميگا، والحد ${MAX_VIDEO_MB} ميگا. صغّر المقطع أو قصّه.`;
      } else if (/quicktime/.test(v.type) || /\.mov$/i.test(v.name)) {
        err.textContent = 'تنبيه: مقاطع MOV من الآيفون ممكن ما تشتغل على بعض موبايلات أندرويد. الأفضل MP4.';
      }
      preview.src = URL.createObjectURL(v);
      preview.classList.remove('hidden');
    });

    btn.addEventListener('click', async () => {
      err.textContent = '';
      const v = file.files[0];
      const productId = Number(picker.select.value);
      if (!productId) { err.textContent = 'اختر المنتج'; return; }
      if (!v) { err.textContent = 'اختر ملف المقطع'; return; }
      if (v.size > MAX_VIDEO_MB * 1024 * 1024) { err.textContent = `الحد الأقصى ${MAX_VIDEO_MB} ميگا`; return; }
      btn.disabled = true;
      btn.textContent = 'جاري الرفع... لا تسكّر الصفحة';
      try {
        const ext = (v.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
        const url = await uploadFile(v, v.name, ext, v.type || 'video/mp4');
        const { data, error } = await db.from('clips').insert({ video_url: url, product_id: productId }).select().single();
        if (error) throw error;
        adm.clips.unshift(data);
        renderClips();
        renderNewClip();
        toast('انرفع المقطع وصار يظهر بالتطبيق');
      } catch (e) {
        err.textContent = friendlyError(e);
        btn.disabled = false;
        btn.textContent = 'رفع المقطع';
      }
    });

    box.replaceChildren(
      el('div', { style: 'font-weight:700;font-size:17px', text: 'مقطع جديد' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'المنتج *' }), picker.search, el('div', { style: 'height:8px' }), picker.select),
        el('div', null, el('label', { class: 'lbl', text: `ملف الفيديو * (MP4، أقصى حد ${MAX_VIDEO_MB} ميگا، طولي)` }), file),
      ),
      preview,
      err,
      el('div', null, btn),
    );
  }

  function renderClips() {
    if (!adm.clips.length) {
      $('clip-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو مقاطع لحد هسه' }));
      return;
    }
    $('clip-list').replaceChildren(...adm.clips.map((c) => {
      const picker = productPicker(c.product_id);
      const status = el('div', { class: 'help' });
      picker.select.addEventListener('change', async () => {
        const pid = Number(picker.select.value);
        if (!pid || pid === c.product_id) return;
        status.textContent = 'جاري الحفظ...';
        const { error } = await db.from('clips').update({ product_id: pid }).eq('id', c.id);
        if (error) { status.textContent = friendlyError(error); return; }
        c.product_id = pid;
        status.textContent = 'انحفظ';
      });
      return el('div', { class: 'clip-card' },
        el('video', { src: c.video_url, controls: true, muted: true, playsinline: true, preload: 'metadata' }),
        el('div', { class: 'body' },
          el('div', { class: 'prod-name', text: productName(c.product_id) }),
          el('div', { class: 'help', text: dtFull.format(new Date(c.created_at)) }),
          el('details', null,
            el('summary', { class: 'help', style: 'cursor:pointer', text: 'تغيير المنتج' }),
            picker.search, el('div', { style: 'height:6px' }), picker.select, status,
          ),
          el('button', { class: 'btn btn-danger btn-sm', type: 'button', onclick: async () => {
            const ok = await confirmDialog('حذف المقطع؟', 'راح ينشال من التطبيق وينحذف الملف نهائياً.', 'حذف');
            if (!ok) return;
            const { error } = await db.from('clips').delete().eq('id', c.id);
            if (error) { toast(friendlyError(error), true); return; }
            const path = storagePathFromUrl(c.video_url);
            if (path) await db.storage.from(BUCKET).remove([path]);
            adm.clips = adm.clips.filter((x) => x.id !== c.id);
            renderClips();
            toast('انحذف المقطع');
          } }, 'حذف المقطع'),
        ),
      );
    }));
  }

  document.querySelectorAll('.section-nav button').forEach((b) => b.addEventListener('click', () => showSection(b.dataset.section)));
  $('prod-new').addEventListener('click', () => openProductEditor(null));
  let prodSearchTimer;
  $('prod-search').addEventListener('input', (ev) => {
    clearTimeout(prodSearchTimer);
    prodSearchTimer = setTimeout(() => { adm.search = ev.target.value; renderProducts(); }, 150);
  });
  $('prod-cat').addEventListener('change', (ev) => { adm.cat = Number(ev.target.value); renderProducts(); });
  $('prod-stock').addEventListener('change', (ev) => { adm.stock = ev.target.value; renderProducts(); });

  // ---------- المؤثرين ----------
  // كل مؤثر إله كوبون (خصم لأول طلب) وعمولة على كل أول طلب يوصل بكوده (تنحسب لما الطلب يصير "مكتمل").
  // الأرقام من public.admin_influencer_report، والمؤثر يشوف أرقامه بصفحة inf.html برابط سري.
  const SITE_URL = 'https://teaizteaiz46-blip.github.io/Modo-orders/';
  adm.influencers = [];

  function openInfluencers() {
    if (!$('inf-editor').childElementCount) renderInfluencerEditor(null);
    loadInfluencers();
  }

  async function loadInfluencers() {
    $('inf-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const { data, error } = await db.rpc('admin_influencer_report');
    if (error) { $('inf-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    adm.influencers = data || [];
    renderInfluencers();
  }

  const infLinks = (inf) => ({
    dashboard: `${SITE_URL}inf.html?t=${inf.token}`,
    ad: `${SITE_URL}app.html?utm_source=influencer&utm_campaign=inf_${String(inf.code).toLowerCase()}`,
  });

  const infStat = (label, value, cls = '') =>
    el('div', { class: 'inf-stat ' + cls }, el('div', { class: 'k', text: label }), el('div', { class: 'v num', text: value }));

  function renderInfluencers() {
    const list = adm.influencers;
    if (!list.length) {
      $('inf-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو مؤثرين لحد هسه' }));
      return;
    }
    const due = list.reduce((s, i) => s + (Number(i.earned) - Number(i.paid)), 0);
    $('inf-list').replaceChildren(
      el('h3', { text: 'المؤثرين', style: 'margin:6px 0 4px' }),
      el('div', { class: 'help', style: 'margin-bottom:10px', text: `الباقي لكل المؤثرين هسه: ${money(due)} د.ع. العمولة تنحسب لما الطلب يصير "مكتمل"، وبس إذا كان أول طلب للزبون ومو رقم المؤثر نفسه.` }),
      ...list.map(renderInfluencerCard),
    );
  }

  function renderInfluencerCard(inf) {
    const links = infLinks(inf);
    const balance = Number(inf.earned) - Number(inf.paid);
    const amount = el('input', { class: 'field', type: 'number', min: 1, step: 500, placeholder: 'المبلغ', value: balance > 0 ? balance : '' });
    const payBtn = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'تسجيل');
    payBtn.addEventListener('click', async () => {
      const v = Math.round(Number(amount.value));
      if (!(v > 0)) { toast('اكتب المبلغ', true); return; }
      const ok = await confirmDialog(`تسجيل دفعة ${money(v)} د.ع؟`, `للمؤثر ${inf.name}، وتنطرح من الباقي إله.`, 'تسجيل');
      if (!ok) return;
      payBtn.disabled = true;
      const { error } = await db.from('influencer_payouts').insert({ influencer_id: inf.id, amount: v });
      payBtn.disabled = false;
      if (error) { toast(friendlyError(error), true); return; }
      toast('انسجلت الدفعة ✅');
      loadInfluencers();
    });
    const payBox = el('div', { class: 'inf-pay hidden' }, amount, payBtn);
    return el('div', { class: 'inf-card' },
      el('div', { class: 'inf-head' },
        el('span', { class: 'prod-name', text: inf.name }),
        el('span', { class: 'badge orange num', text: inf.code }),
        el('span', { class: 'badge ' + (inf.active ? 'green' : 'red'), text: inf.active ? 'فعّال' : 'موقوف' }),
        el('span', { class: 'spacer' }),
        el('span', { class: 'help', style: 'margin:0', text: `خصم الزبون ${money(inf.discount)} · العمولة ${money(inf.commission)} د.ع` }),
      ),
      el('div', { class: 'inf-stats' },
        infStat('زيارات الرابط', money(inf.visits)),
        infStat('طلبات بكوده', money(inf.orders)),
        infStat('واصلة وتنحسب', money(inf.counted)),
        infStat('بالطريق', money(inf.in_progress)),
        infStat('ملغية', money(inf.cancelled)),
        infStat('العمولة الكلية', money(inf.earned)),
        infStat('المدفوع', money(inf.paid)),
        infStat('الباقي إله', money(balance), 'due'),
      ),
      inf.note ? el('div', { class: 'help', style: 'margin:0', text: '📝 ' + inf.note }) : null,
      el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(links.ad, 'انتسخ رابط الإعلان') }, 'نسخ رابط الإعلان'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(links.dashboard, 'انتسخ رابط صفحة المؤثر') }, 'نسخ رابط صفحته'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => payBox.classList.toggle('hidden') }, 'تسجيل دفعة'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderInfluencerEditor(inf); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'تعديل'),
      ),
      payBox,
    );
  }

  function renderInfluencerEditor(inf) {
    const box = $('inf-editor');
    const name = el('input', { class: 'field', maxlength: 60, placeholder: 'مثال: زينب', value: inf ? inf.name : '' });
    const code = el('input', { class: 'field num', maxlength: 20, dir: 'ltr', placeholder: 'مثال: ZAINAB', style: 'text-transform:uppercase', value: inf ? inf.code : '' });
    const discount = el('input', { class: 'field', type: 'number', min: 1500, step: 500, value: inf ? inf.discount : 2000 });
    const commission = el('input', { class: 'field', type: 'number', min: 0, step: 250, value: inf ? inf.commission : 500 });
    const phone = el('input', { class: 'field num', type: 'tel', dir: 'ltr', placeholder: '07xxxxxxxxx', value: inf ? inf.phone || '' : '' });
    const note = el('input', { class: 'field', maxlength: 200, placeholder: 'مثال: 50 ألف على ستوريين', value: inf ? inf.note || '' : '' });
    const active = el('input', { type: 'checkbox' });
    active.checked = inf ? inf.active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, inf ? 'حفظ التعديل' : 'إضافة المؤثر');

    save.addEventListener('click', async () => {
      err.textContent = '';
      const c = code.value.trim().toUpperCase();
      if (!name.value.trim()) { err.textContent = 'اكتب اسم المؤثر'; return; }
      if (!/^[A-Z0-9]{3,20}$/.test(c)) { err.textContent = 'الكود من 3 لـ 20 حرف إنكليزي أو رقم، بدون فراغات'; return; }
      // لازم أكثر من كود الترحيب (MODONEW = 1,000) حتى المتابعين يحسون بقيمة كود المؤثر
      if (!(Number(discount.value) > 1000)) { err.textContent = 'خصم المؤثر لازم أكثر من خصم الترحيب (1,000 د.ع)'; return; }
      save.disabled = true;
      const { error } = await db.rpc('admin_save_influencer', {
        p_id: inf ? inf.id : null,
        p_name: name.value.trim(),
        p_code: c,
        p_discount: Math.round(Number(discount.value) || 0),
        p_commission: Math.round(Number(commission.value) || 0),
        p_phone: phone.value.trim() || null,
        p_active: active.checked,
        p_note: note.value.trim() || null,
      });
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(inf ? 'انحفظ التعديل ✅' : 'انضاف المؤثر ✅');
      renderInfluencerEditor(null);
      loadInfluencers();
    });

    box.replaceChildren(
      el('h3', { text: inf ? 'تعديل ' + inf.name : 'مؤثر جديد', style: 'margin:0' }),
      el('div', { class: 'help', text: 'الزبون يكتب الكود بخانة كود الخصم بالتطبيق، ويشتغل لأول طلب إله بس. العمولة تنحسب لما الطلب يصير "مكتمل"، وتغييرها يمشي على الطلبات الجاية.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'اسم المؤثر' }), name),
        el('div', null, el('label', { class: 'lbl', text: 'الكود' }), code),
        el('div', null, el('label', { class: 'lbl', text: 'خصم الزبون (د.ع)' }), discount,
          el('div', { class: 'help', text: 'أكثر من كود الترحيب MODONEW (1,000)، حتى المتابعين يحسون كود المؤثر إله قيمة.' })),
        el('div', null, el('label', { class: 'lbl', text: 'عمولة المؤثر لكل طلب (د.ع)' }), commission),
        el('div', null, el('label', { class: 'lbl', text: 'رقم المؤثر (اختياري)' }), phone,
          el('div', { class: 'help', text: 'طلباته هو بكوده ما تنحسب.' })),
        el('div', null, el('label', { class: 'lbl', text: 'ملاحظة (الاتفاق)' }), note),
        el('label', { class: 'check full' }, active, 'فعّال (إذا انطفى، الكود يوقف بالتطبيق)'),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px' },
        save,
        inf ? el('button', { class: 'btn', type: 'button', onclick: () => renderInfluencerEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ================= الهدايا المجانية ويه الطلب =================
  // الزبون يختار هدية بصفحة إتمام الطلب، والسيرفر يتحقق (فعّالة، متوفرة، الحد الأدنى، مرة لكل رقم)
  // وتنضاف للطلب بسعر 0 وتنخصم من المخزون (وترجع إذا انلغى الطلب).
  const giftLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

  async function openGifts() {
    if (!adm.productsLoaded) await loadProducts();
    if (!$('gift-editor').childElementCount) renderGiftEditor(null);
    loadGifts();
  }

  async function loadGifts() {
    $('gift-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const [offers, given] = await Promise.all([
      db.from('gift_offers').select('*').order('sort_order').order('id', { ascending: false }),
      db.from('order_items').select('gift_offer_id').not('gift_offer_id', 'is', null).limit(5000),
    ]);
    if (offers.error) { $('gift-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(offers.error) })); return; }
    const counts = new Map();
    (given.data || []).forEach((r) => counts.set(r.gift_offer_id, (counts.get(r.gift_offer_id) || 0) + 1));
    adm.gifts = (offers.data || []).map((g) => ({ ...g, given: counts.get(g.id) || 0 }));
    renderGifts();
  }

  function giftState(g) {
    const now = Date.now();
    const p = adm.products.find((x) => x.id === g.product_id);
    if (!g.is_active) return ['متوقفة', 'muted'];
    if (g.starts_at && new Date(g.starts_at).getTime() > now) return ['تبدي ' + new Date(g.starts_at).toLocaleString('en-GB'), 'muted'];
    if (g.ends_at && new Date(g.ends_at).getTime() <= now) return ['خلصت', 'muted'];
    if (!p || !(Number(p.stock) > 0)) return ['نفد المخزون', 'error'];
    return ['شغّالة هسه ✅', 'ok'];
  }

  function renderGifts() {
    const list = adm.gifts || [];
    if (!list.length) {
      $('gift-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو هدايا لحد هسه. ضيفوا هدية من فوگ، وتطلع للزبائن بصفحة إتمام الطلب.' }));
      return;
    }
    $('gift-list').replaceChildren(
      el('h3', { text: 'الهدايا', style: 'margin:6px 0 10px' }),
      ...list.map((g) => {
        const p = adm.products.find((x) => x.id === g.product_id) || {};
        const img = Array.isArray(p.image_url) ? p.image_url[0] : null;
        const [state, cls] = giftState(g);
        const toggle = el('button', { class: 'btn btn-sm', type: 'button' }, g.is_active ? 'إيقاف' : 'تفعيل');
        toggle.addEventListener('click', async () => {
          toggle.disabled = true;
          const { error } = await db.from('gift_offers').update({ is_active: !g.is_active }).eq('id', g.id);
          if (error) { toast(friendlyError(error), true); toggle.disabled = false; return; }
          loadGifts();
        });
        const del = el('button', { class: 'btn btn-sm', type: 'button', style: 'color:var(--danger, #c62828)' }, 'حذف');
        del.addEventListener('click', async () => {
          if (!confirm('تحذف هذه الهدية؟ الطلبات القديمة اللي بيها الهدية تبقى مثل ما هي.')) return;
          const { error } = await db.from('gift_offers').delete().eq('id', g.id);
          if (error) { toast(friendlyError(error), true); return; }
          toast('انحذفت الهدية');
          loadGifts();
        });
        return el('div', { class: 'inf-card' },
          el('div', { style: 'display:flex;gap:12px;align-items:center' },
            img ? el('img', { src: img, alt: '', style: 'width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none' }) : null,
            el('div', { style: 'flex:1;min-width:0' },
              el('div', { style: 'font-weight:800', text: (g.title ? g.title + ' · ' : '') + (p.name || ('منتج #' + g.product_id)) }),
              el('div', { class: cls === 'error' ? 'error' : 'muted', style: 'font-size:13px', text: state }),
              el('div', { class: 'muted', style: 'font-size:13px', text:
                `المخزون: ${p.stock ?? '?'} · أقل طلب: ${Number(g.min_order) > 0 ? money(g.min_order) + ' د.ع' : 'أي طلب'} · ${g.once_per_phone ? 'مرة وحدة لكل رقم' : 'بكل طلب'}` }),
              el('div', { class: 'muted', style: 'font-size:13px', text:
                `من: ${g.starts_at ? new Date(g.starts_at).toLocaleString('en-GB') : 'هسه'} · إلى: ${g.ends_at ? new Date(g.ends_at).toLocaleString('en-GB') : 'بدون نهاية'} · انطت: ${g.given} مرة` }),
            ),
          ),
          el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderGiftEditor(g); window.scrollTo(0, 0); } }, 'تعديل'),
            toggle, del),
        );
      }),
    );
  }

  function renderGiftEditor(g) {
    const box = $('gift-editor');
    const search = el('input', { class: 'field', placeholder: 'ابحث باسم المنتج أو رقمه...' });
    const pick = el('select', { class: 'field' });
    const fill = () => {
      const q = search.value.trim();
      const rows = adm.products
        .filter((p) => (Number(p.stock) > 0 || (g && p.id === g.product_id)) && (!q || String(p.id) === q.replace('#', '') || (p.name || '').includes(q)))
        .slice(0, 200);
      pick.replaceChildren(
        el('option', { value: '', text: rows.length ? '— اختاروا المنتج —' : 'ماكو نتائج' }),
        ...rows.map((p) => el('option', { value: p.id, text: `#${p.id} · ${p.name} · مخزون ${p.stock}` })),
      );
      if (g) pick.value = String(g.product_id);
    };
    search.addEventListener('input', fill);
    fill();
    const title = el('input', { class: 'field', maxlength: 40, placeholder: 'اختياري، مثال: هدية الافتتاح', value: g ? g.title || '' : '' });
    const minOrder = el('input', { class: 'field', type: 'number', min: 0, step: 1000, value: g ? Number(g.min_order) : 0 });
    const starts = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(g && g.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(g && g.ends_at) });
    const once = el('input', { type: 'checkbox' });
    once.checked = g ? g.once_per_phone : true;
    const active = el('input', { type: 'checkbox' });
    active.checked = g ? g.is_active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, g ? 'حفظ التعديل' : 'إضافة الهدية');

    save.addEventListener('click', async () => {
      err.textContent = '';
      const productId = Number(pick.value);
      if (!productId) { err.textContent = 'اختاروا المنتج اللي يصير هدية'; return; }
      if (starts.value && ends.value && new Date(ends.value) <= new Date(starts.value)) { err.textContent = 'النهاية لازم بعد البداية'; return; }
      const row = {
        product_id: productId,
        title: title.value.trim() || null,
        min_order: Math.max(0, Math.round(Number(minOrder.value) || 0)),
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
        once_per_phone: once.checked,
        is_active: active.checked,
      };
      save.disabled = true;
      const { error } = g
        ? await db.from('gift_offers').update(row).eq('id', g.id)
        : await db.from('gift_offers').insert(row);
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(g ? 'انحفظ التعديل ✅' : 'انضافت الهدية ✅');
      renderGiftEditor(null);
      loadGifts();
    });

    box.replaceChildren(
      el('h3', { text: g ? 'تعديل الهدية' : 'هدية جديدة 🎁', style: 'margin:0' }),
      el('div', { class: 'help', text: 'الهدية تطلع للزبون بصفحة إتمام الطلب (بالنسخة الجديدة من التطبيق)، ويختار وحدة ويه طلبه. تنضاف للطلب بسعر 0 وتنخصم من مخزون المنتج، وإذا انلغى الطلب ترجع. بتيليگرام والصفحة تبين بالطلب كـ "هدية مجانية 🎁".' }),
      el('div', { class: 'form-grid' },
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'المنتج' }), search, pick),
        el('div', null, el('label', { class: 'lbl', text: 'عنوان الهدية (اختياري)' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'أقل مبلغ للطلب (د.ع)' }), minOrder,
          el('div', { class: 'help', text: '0 = ويه أي طلب.' })),
        el('div', null, el('label', { class: 'lbl', text: 'تبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'تنتهي (اختياري)' }), ends),
        el('label', { class: 'check full' }, once, 'مرة وحدة لكل رقم تلفون (ينصح بيها حتى ما أحد يكرر الطلبات على الهدية)'),
        el('label', { class: 'check full' }, active, 'فعّالة'),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px' },
        save,
        g ? el('button', { class: 'btn', type: 'button', onclick: () => renderGiftEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ================= العروض (على مجموعة منتجات) =================
  // باقة: أي N قطع من منتجات العرض بسعر ثابت (والتوصيل مجاني إذا مأشّر)، تنجمع من موديلات وألوان مختلفة.
  // توصيل مجاني: الأسعار عادية، بس إذا مجموع قطع منتجات العرض وصل N، التوصيل مجاني.
  // المنتج يدخل بعرض واحد بس. الحساب كله بالسيرفر (private.cart_price)، والعرض يلغي عروض الكمية الخاصة بالمنتج.
  const offerPieces = (n) => (n === 2 ? 'قطعتين' : n <= 10 ? n + ' قطع' : n + ' قطعة');
  const productsCount = (n) => (n === 1 ? 'منتج واحد' : n === 2 ? 'منتجين' : n <= 10 ? n + ' منتجات' : n + ' منتج');
  const offerRule = (o) => o.kind === 'bundle'
    ? `أي ${offerPieces(o.qty)} بـ ${money(o.price)} د.ع${o.free_delivery ? ' + توصيل مجاني' : ''}`
    : `${offerPieces(o.qty)} من العرض = توصيل مجاني`;

  async function openOffers() {
    loadPiecesSetting();
    if (!adm.productsLoaded) await loadProducts();
    if (!$('offer-editor').childElementCount) renderOfferEditor(null);
    loadOffers();
  }

  // توصيل مجاني للطلب كله إذا مجموع القطع وصل العدد (store_settings، يتحسب بالسيرفر بـ private.cart_price)
  async function loadPiecesSetting() {
    const box = $('offer-settings');
    if (!box.childElementCount) box.replaceChildren(el('div', { class: 'muted', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('store_settings').select('free_delivery_pieces_on, free_delivery_min_pieces').eq('id', 1).maybeSingle();
    if (error) { box.replaceChildren(el('div', { class: 'error', text: friendlyError(error) })); return; }
    const s = data || { free_delivery_pieces_on: false, free_delivery_min_pieces: 4 };
    const on = el('input', { type: 'checkbox' });
    on.checked = !!s.free_delivery_pieces_on;
    const min = el('input', { class: 'field', type: 'number', min: 2, max: 100, step: 1, value: s.free_delivery_min_pieces, style: 'max-width:110px' });
    const status = el('div', { style: 'font-weight:800' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'حفظ');
    const paint = () => {
      const n = Math.round(Number(min.value) || 0);
      status.textContent = s.free_delivery_pieces_on
        ? `شغّال هسه ✅ التوصيل مجاني لأي طلب من ${offerPieces(s.free_delivery_min_pieces)} وفوگ`
        : 'مطفي هسه، التوصيل يندفع حسب المحافظة';
      status.style.color = s.free_delivery_pieces_on ? '#1b7f3b' : 'var(--muted)';
      save.disabled = on.checked === !!s.free_delivery_pieces_on && n === Number(s.free_delivery_min_pieces);
    };
    [on, min].forEach((x) => x.addEventListener('input', paint));
    on.addEventListener('change', paint);
    save.addEventListener('click', async () => {
      err.textContent = '';
      const n = Math.round(Number(min.value) || 0);
      if (n < 2 || n > 100) { err.textContent = 'العدد من 2 إلى 100'; return; }
      save.disabled = true;
      const { error: e } = await db.from('store_settings')
        .update({ free_delivery_pieces_on: on.checked, free_delivery_min_pieces: n, updated_at: new Date().toISOString() })
        .eq('id', 1);
      if (e) { err.textContent = friendlyError(e); save.disabled = false; return; }
      toast(on.checked ? `التوصيل صار مجاني من ${offerPieces(n)} ✅` : 'انطفى التوصيل المجاني حسب العدد');
      loadPiecesSetting();
    });
    box.replaceChildren(
      el('h3', { text: '🚚 توصيل مجاني حسب عدد القطع', style: 'margin:0' }),
      el('div', { class: 'help', text: 'إذا مجموع القطع بالطلب (من أي منتجات) وصل العدد، التوصيل يصير مجاني على الطلب كله. الأسعار ما تتغير، والهدية المجانية ما تنحسب ويه القطع. التطبيق يبينه للزبون من نسخة 2.0.3؛ النسخ القديمة ما تبينه بس السيرفر يطبقه (يعني الزبون يدفع أقل من اللي شافه).' }),
      status,
      el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
        el('label', { class: 'check' }, on, 'شغّال'),
        el('span', { text: 'من' }), min, el('span', { text: 'قطع وفوگ' }),
        save),
      err,
    );
    paint();
  }

  // عرض ثاني شغّال (أو راح يبدي) بنفس القيم: الزبون ما يگدر يجمع بين عرضين منفصلين، فننبه
  function offerTwin(row, exceptId) {
    const now = Date.now();
    return (adm.offers || []).find((x) => x.id !== exceptId && x.is_active
      && !(x.ends_at && new Date(x.ends_at).getTime() <= now)
      && x.kind === row.kind && Number(x.qty) === Number(row.qty)
      && (row.kind !== 'bundle' || (Number(x.price) === Number(row.price) && !!x.free_delivery === !!row.free_delivery)));
  }

  async function loadOffers() {
    $('offer-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const [offers, links] = await Promise.all([
      db.from('offers').select('*').order('id', { ascending: false }),
      db.from('offer_products').select('offer_id, product_id').limit(5000),
    ]);
    const error = offers.error || links.error;
    if (error) { $('offer-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    const byOffer = new Map();
    (links.data || []).forEach((r) => {
      if (!byOffer.has(r.offer_id)) byOffer.set(r.offer_id, []);
      byOffer.get(r.offer_id).push(r.product_id);
    });
    adm.offers = (offers.data || []).map((o) => ({ ...o, products: byOffer.get(o.id) || [] }));
    renderOffers();
  }

  function offerState(o) {
    const now = Date.now();
    if (!o.is_active) return ['متوقف', 'muted'];
    if (o.starts_at && new Date(o.starts_at).getTime() > now) return ['يبدي ' + new Date(o.starts_at).toLocaleString('en-GB'), 'muted'];
    if (o.ends_at && new Date(o.ends_at).getTime() <= now) return ['خلص', 'muted'];
    const inStock = o.products.filter((id) => Number((adm.products.find((p) => p.id === id) || {}).stock) > 0).length;
    if (!inStock) return ['كل منتجاته نافدة', 'error'];
    return ['شغّال هسه ✅', 'ok'];
  }

  function renderOffers() {
    const list = adm.offers || [];
    if (!list.length) {
      $('offer-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو عروض لحد هسه. سووا عرض من فوگ.' }));
      return;
    }
    $('offer-list').replaceChildren(
      el('h3', { text: 'العروض', style: 'margin:6px 0 10px' }),
      ...list.map((o) => {
        const [state, cls] = offerState(o);
        const prods = o.products.map((id) => adm.products.find((p) => p.id === id) || { id });
        const inStock = prods.filter((p) => Number(p.stock) > 0).length;
        const toggle = el('button', { class: 'btn btn-sm', type: 'button' }, o.is_active ? 'إيقاف' : 'تفعيل');
        toggle.addEventListener('click', async () => {
          toggle.disabled = true;
          const { error } = await db.from('offers').update({ is_active: !o.is_active }).eq('id', o.id);
          if (error) { toast(friendlyError(error), true); toggle.disabled = false; return; }
          loadOffers();
        });
        const del = el('button', { class: 'btn btn-sm', type: 'button', style: 'color:var(--danger, #c62828)' }, 'حذف');
        del.addEventListener('click', async () => {
          if (!confirm(`تحذف العرض "${o.title}"؟ المنتجات ترجع لأسعارها وعروضها العادية. الطلبات القديمة تبقى مثل ما هي.`)) return;
          const { error } = await db.from('offers').delete().eq('id', o.id);
          if (error) { toast(friendlyError(error), true); return; }
          toast('انحذف العرض');
          if (adm.offerEditing === o.id) renderOfferEditor(null);
          loadOffers();
        });
        return el('div', { class: 'inf-card' },
          el('div', null,
            el('div', { style: 'font-weight:800', text: o.title }),
            el('div', { style: 'font-size:14px;font-weight:700;color:#1b7f3b', text: offerRule(o) }),
            el('div', { class: cls === 'error' ? 'error' : 'muted', style: 'font-size:13px', text: state }),
            el('div', { class: 'muted', style: 'font-size:13px', text:
              `المنتجات: ${prods.length} (المتوفر ${inStock}) · من: ${o.starts_at ? new Date(o.starts_at).toLocaleString('en-GB') : 'هسه'} · إلى: ${o.ends_at ? new Date(o.ends_at).toLocaleString('en-GB') : 'بدون نهاية'}` }),
          ),
          el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
            ...prods.slice(0, 12).map((p) => {
              const img = Array.isArray(p.image_url) ? p.image_url[0] : null;
              return img
                ? el('img', { src: img, alt: p.name || '', title: `#${p.id} ${p.name || ''}`, style: `width:44px;height:44px;object-fit:cover;border-radius:10px;${Number(p.stock) > 0 ? '' : 'opacity:.35'}` })
                : el('span', { class: 'muted', style: 'font-size:12px', text: '#' + p.id });
            }),
            prods.length > 12 ? el('span', { class: 'muted', style: 'align-self:center;font-size:13px', text: '+' + (prods.length - 12) }) : null,
          ),
          el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderOfferEditor(o); window.scrollTo(0, 0); } }, 'تعديل'),
            toggle, del),
        );
      }),
    );
  }

  function renderOfferEditor(o) {
    adm.offerEditing = o ? o.id : null;
    const box = $('offer-editor');
    const selected = new Set(o ? o.products : []);
    // المنتج بعرض واحد بس: نعرف وين موجود حتى ما يتكرر
    const offerOfProduct = new Map();
    (adm.offers || []).forEach((x) => { if (!o || x.id !== o.id) x.products.forEach((id) => offerOfProduct.set(id, x)); });

    const title = el('input', { class: 'field', maxlength: 60, placeholder: 'مثال: عرض الشتاء ❄️', value: o ? o.title : '' });
    const kind = el('select', { class: 'field' },
      el('option', { value: 'bundle', text: 'باقة بسعر ثابت (أي N قطع بمبلغ)' }),
      el('option', { value: 'free_delivery', text: 'توصيل مجاني بس (الأسعار عادية)' }),
    );
    kind.value = o ? o.kind : 'bundle';
    const qty = el('input', { class: 'field', type: 'number', min: 2, max: 50, step: 1, value: o ? o.qty : 3 });
    const price = el('input', { class: 'field', type: 'number', min: 0, step: 250, value: o && o.price != null ? Number(o.price) : '' });
    const fd = el('input', { type: 'checkbox' });
    fd.checked = o ? o.free_delivery : true;
    const starts = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(o && o.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(o && o.ends_at) });
    const active = el('input', { type: 'checkbox' });
    active.checked = o ? o.is_active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const warn = el('div', { class: 'help', style: 'color:#b26a00;font-weight:700' });
    const twinBox = el('div', { style: 'display:none;background:#e8f1fd;border:1px solid #b6d0f5;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:#1a4f8f' });
    const preview = el('div', { style: 'font-weight:800;color:#1b7f3b' });
    const rowNow = () => {
      const bundle = kind.value === 'bundle';
      return { kind: kind.value, qty: Math.round(Number(qty.value) || 0), price: bundle ? Math.round(Number(price.value) || 0) : null, free_delivery: bundle ? fd.checked : true };
    };
    // يضيف المنتجات المختارة للعرض اللي بنفس القيم بدل عرض جديد
    const mergeInto = async (twin) => {
      const add = [...selected].filter((id) => !twin.products.includes(id));
      if (add.length) {
        const { error } = await db.from('offer_products').insert(add.map((pid) => ({ offer_id: twin.id, product_id: pid })));
        if (error) { err.textContent = error.code === '23505' ? 'منتج من المختارة صار بعرض ثاني، حدّثوا الصفحة وجرّبوا مرة ثانية' : friendlyError(error); return; }
      }
      toast(add.length ? `انضاف ${productsCount(add.length)} لعرض "${twin.title}" ✅` : `المنتجات موجودة أصلاً بعرض "${twin.title}"`);
      renderOfferEditor(null);
      loadOffers();
    };
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, o ? 'حفظ التعديل' : 'إضافة العرض');

    const priceBox = el('div', null, el('label', { class: 'lbl', text: 'سعر الباقة (د.ع)' }), price);
    const fdBox = el('label', { class: 'check full' }, fd, 'التوصيل مجاني ويه الباقة');

    const chips = el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' });
    const search = el('input', { class: 'field', placeholder: 'ابحث باسم المنتج أو رقمه وضيفه للعرض...' });
    const results = el('div', { style: 'display:grid;gap:4px;max-height:260px;overflow:auto' });

    const refresh = () => {
      const bundle = kind.value === 'bundle';
      priceBox.style.display = bundle ? '' : 'none';
      fdBox.style.display = bundle ? '' : 'none';
      const n = Math.round(Number(qty.value) || 0);
      const pz = Number(price.value) || 0;
      preview.textContent = n >= 2 ? 'الزبون يشوف: ' + offerRule({ kind: kind.value, qty: n, price: pz, free_delivery: bundle ? fd.checked : true }) : '';
      // عرض جديد بنفس قيم عرض موجود: ننبه ونقترح نضيف المنتجات له
      const twin = !o && n >= 2 && (!bundle || pz > 0) ? offerTwin(rowNow(), null) : null;
      twinBox.style.display = twin ? '' : 'none';
      if (twin) {
        twinBox.replaceChildren(
          el('div', { text: `ℹ️ اكو عرض بنفس القيم: "${twin.title}" (${productsCount(twin.products.length)}). إذا تسوون عرض جديد، الزبون ما يگدر يجمع قطع من العرضين سوى. حتى يتجمعن، ضيفوا المنتجات لذاك العرض.` }),
          selected.size
            ? el('button', { class: 'btn btn-sm', type: 'button', style: 'margin-top:6px', onclick: () => mergeInto(twin) }, `ضيف المنتجات المختارة لـ "${twin.title}"`)
            : null,
        );
      }
      // تنبيه: إذا سعر القطعة بالباقة أغلى من سعر منتج عادي، الزبون يدفع أكثر
      warn.textContent = '';
      if (bundle && n >= 2 && pz > 0 && selected.size) {
        const per = pz / n;
        const dearer = [...selected].map((id) => adm.products.find((p) => p.id === id)).filter((p) => p && Number(p.price) < per);
        if (dearer.length) warn.textContent = `⚠️ سعر القطعة بالباقة (${money(per)}) أغلى من السعر العادي لـ: ${dearer.slice(0, 5).map((p) => p.name).join('، ')}${dearer.length > 5 ? '…' : ''}. الزبون راح يدفع أكثر بهذي المنتجات.`;
      }
      chips.replaceChildren(
        ...(selected.size ? [] : [el('span', { class: 'muted', style: 'font-size:13px', text: 'ما اخترتوا منتجات بعد.' })]),
        ...[...selected].map((id) => {
          const p = adm.products.find((x) => x.id === id) || { id, name: 'منتج #' + id };
          return el('span', { style: 'display:inline-flex;align-items:center;gap:6px;background:#eaf7ee;border:1px solid #b9e2c5;border-radius:20px;padding:4px 6px 4px 10px;font-size:13px' },
            `#${p.id} ${p.name}${Number(p.stock) > 0 ? '' : ' (نافد)'} · ${money(p.price)}`,
            el('button', { type: 'button', class: 'btn btn-sm', style: 'min-height:24px;padding:0 8px', 'aria-label': 'شيل', onclick: () => { selected.delete(id); refresh(); } }, '✕'),
          );
        }),
      );
      const q = search.value.trim();
      if (!q) { results.replaceChildren(); return; }
      const rows = adm.products
        .filter((p) => String(p.id) === q.replace('#', '') || (p.name || '').includes(q))
        .slice(0, 40);
      results.replaceChildren(
        ...(rows.length ? [] : [el('div', { class: 'muted', text: 'ماكو نتائج' })]),
        ...rows.map((p) => {
          const other = offerOfProduct.get(p.id);
          const added = selected.has(p.id);
          const btn = el('button', { class: 'btn btn-sm', type: 'button', disabled: added || !!other ? '' : null }, added ? 'مضاف ✓' : other ? 'بعرض ثاني' : '+ إضافة');
          btn.addEventListener('click', () => { selected.add(p.id); refresh(); });
          return el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0' },
            el('span', { style: 'font-size:13px', text: `#${p.id} · ${p.name} · ${money(p.price)} د.ع · مخزون ${p.stock}${other ? ` · (بعرض "${other.title}")` : ''}` }),
            btn);
        }),
      );
    };
    [kind, qty, price, fd].forEach((x) => x.addEventListener('input', refresh));
    kind.addEventListener('change', refresh);
    search.addEventListener('input', refresh);

    save.addEventListener('click', async () => {
      err.textContent = '';
      const bundle = kind.value === 'bundle';
      const n = Math.round(Number(qty.value) || 0);
      const pz = Math.round(Number(price.value) || 0);
      if (title.value.trim().length < 2) { err.textContent = 'اكتبوا عنوان العرض'; return; }
      if (n < 2 || n > 50) { err.textContent = 'عدد القطع من 2 إلى 50'; return; }
      if (bundle && pz <= 0) { err.textContent = 'اكتبوا سعر الباقة'; return; }
      if (!selected.size) { err.textContent = 'ضيفوا منتج واحد على الأقل للعرض'; return; }
      if (starts.value && ends.value && new Date(ends.value) <= new Date(starts.value)) { err.textContent = 'النهاية لازم بعد البداية'; return; }
      if (!o) {
        const twin = offerTwin(rowNow(), null);
        if (twin && confirm(`اكو عرض بنفس القيم: "${twin.title}".\nإذا تسوون عرض جديد منفصل، الزبون ما يگدر يجمع قطع من العرضين سوى.\n\nموافق = نضيف المنتجات المختارة لعرض "${twin.title}"\nإلغاء = نسوي عرض جديد منفصل`)) {
          await mergeInto(twin);
          return;
        }
      }
      if (warn.textContent && !confirm(warn.textContent + '\n\nتكمل وتحفظ؟')) return;
      const row = {
        title: title.value.trim(),
        kind: kind.value,
        qty: n,
        price: bundle ? pz : null,
        free_delivery: bundle ? fd.checked : true,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
        is_active: active.checked,
      };
      save.disabled = true;
      try {
        let id = o && o.id;
        if (id) {
          const { error } = await db.from('offers').update(row).eq('id', id);
          if (error) throw error;
        } else {
          const { data, error } = await db.from('offers').insert(row).select('id').single();
          if (error) throw error;
          id = data.id;
        }
        const before = new Set(o ? o.products : []);
        const removed = [...before].filter((x) => !selected.has(x));
        const added = [...selected].filter((x) => !before.has(x));
        if (removed.length) {
          const { error } = await db.from('offer_products').delete().eq('offer_id', id).in('product_id', removed);
          if (error) throw error;
        }
        if (added.length) {
          const { error } = await db.from('offer_products').insert(added.map((pid) => ({ offer_id: id, product_id: pid })));
          if (error) throw error;
        }
        toast(o ? 'انحفظ العرض ✅' : 'انضاف العرض ✅');
        renderOfferEditor(null);
        loadOffers();
      } catch (e) {
        err.textContent = e && e.code === '23505' ? 'منتج من المختارة صار بعرض ثاني، حدّثوا الصفحة وجرّبوا مرة ثانية' : friendlyError(e);
      } finally {
        save.disabled = false;
      }
    });

    box.replaceChildren(
      el('h3', { text: o ? 'تعديل العرض' : 'عرض جديد 🏷️', style: 'margin:0' }),
      el('div', { class: 'help', text: 'الزبون يجمع قطع من منتجات العرض (أي موديل وأي لون) والعرض ينحسب على المجموع. مثال: ربطة + شالين = 3 قطع بـ 20,000 والتوصيل مجاني. الباقة تلغي عروض الكمية وأسعار الجملة الخاصة بالمنتج طول ما هي شغّالة (عرض التوصيل المجاني ما يلغي شي). المنتج يدخل بعرض واحد بس.' }),
      el('div', { class: 'help', style: 'color:#b26a00;font-weight:700', text: '⚠️ العروض تطلع بالتطبيق من نسخة 2.0.3 وفوگ. السيرفر يحسبها لكل الطلبات، فلا تشغّلون عرض قبل ما تنزل 2.0.3 بالمتجرين، حتى الزبون بالنسخة القديمة ما يشوف سعر ويندفع غيره.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'عنوان العرض' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'نوع العرض' }), kind),
        el('div', null, el('label', { class: 'lbl', text: 'عدد القطع' }), qty),
        priceBox,
        fdBox,
        el('div', { class: 'full' }, preview),
        el('div', { class: 'full' }, twinBox),
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: `منتجات العرض` }), chips, search, results, warn),
        el('div', null, el('label', { class: 'lbl', text: 'يبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'ينتهي (اختياري)' }), ends),
        el('label', { class: 'check full' }, active, 'فعّال'),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px' },
        save,
        o ? el('button', { class: 'btn', type: 'button', onclick: () => renderOfferEditor(null) }, 'إلغاء') : null,
      ),
    );
    refresh();
  }

  // ================= الأحداث =================
  $('login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    unlockAudio();
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || !password) { $('login-error').textContent = 'اكتب البريد وكلمة المرور'; return; }
    $('login-error').textContent = '';
    $('login-btn').disabled = true;
    $('login-btn').textContent = 'جاري الدخول...';
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) { showLogin(friendlyError(error)); return; }
    $('password').value = '';
    await showApp();
  });

  $('logout-btn').addEventListener('click', async () => {
    await db.auth.signOut();
    state.orders = [];
    state.itemsCache.clear();
    adm.products = []; adm.productsLoaded = false; adm.clips = []; adm.clipsLoaded = false; adm.looks = []; adm.stories = []; adm.splash = [];
    $('splash-editor').replaceChildren();
    $('look-editor').replaceChildren();
    $('story-editor').replaceChildren();
    $('inf-editor').replaceChildren();
    adm.influencers = [];
    showSection('orders');
    closeDetail();
    showLogin();
  });

  $('refresh-btn').addEventListener('click', () => {
    unlockAudio();
    if (adm.section === 'products') { loadProducts(); return; }
    if (adm.section === 'clips') { loadClips(); return; }
    if (adm.section === 'push') { loadPushLog(); return; }
    if (adm.section === 'looks') { loadLooks(); return; }
    if (adm.section === 'stories') { loadStories(); return; }
    if (adm.section === 'splash') { loadSplash(); return; }
    state.itemsCache.clear();
    loadOrders();
  });

  $('notify-btn').addEventListener('click', async () => {
    unlockAudio();
    if ('Notification' in window) await Notification.requestPermission();
    updateNotifyBtn();
    beep();
  });

  let searchTimer;
  $('search').addEventListener('input', (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = ev.target.value; renderList(); }, 150);
  });

  $('range').addEventListener('change', (ev) => {
    state.rangeDays = Number(ev.target.value);
    loadOrders();
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && state.selectedId && !$('confirm-dialog').open) closeDetail();
  });
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').classList.contains('hidden')) pollNew(); });
  setInterval(() => { if (!$('app').classList.contains('hidden')) renderList(); }, 60000);

  db.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') showLogin();
    if (event === 'PASSWORD_RECOVERY') setTimeout(showRecovery, 0);
  });

  (async () => {
    const { data, error } = await db.auth.getSession();
    if (OPENED_FROM_RECOVERY) {
      if (data.session) showRecovery();
      else { clearAuthHash(); showLogin(error ? friendlyError(error) : 'الرابط منتهي أو مستخدم، اطلب رابط جديد من "نسيت كلمة المرور؟"'); }
      return;
    }
    if (data.session) await showApp();
    else showLogin();
  })();
})();
</script>
</body>
</html>
