    $('inf-list').replaceChildren(
      el('h3', { text: 'المؤثرين', style: 'margin:6px 0 4px' }),
      el('div', { class: 'help', style: 'margin-bottom:10px', text: `الباقي لكل المؤثرين هسه: ${money(due)} د.ع. العمولة تنحسب لما الطلب يصير "مكتمل"، وبس إذا كان أول طلب للزبون ومو رقم المؤثر نفسه.` }),
      ...list.map(renderInfluencerCard),
    );
  }

  function renderInfluencerCard(inf) {
    const links = infLinks(inf);
    const balance = Number(inf.earned) - Number(inf.paid);
    const amount = el('input', { class: 'field', type: 'number', min: 1, step: 500, placeholder: 'المبلغ', value: balance > 0 ? balance : '' });
    const payBtn = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'تسجيل');
    payBtn.addEventListener('click', async () => {
      const v = Math.round(Number(amount.value));
      if (!(v > 0)) { toast('اكتب المبلغ', true); return; }
      const ok = await confirmDialog(`تسجيل دفعة ${money(v)} د.ع؟`, `للمؤثر ${inf.name}، وتنطرح من الباقي إله.`, 'تسجيل');
      if (!ok) return;
      payBtn.disabled = true;
      const { error } = await db.from('influencer_payouts').insert({ influencer_id: inf.id, amount: v });
      payBtn.disabled = false;
      if (error) { toast(friendlyError(error), true); return; }
      toast('انسجلت الدفعة ✅');
      loadInfluencers();
    });
    const payBox = el('div', { class: 'inf-pay hidden' }, amount, payBtn);
    return el('div', { class: 'inf-card' },
      el('div', { class: 'inf-head' },
        el('span', { class: 'prod-name', text: inf.name }),
        el('span', { class: 'badge orange num', text: inf.code }),
        el('span', { class: 'badge ' + (inf.active ? 'green' : 'red'), text: inf.active ? 'فعّال' : 'موقوف' }),
        el('span', { class: 'badge', title: inf.account_email || '', text: inf.account_email ? '📱 مربوط بحساب' : 'مو مربوط بحساب' }),
        el('span', { class: 'spacer' }),
        el('span', { class: 'help', style: 'margin:0', text: `خصم الزبون ${money(inf.discount)} · العمولة ${money(inf.commission)} د.ع` }),
      ),
      el('div', { class: 'inf-stats' },
        infStat('زيارات الرابط', money(inf.visits)),
        infStat('طلبات بكوده', money(inf.orders)),
        infStat('واصلة وتنحسب', money(inf.counted)),
        infStat('بالطريق', money(inf.in_progress)),
        infStat('ملغية', money(inf.cancelled)),
        infStat('العمولة الكلية', money(inf.earned)),
        infStat('المدفوع', money(inf.paid)),
        infStat('الباقي إله', money(balance), 'due'),
      ),
      inf.note ? el('div', { class: 'help', style: 'margin:0', text: '📝 ' + inf.note }) : null,
      inf.account_email ? el('div', { class: 'help', style: 'margin:0', text: '📱 حساب التطبيق: ' + inf.account_email + ' (يشوف "أرباحي" بالتطبيق)' }) : null,
      el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(links.ad, 'انتسخ رابط الإعلان') }, 'نسخ رابط الإعلان'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => copyText(links.dashboard, 'انتسخ رابط صفحة المؤثر') }, 'نسخ رابط صفحته'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => payBox.classList.toggle('hidden') }, 'تسجيل دفعة'),
        el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderInfluencerEditor(inf); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'تعديل'),
      ),
      payBox,
    );
  }

  // app = طلب انضمام (عند القبول): الفورم يتعبى بالاسم والرقم، وبعد الحفظ ينربط حسابه
  function renderInfluencerEditor(inf, app = null) {
    const box = $('inf-editor');
    const name = el('input', { class: 'field', maxlength: 60, placeholder: 'مثال: زينب', value: inf ? inf.name : app ? app.name : '' });
    const email = el('input', { class: 'field', type: 'email', dir: 'ltr', placeholder: 'name@example.com',
      value: inf ? inf.account_email || '' : app ? app.email || '' : '' });
    if (app) email.disabled = true;
    const code = el('input', { class: 'field num', maxlength: 20, dir: 'ltr', placeholder: 'مثال: ZAINAB', style: 'text-transform:uppercase', value: inf ? inf.code : '' });
    // حرف O ورقم 0 يتخربطون بالكود الي بيه حروف وأرقام سوه: ينحفظ R020 والزبون يكتب RO20 فيطلعله "غير فعال".
    // الأسماء الي كلها حروف (NOOR) ما نحذّر منها، محد يكتب بيها صفر.
    const codeWarn = el('div', { class: 'help', style: 'color:#b45309;font-weight:700' });
    const codeSpell = el('div', { dir: 'ltr', style: 'display:flex;gap:4px;flex-wrap:wrap;margin-top:4px' });
    const confusing = (s) => /[O0]/.test(s) && /[A-Z]/.test(s) && /[0-9]/.test(s);
    const CH_KIND = { O: 'حرف', 0: 'رقم' };
    const showCodeWarn = () => {
      const s = code.value.trim().toUpperCase();
      const risk = confusing(s);
      codeWarn.textContent = risk ? '⚠️ الناس تخربط بين حرف O ورقم 0. الكود راح ينحفظ هيچ بالضبط، تأكدوا منه:' : '';
      codeSpell.replaceChildren(...(risk ? [...s].map((ch) => el('span', {
        class: 'badge' + (CH_KIND[ch] ? ' orange' : ''), dir: 'rtl', style: 'font:700 14px monospace;padding:2px 8px',
        text: CH_KIND[ch] ? `${CH_KIND[ch]} ${ch}` : ch,
      })) : []));
    };
    code.addEventListener('input', showCodeWarn);
    showCodeWarn();
    const discount = el('input', { class: 'field', type: 'number', min: 1500, step: 500, value: inf ? inf.discount : 2000 });
    const commission = el('input', { class: 'field', type: 'number', min: 0, step: 250, value: inf ? inf.commission : 500 });
    const phone = el('input', { class: 'field num', type: 'tel', dir: 'ltr', placeholder: '07xxxxxxxxx', value: inf ? inf.phone || '' : app ? app.phone || '' : '' });
    const note = el('input', { class: 'field', maxlength: 200, placeholder: 'مثال: 50 ألف على ستوريين', value: inf ? inf.note || '' : '' });
    const active = el('input', { type: 'checkbox' });
    active.checked = inf ? inf.active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, inf ? 'حفظ التعديل' : 'إضافة المؤثر');

    save.addEventListener('click', async () => {
      err.textContent = '';
      const c = code.value.trim().toUpperCase();
      if (!name.value.trim()) { err.textContent = 'اكتب اسم المؤثر'; return; }
      if (!/^[A-Z0-9]{3,20}$/.test(c)) { err.textContent = 'الكود من 3 لـ 20 حرف إنكليزي أو رقم، بدون فراغات'; return; }
      // نسأل مرة وحدة لما الكود جديد أو تغيّر، مو كل ما ينعدّل المؤثر
      if (confusing(c) && c !== String(inf ? inf.code : '').toUpperCase()) {
        const ok = await confirmDialog('الكود بيه حروف تتخربط',
          `الكود بيه حرف O أو رقم 0، والناس تخربط بيناتهم. إذا الزبون كتب حرف بدل رقم أو العكس، يطلعله "غير فعال". شوفوا تحت خانة الكود شلون راح ينحفظ بالضبط. الأفضل تختارون كود بدونهم. تحفظونه هيچ؟`, 'احفظه هيچ');
        if (!ok) return;
      }
      // لازم أكثر من كود الترحيب (MODONEW = 1,000) حتى المتابعين يحسون بقيمة كود المؤثر
      if (!(Number(discount.value) > 1000)) { err.textContent = 'خصم المؤثر لازم أكثر من خصم الترحيب (1,000 د.ع)'; return; }
      const mail = email.value.trim().toLowerCase();
      if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { err.textContent = 'إيميل حساب التطبيق غير صحيح'; return; }
      save.disabled = true;
      const { data, error } = await db.rpc('admin_save_influencer', {
        p_id: inf ? inf.id : null,
        p_name: name.value.trim(),
        p_code: c,
        p_discount: Math.round(Number(discount.value) || 0),
        p_commission: Math.round(Number(commission.value) || 0),
        p_phone: phone.value.trim() || null,
        p_active: active.checked,
        p_note: note.value.trim() || null,
      });
      if (error) { save.disabled = false; err.textContent = friendlyError(error); return; }
      // ربط حساب التطبيق: من طلب الانضمام، أو بالإيميل إذا تغيّر (فارغ = فك الربط)
      const id = (data && data.id) || (inf && inf.id);
      const before = ((inf && inf.account_email) || '').toLowerCase();
      if (id && (app || mail !== before)) {
        const { error: linkErr } = await db.rpc('admin_link_influencer_account', {
          p_influencer_id: id, p_email: app ? null : mail, p_application_id: app ? app.id : null,
        });
        if (linkErr) {
          save.disabled = false;
          err.textContent = 'انحفظ المؤثر، بس الربط بحساب التطبيق ما صار: ' + friendlyError(linkErr);
          loadInfluencers();
          return;
        }
      }
      save.disabled = false;
      toast(app ? 'انقبل الطلب وانربط الحساب ✅' : inf ? 'انحفظ التعديل ✅' : 'انضاف المؤثر ✅');
      renderInfluencerEditor(null);
      loadInfluencers();
      if (app) loadInfluencerApps();
    });

    box.replaceChildren(
      el('h3', { text: inf ? 'تعديل ' + inf.name : app ? 'قبول طلب ' + app.name : 'مؤثر جديد', style: 'margin:0' }),
      app ? el('div', { class: 'help', style: 'color:#1b7f3b;font-weight:700', text: 'اكتبوا الكود والخصم والعمولة واحفظوا: ينضاف المؤثر وينربط حسابه بالتطبيق، ويشوف "أرباحي" بصفحة حسابه.' }) : null,
      el('div', { class: 'help', text: 'الزبون يكتب الكود بخانة كود الخصم بالتطبيق، ويشتغل لأول طلب إله بس. العمولة تنحسب لما الطلب يصير "مكتمل"، وتغييرها يمشي على الطلبات الجاية.' }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'اسم المؤثر' }), name),
        el('div', null, el('label', { class: 'lbl', text: 'الكود' }), code, codeWarn, codeSpell),
        el('div', null, el('label', { class: 'lbl', text: 'خصم الزبون (د.ع)' }), discount,
          el('div', { class: 'help', text: 'أكثر من كود الترحيب MODONEW (1,000)، حتى المتابعين يحسون كود المؤثر إله قيمة.' })),
        el('div', null, el('label', { class: 'lbl', text: 'عمولة المؤثر لكل طلب (د.ع)' }), commission),
        el('div', null, el('label', { class: 'lbl', text: 'رقم المؤثر (اختياري)' }), phone,
          el('div', { class: 'help', text: 'طلباته هو بكوده ما تنحسب.' })),
        el('div', null, el('label', { class: 'lbl', text: 'ملاحظة (الاتفاق)' }), note),
        el('div', null, el('label', { class: 'lbl', text: 'إيميل حساب التطبيق (اختياري)' }), email,
          el('div', { class: 'help', text: app ? 'من طلب الانضمام، ينربط تلقائياً.' : 'إذا المؤثر عنده حساب بالتطبيق، اكتبوا إيميله حتى يشوف "أرباحي". امسحوه حتى تفكون الربط.' })),
        el('label', { class: 'check full' }, active, 'فعّال (إذا انطفى، الكود يوقف بالتطبيق)'),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px' },
        save,
        inf || app ? el('button', { class: 'btn', type: 'button', onclick: () => renderInfluencerEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ================= الهدايا المجانية ويه الطلب =================
  // الزبون يختار هدية بصفحة إتمام الطلب، والسيرفر يتحقق (فعّالة، متوفرة، الحد الأدنى، مرة لكل رقم)
  // وتنضاف للطلب بسعر 0 وتنخصم من المخزون (وترجع إذا انلغى الطلب).
  const giftLocal = (v) => { if (!v) return ''; const d = new Date(v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

  async function openGifts() {
    if (!adm.productsLoaded) await loadProducts();
    if (!$('gift-editor').childElementCount) renderGiftEditor(null);
    loadGifts();
  }

  async function loadGifts() {
    $('gift-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const [offers, given] = await Promise.all([
      db.from('gift_offers').select('*').order('sort_order').order('id', { ascending: false }),
      db.from('order_items').select('gift_offer_id').not('gift_offer_id', 'is', null).limit(5000),
    ]);
    if (offers.error) { $('gift-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(offers.error) })); return; }
    const counts = new Map();
    (given.data || []).forEach((r) => counts.set(r.gift_offer_id, (counts.get(r.gift_offer_id) || 0) + 1));
    adm.gifts = (offers.data || []).map((g) => ({ ...g, given: counts.get(g.id) || 0 }));
    renderGifts();
  }

  function giftState(g) {
    const now = Date.now();
    const p = adm.products.find((x) => x.id === g.product_id);
    if (!g.is_active) return ['متوقفة', 'muted'];
    if (g.starts_at && new Date(g.starts_at).getTime() > now) return ['تبدي ' + new Date(g.starts_at).toLocaleString('en-GB'), 'muted'];
    if (g.ends_at && new Date(g.ends_at).getTime() <= now) return ['خلصت', 'muted'];
    if (!p || !(Number(p.stock) > 0)) return ['نفد المخزون', 'error'];
    return ['شغّالة هسه ✅', 'ok'];
  }

  function renderGifts() {
    const list = adm.gifts || [];
    if (!list.length) {
      $('gift-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو هدايا لحد هسه. ضيفوا هدية من فوگ، وتطلع للزبائن بصفحة إتمام الطلب.' }));
      return;
    }
    $('gift-list').replaceChildren(
      el('h3', { text: 'الهدايا', style: 'margin:6px 0 10px' }),
      ...list.map((g) => {
        const p = adm.products.find((x) => x.id === g.product_id) || {};
        const img = Array.isArray(p.image_url) ? p.image_url[0] : null;
        const [state, cls] = giftState(g);
        const toggle = el('button', { class: 'btn btn-sm', type: 'button' }, g.is_active ? 'إيقاف' : 'تفعيل');
        toggle.addEventListener('click', async () => {
          toggle.disabled = true;
          const { error } = await db.from('gift_offers').update({ is_active: !g.is_active }).eq('id', g.id);
          if (error) { toast(friendlyError(error), true); toggle.disabled = false; return; }
          loadGifts();
        });
        const del = el('button', { class: 'btn btn-sm', type: 'button', style: 'color:var(--danger, #c62828)' }, 'حذف');
        del.addEventListener('click', async () => {
          if (!confirm('تحذف هذه الهدية؟ الطلبات القديمة اللي بيها الهدية تبقى مثل ما هي.')) return;
          const { error } = await db.from('gift_offers').delete().eq('id', g.id);
          if (error) { toast(friendlyError(error), true); return; }
          toast('انحذفت الهدية');
          loadGifts();
        });
        return el('div', { class: 'inf-card' },
          el('div', { style: 'display:flex;gap:12px;align-items:center' },
            img ? el('img', { src: img, alt: '', style: 'width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none' }) : null,
            el('div', { style: 'flex:1;min-width:0' },
              el('div', { style: 'font-weight:800', text: (g.title ? g.title + ' · ' : '') + (p.name || ('منتج #' + g.product_id)) }),
              el('div', { class: cls === 'error' ? 'error' : 'muted', style: 'font-size:13px', text: state }),
              el('div', { class: 'muted', style: 'font-size:13px', text:
                `المخزون: ${p.stock ?? '?'} · أقل طلب: ${Number(g.min_order) > 0 ? money(g.min_order) + ' د.ع' : 'أي طلب'} · ${g.once_per_phone ? 'مرة وحدة لكل رقم' : 'بكل طلب'}` }),
              el('div', { class: 'muted', style: 'font-size:13px', text:
                `من: ${g.starts_at ? new Date(g.starts_at).toLocaleString('en-GB') : 'هسه'} · إلى: ${g.ends_at ? new Date(g.ends_at).toLocaleString('en-GB') : 'بدون نهاية'} · انطت: ${g.given} مرة` }),
            ),
          ),
          el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderGiftEditor(g); window.scrollTo(0, 0); } }, 'تعديل'),
            toggle, del),
        );
      }),
    );
  }

  function renderGiftEditor(g) {
    const box = $('gift-editor');
    const search = el('input', { class: 'field', placeholder: 'ابحث باسم المنتج أو رقمه...' });
    const pick = el('select', { class: 'field' });
    const fill = () => {
      const q = search.value.trim();
      const rows = adm.products
        .filter((p) => (Number(p.stock) > 0 || (g && p.id === g.product_id)) && (!q || String(p.id) === q.replace('#', '') || (p.name || '').includes(q)))
        .slice(0, 200);
      pick.replaceChildren(
        el('option', { value: '', text: rows.length ? '— اختاروا المنتج —' : 'ماكو نتائج' }),
        ...rows.map((p) => el('option', { value: p.id, text: `#${p.id} · ${p.name} · مخزون ${p.stock}` })),
      );
      if (g) pick.value = String(g.product_id);
    };
    search.addEventListener('input', fill);
    fill();
    const title = el('input', { class: 'field', maxlength: 40, placeholder: 'اختياري، مثال: هدية الافتتاح', value: g ? g.title || '' : '' });
    const minOrder = el('input', { class: 'field', type: 'number', min: 0, step: 1000, value: g ? Number(g.min_order) : 0 });
    const starts = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(g && g.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(g && g.ends_at) });
    const once = el('input', { type: 'checkbox' });
    once.checked = g ? g.once_per_phone : true;
    const active = el('input', { type: 'checkbox' });
    active.checked = g ? g.is_active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, g ? 'حفظ التعديل' : 'إضافة الهدية');

    save.addEventListener('click', async () => {
      err.textContent = '';
      const productId = Number(pick.value);
      if (!productId) { err.textContent = 'اختاروا المنتج اللي يصير هدية'; return; }
      if (starts.value && ends.value && new Date(ends.value) <= new Date(starts.value)) { err.textContent = 'النهاية لازم بعد البداية'; return; }
      const row = {
        product_id: productId,
        title: title.value.trim() || null,
        min_order: Math.max(0, Math.round(Number(minOrder.value) || 0)),
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
        once_per_phone: once.checked,
        is_active: active.checked,
      };
      save.disabled = true;
      const { error } = g
        ? await db.from('gift_offers').update(row).eq('id', g.id)
        : await db.from('gift_offers').insert(row);
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(g ? 'انحفظ التعديل ✅' : 'انضافت الهدية ✅');
      renderGiftEditor(null);
      loadGifts();
    });

    box.replaceChildren(
      el('h3', { text: g ? 'تعديل الهدية' : 'هدية جديدة 🎁', style: 'margin:0' }),
      el('div', { class: 'help', text: 'الهدية تطلع للزبون بصفحة إتمام الطلب (بالنسخة الجديدة من التطبيق)، ويختار وحدة ويه طلبه. تنضاف للطلب بسعر 0 وتنخصم من مخزون المنتج، وإذا انلغى الطلب ترجع. بتيليگرام والصفحة تبين بالطلب كـ "هدية مجانية 🎁".' }),
      el('div', { class: 'form-grid' },
        el('div', { class: 'full' }, el('label', { class: 'lbl', text: 'المنتج' }), search, pick),
        el('div', null, el('label', { class: 'lbl', text: 'عنوان الهدية (اختياري)' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'أقل مبلغ للطلب (د.ع)' }), minOrder,
          el('div', { class: 'help', text: '0 = ويه أي طلب.' })),
        el('div', null, el('label', { class: 'lbl', text: 'تبدي (اختياري)' }), starts),
        el('div', null, el('label', { class: 'lbl', text: 'تنتهي (اختياري)' }), ends),
        el('label', { class: 'check full' }, once, 'مرة وحدة لكل رقم تلفون (ينصح بيها حتى ما أحد يكرر الطلبات على الهدية)'),
        el('label', { class: 'check full' }, active, 'فعّالة'),
      ),
      err,
      el('div', { style: 'display:flex;gap:8px' },
        save,
        g ? el('button', { class: 'btn', type: 'button', onclick: () => renderGiftEditor(null) }, 'إلغاء') : null,
      ),
    );
  }

  // ================= العروض (على مجموعة منتجات) =================
  // باقة: أي N قطع من منتجات العرض بسعر ثابت (والتوصيل مجاني إذا مأشّر)، تنجمع من موديلات وألوان مختلفة.
  // توصيل مجاني: الأسعار عادية، بس إذا مجموع قطع منتجات العرض وصل N، التوصيل مجاني.
  // المنتج يدخل بعرض واحد بس. الحساب كله بالسيرفر (private.cart_price)، والعرض يلغي عروض الكمية الخاصة بالمنتج.
  const offerPieces = (n) => (n === 2 ? 'قطعتين' : n <= 10 ? n + ' قطع' : n + ' قطعة');
  const productsCount = (n) => (n === 1 ? 'منتج واحد' : n === 2 ? 'منتجين' : n <= 10 ? n + ' منتجات' : n + ' منتج');
  const offerRule = (o) => o.kind === 'bundle'
    ? `أي ${offerPieces(o.qty)} بـ ${money(o.price)} د.ع${o.free_delivery ? ' + توصيل مجاني' : ''}`
    : `${offerPieces(o.qty)} من العرض = توصيل مجاني`;

  async function openOffers() {
    loadPiecesSetting();
    if (!adm.productsLoaded) await loadProducts();
    if (!$('offer-editor').childElementCount) renderOfferEditor(null);
    loadOffers();
  }

  // توصيل مجاني للطلب كله إذا مجموع القطع وصل العدد (store_settings، يتحسب بالسيرفر بـ private.cart_price)
  async function loadPiecesSetting() {
    const box = $('offer-settings');
    if (!box.childElementCount) box.replaceChildren(el('div', { class: 'muted', text: 'جاري التحميل...' }));
    const { data, error } = await db.from('store_settings').select('free_delivery_pieces_on, free_delivery_min_pieces').eq('id', 1).maybeSingle();
    if (error) { box.replaceChildren(el('div', { class: 'error', text: friendlyError(error) })); return; }
    const s = data || { free_delivery_pieces_on: false, free_delivery_min_pieces: 4 };
    const on = el('input', { type: 'checkbox' });
    on.checked = !!s.free_delivery_pieces_on;
    const min = el('input', { class: 'field', type: 'number', min: 2, max: 100, step: 1, value: s.free_delivery_min_pieces, style: 'max-width:110px' });
    const status = el('div', { style: 'font-weight:800' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'حفظ');
    const paint = () => {
      const n = Math.round(Number(min.value) || 0);
      status.textContent = s.free_delivery_pieces_on
        ? `شغّال هسه ✅ التوصيل مجاني لأي طلب من ${offerPieces(s.free_delivery_min_pieces)} وفوگ`
        : 'مطفي هسه، التوصيل يندفع حسب المحافظة';
      status.style.color = s.free_delivery_pieces_on ? '#1b7f3b' : 'var(--muted)';
      save.disabled = on.checked === !!s.free_delivery_pieces_on && n === Number(s.free_delivery_min_pieces);
    };
    [on, min].forEach((x) => x.addEventListener('input', paint));
    on.addEventListener('change', paint);
    save.addEventListener('click', async () => {
      err.textContent = '';
      const n = Math.round(Number(min.value) || 0);
      if (n < 2 || n > 100) { err.textContent = 'العدد من 2 إلى 100'; return; }
      save.disabled = true;
      const { error: e } = await db.from('store_settings')
        .update({ free_delivery_pieces_on: on.checked, free_delivery_min_pieces: n, updated_at: new Date().toISOString() })
        .eq('id', 1);
      if (e) { err.textContent = friendlyError(e); save.disabled = false; return; }
      toast(on.checked ? `التوصيل صار مجاني من ${offerPieces(n)} ✅` : 'انطفى التوصيل المجاني حسب العدد');
      loadPiecesSetting();
    });
    box.replaceChildren(
      el('h3', { text: '🚚 توصيل مجاني حسب عدد القطع', style: 'margin:0' }),
      el('div', { class: 'help', text: 'إذا مجموع القطع بالطلب (من أي منتجات) وصل العدد، التوصيل يصير مجاني على الطلب كله. الأسعار ما تتغير، والهدية المجانية ما تنحسب ويه القطع. التطبيق يبينه للزبون من نسخة 2.0.3؛ النسخ القديمة ما تبينه بس السيرفر يطبقه (يعني الزبون يدفع أقل من اللي شافه).' }),
      status,
      el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
        el('label', { class: 'check' }, on, 'شغّال'),
        el('span', { text: 'من' }), min, el('span', { text: 'قطع وفوگ' }),
        save),
      err,
    );
    paint();
  }

  // عرض ثاني شغّال (أو راح يبدي) بنفس القيم: الزبون ما يگدر يجمع بين عرضين منفصلين، فننبه
  function offerTwin(row, exceptId) {
    const now = Date.now();
    return (adm.offers || []).find((x) => x.id !== exceptId && x.is_active
      && !(x.ends_at && new Date(x.ends_at).getTime() <= now)
      && x.kind === row.kind && Number(x.qty) === Number(row.qty)
      && (row.kind !== 'bundle' || (Number(x.price) === Number(row.price) && !!x.free_delivery === !!row.free_delivery)));
  }

  async function loadOffers() {
    $('offer-list').replaceChildren(el('div', { class: 'empty', text: 'جاري التحميل...' }));
    const [offers, links] = await Promise.all([
      db.from('offers').select('*').order('id', { ascending: false }),
      db.from('offer_products').select('offer_id, product_id').limit(5000),
    ]);
    const error = offers.error || links.error;
    if (error) { $('offer-list').replaceChildren(el('div', { class: 'empty error', text: friendlyError(error) })); return; }
    const byOffer = new Map();
    (links.data || []).forEach((r) => {
      if (!byOffer.has(r.offer_id)) byOffer.set(r.offer_id, []);
      byOffer.get(r.offer_id).push(r.product_id);
    });
    adm.offers = (offers.data || []).map((o) => ({ ...o, products: byOffer.get(o.id) || [] }));
    renderOffers();
  }

  function offerState(o) {
    const now = Date.now();
    if (!o.is_active) return ['متوقف', 'muted'];
    if (o.starts_at && new Date(o.starts_at).getTime() > now) return ['يبدي ' + new Date(o.starts_at).toLocaleString('en-GB'), 'muted'];
    if (o.ends_at && new Date(o.ends_at).getTime() <= now) return ['خلص', 'muted'];
    const inStock = o.products.filter((id) => Number((adm.products.find((p) => p.id === id) || {}).stock) > 0).length;
    if (!inStock) return ['كل منتجاته نافدة', 'error'];
    return ['شغّال هسه ✅', 'ok'];
  }

  function renderOffers() {
    const list = adm.offers || [];
    if (!list.length) {
      $('offer-list').replaceChildren(el('div', { class: 'empty', text: 'ماكو عروض لحد هسه. سووا عرض من فوگ.' }));
      return;
    }
    $('offer-list').replaceChildren(
      el('h3', { text: 'العروض', style: 'margin:6px 0 10px' }),
      ...list.map((o) => {
        const [state, cls] = offerState(o);
        const prods = o.products.map((id) => adm.products.find((p) => p.id === id) || { id });
        const inStock = prods.filter((p) => Number(p.stock) > 0).length;
        const toggle = el('button', { class: 'btn btn-sm', type: 'button' }, o.is_active ? 'إيقاف' : 'تفعيل');
        toggle.addEventListener('click', async () => {
          toggle.disabled = true;
          const { error } = await db.from('offers').update({ is_active: !o.is_active }).eq('id', o.id);
          if (error) { toast(friendlyError(error), true); toggle.disabled = false; return; }
          loadOffers();
        });
        const del = el('button', { class: 'btn btn-sm', type: 'button', style: 'color:var(--danger, #c62828)' }, 'حذف');
        del.addEventListener('click', async () => {
          if (!confirm(`تحذف العرض "${o.title}"؟ المنتجات ترجع لأسعارها وعروضها العادية. الطلبات القديمة تبقى مثل ما هي.`)) return;
          const { error } = await db.from('offers').delete().eq('id', o.id);
          if (error) { toast(friendlyError(error), true); return; }
          toast('انحذف العرض');
          if (adm.offerEditing === o.id) renderOfferEditor(null);
          loadOffers();
        });
        return el('div', { class: 'inf-card' },
          el('div', null,
            el('div', { style: 'font-weight:800', text: o.title }),
            el('div', { style: 'font-size:14px;font-weight:700;color:#1b7f3b', text: offerRule(o) }),
            el('div', { class: cls === 'error' ? 'error' : 'muted', style: 'font-size:13px', text: state }),
            el('div', { class: 'muted', style: 'font-size:13px', text:
              `المنتجات: ${prods.length} (المتوفر ${inStock}) · من: ${o.starts_at ? new Date(o.starts_at).toLocaleString('en-GB') : 'هسه'} · إلى: ${o.ends_at ? new Date(o.ends_at).toLocaleString('en-GB') : 'بدون نهاية'}` }),
          ),
          el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
            ...prods.slice(0, 12).map((p) => {
              const img = Array.isArray(p.image_url) ? p.image_url[0] : null;
              return img
                ? el('img', { src: img, alt: p.name || '', title: `#${p.id} ${p.name || ''}`, style: `width:44px;height:44px;object-fit:cover;border-radius:10px;${Number(p.stock) > 0 ? '' : 'opacity:.35'}` })
                : el('span', { class: 'muted', style: 'font-size:12px', text: '#' + p.id });
            }),
            prods.length > 12 ? el('span', { class: 'muted', style: 'align-self:center;font-size:13px', text: '+' + (prods.length - 12) }) : null,
          ),
          el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
            el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { renderOfferEditor(o); window.scrollTo(0, 0); } }, 'تعديل'),
            toggle, del),
        );
      }),
    );
  }

  function renderOfferEditor(o) {
    adm.offerEditing = o ? o.id : null;
    const box = $('offer-editor');
    const selected = new Set(o ? o.products : []);
    // المنتج بعرض واحد بس: نعرف وين موجود حتى ما يتكرر
    const offerOfProduct = new Map();
    (adm.offers || []).forEach((x) => { if (!o || x.id !== o.id) x.products.forEach((id) => offerOfProduct.set(id, x)); });

    const title = el('input', { class: 'field', maxlength: 60, placeholder: 'مثال: عرض الشتاء ❄️', value: o ? o.title : '' });
    const kind = el('select', { class: 'field' },
      el('option', { value: 'bundle', text: 'باقة بسعر ثابت (أي N قطع بمبلغ)' }),
      el('option', { value: 'free_delivery', text: 'توصيل مجاني بس (الأسعار عادية)' }),
    );
    kind.value = o ? o.kind : 'bundle';
    const qty = el('input', { class: 'field', type: 'number', min: 2, max: 50, step: 1, value: o ? o.qty : 3 });
    const price = el('input', { class: 'field', type: 'number', min: 0, step: 250, value: o && o.price != null ? Number(o.price) : '' });
    const fd = el('input', { type: 'checkbox' });
    fd.checked = o ? o.free_delivery : true;
    const starts = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(o && o.starts_at) });
    const ends = el('input', { class: 'field', type: 'datetime-local', value: giftLocal(o && o.ends_at) });
    const active = el('input', { type: 'checkbox' });
    active.checked = o ? o.is_active : true;
    const err = el('div', { class: 'error', role: 'alert' });
    const warn = el('div', { class: 'help', style: 'color:#b26a00;font-weight:700' });
    const twinBox = el('div', { style: 'display:none;background:#e8f1fd;border:1px solid #b6d0f5;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:#1a4f8f' });
    const preview = el('div', { style: 'font-weight:800;color:#1b7f3b' });
    const rowNow = () => {
      const bundle = kind.value === 'bundle';
      return { kind: kind.value, qty: Math.round(Number(qty.value) || 0), price: bundle ? Math.round(Number(price.value) || 0) : null, free_delivery: bundle ? fd.checked : true };
    };
    // يضيف المنتجات المختارة للعرض اللي بنفس القيم بدل عرض جديد
    const mergeInto = async (twin) => {
      const add = [...selected].filter((id) => !twin.products.includes(id));
      if (add.length) {
        const { error } = await db.from('offer_products').insert(add.map((pid) => ({ offer_id: twin.id, product_id: pid })));
        if (error) { err.textContent = error.code === '23505' ? 'منتج من المختارة صار بعرض ثاني، حدّثوا الصفحة وجرّبوا مرة ثانية' : friendlyError(error); return; }
      }
      toast(add.length ? `انضاف ${productsCount(add.length)} لعرض "${twin.title}" ✅` : `المنتجات موجودة أصلاً بعرض "${twin.title}"`);
      renderOfferEditor(null);
      loadOffers();
    };
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, o ? 'حفظ التعديل' : 'إضافة العرض');

    const priceBox = el('div', null, el('label', { class: 'lbl', text: 'سعر الباقة (د.ع)' }), price);
    const fdBox = el('label', { class: 'check full' }, fd, 'التوصيل مجاني ويه الباقة');

    const chips = el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' });
    const search = el('input', { class: 'field', placeholder: 'ابحث باسم المنتج أو رقمه وضيفه للعرض...' });
    const results = el('div', { style: 'display:grid;gap:4px;max-height:260px;overflow:auto' });

    const refresh = () => {
      const bundle = kind.value === 'bundle';
      priceBox.style.display = bundle ? '' : 'none';
      fdBox.style.display = bundle ? '' : 'none';
      const n = Math.round(Number(qty.value) || 0);
      const pz = Number(price.value) || 0;
      preview.textContent = n >= 2 ? 'الزبون يشوف: ' + offerRule({ kind: kind.value, qty: n, price: pz, free_delivery: bundle ? fd.checked : true }) : '';
      // عرض جديد بنفس قيم عرض موجود: ننبه ونقترح نضيف المنتجات له
      const twin = !o && n >= 2 && (!bundle || pz > 0) ? offerTwin(rowNow(), null) : null;
      twinBox.style.display = twin ? '' : 'none';
      if (twin) {
        twinBox.replaceChildren(
          el('div', { text: `ℹ️ اكو عرض بنفس القيم: "${twin.title}" (${productsCount(twin.products.length)}). إذا تسوون عرض جديد، الزبون ما يگدر يجمع قطع من العرضين سوى. حتى يتجمعن، ضيفوا المنتجات لذاك العرض.` }),
          selected.size
            ? el('button', { class: 'btn btn-sm', type: 'button', style: 'margin-top:6px', onclick: () => mergeInto(twin) }, `ضيف المنتجات المختارة لـ "${twin.title}"`)
            : null,
        );
      }
      // تنبيه: إذا سعر القطعة بالباقة أغلى من سعر منتج عادي، الزبون يدفع أكثر
      warn.textContent = '';
      if (bundle && n >= 2 && pz > 0 && selected.size) {
        const per = pz / n;
        const dearer = [...selected].map((id) => adm.products.find((p) => p.id === id)).filter((p) => p && Number(p.price) < per);
        if (dearer.length) warn.textContent = `⚠️ سعر القطعة بالباقة (${money(per)}) أغلى من السعر العادي لـ: ${dearer.slice(0, 5).map((p) => p.name).join('، ')}${dearer.length > 5 ? '…' : ''}. الزبون راح يدفع أكثر بهذي المنتجات.`;
      }
      chips.replaceChildren(
        ...(selected.size ? [] : [el('span', { class: 'muted', style: 'font-size:13px', text: 'ما اخترتوا منتجات بعد.' })]),
        ...[...selected].map((id) => {
          const p = adm.products.find((x) => x.id === id) || { id, name: 'منتج #' + id };
          return el('span', { style: 'display:inline-flex;align-items:center;gap:6px;background:#eaf7ee;border:1px solid #b9e2c5;border-radius:20px;padding:4px 6px 4px 10px;font-size:13px' },
            `#${p.id} ${p.name}${Number(p.stock) > 0 ? '' : ' (نافد)'} · ${money(p.price)}`,
            el('button', { type: 'button', class: 'btn btn-sm', style: 'min-height:24px;padding:0 8px', 'aria-label': 'شيل', onclick: () => { selected.delete(id); refresh(); } }, '✕'),
          );
        }),
      );
      const q = search.value.trim();
      if (!q) { results.replaceChildren(); return; }
      const rows = adm.products
        .filter((p) => String(p.id) === q.replace('#', '') || (p.name || '').includes(q))
        .slice(0, 40);
      results.replaceChildren(
        ...(rows.length ? [] : [el('div', { class: 'muted', text: 'ماكو نتائج' })]),
        ...rows.map((p) => {
          const other = offerOfProduct.get(p.id);
          const added = selected.has(p.id);
          const btn = el('button', { class: 'btn btn-sm', type: 'button', disabled: added || !!other ? '' : null }, added ? 'مضاف ✓' : other ? 'بعرض ثاني' : '+ إضافة');
          btn.addEventListener('click', () => { selected.add(p.id); refresh(); });
          return el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0' },
            el('span', { style: 'font-size:13px', text: `#${p.id} · ${p.name} · ${money(p.price)} د.ع · مخزون ${p.stock}${other ? ` · (بعرض "${other.title}")` : ''}` }),
            btn);
        }),
      );
    };
    [kind, qty, price, fd].forEach((x) => x.addEventListener('input', refresh));
    kind.addEventListener('change', refresh);
    search.addEventListener('input', refresh);

    save.addEventListener('click', async () => {
      err.textContent = '';
      const bundle = kind.value === 'bundle';
      const n = Math.round(Number(qty.value) || 0);
      const pz = Math.round(Number(price.value) || 0);
      if (title.value.trim().length < 2) { err.textContent = 'اكتبوا عنوان العرض'; return; }
      if (n < 2 || n > 50) { err.textContent = 'عدد القطع من 2 إلى 50'; return; }
      if (bundle && pz <= 0) { err.textContent = 'اكتبوا سعر الباقة'; return; }
      if (!selected.size) { err.textContent = 'ضيفوا منتج واحد على الأقل للعرض'; return; }
      if (starts.value && ends.value && new Date(ends.value) <= new Date(starts.value)) { err.textContent = 'النهاية لازم بعد البداية'; return; }
      if (!o) {
        const twin = offerTwin(rowNow(), null);
        if (twin && confirm(`اكو عرض بنفس القيم: "${twin.title}".\nإذا تسوون عرض جديد منفصل، الزبون ما يگدر يجمع قطع من العرضين سوى.\n\nموافق = نضيف المنتجات المختارة لعرض "${twin.title}"\nإلغاء = نسوي عرض جديد منفصل`)) {
          await mergeInto(twin);
          return;
        }
      }
      if (warn.textContent && !confirm(warn.textContent + '\n\nتكمل وتحفظ؟')) return;
      const row = {
        title: title.value.trim(),
        kind: kind.value,
        qty: n,
        price: bundle ? pz : null,
        free_delivery: bundle ? fd.checked : true,
        starts_at: starts.value ? new Date(starts.value).toISOString() : null,
        ends_at: ends.value ? new Date(ends.value).toISOString() : null,
        is_active: active.checked,
      };
      save.disabled = true;
      try {
        let id = o && o.id;
        if (id) {
          const { error } = await db.from('offers').update(row).eq('id', id);
          if (error) throw error;
        } else {
          const { data, error } = await db.from('offers').insert(row).select('id').single();
          if (error) throw error;
          id = data.id;
        }
        const before = new Set(o ? o.products : []);
        const removed = [...before].filter((x) => !selected.has(x));
        const added = [...selected].filter((x) => !before.has(x));
        if (removed.length) {
          const { error } = await db.from('offer_products').delete().eq('offer_id', id).in('product_id', removed);
          if (error) throw error;
        }
        if (added.length) {
          const { error } = await db.from('offer_products').insert(added.map((pid) => ({ offer_id: id, product_id: pid })));
          if (error) throw error;
        }
        toast(o ? 'انحفظ العرض ✅' : 'انضاف العرض ✅');
        renderOfferEditor(null);
        loadOffers();
      } catch (e) {
        err.textContent = e && e.code === '23505' ? 'منتج من المختارة صار بعرض ثاني، حدّثوا الصفحة وجرّبوا مرة ثانية' : friendlyError(e);
      } finally {
        save.disabled = false;
      }
    });

    box.replaceChildren(
      el('h3', { text: o ? 'تعديل العرض' : 'عرض جديد 🏷️', style: 'margin:0' }),

      el('div', { class: 'help', style: 'color:#b26a00;font-weight:700', text: '⚠️ العروض تطلع بالتطبيق من نسخة 2.0.3 وفوگ. السيرفر يحسبها لكل الطلبات، فلا تشغّلون عرض قبل ما تنزل 2.0.3 بالمتجرين، حتى الزبون بالنسخة القديمة ما يشوف سعر ويندفع غيره.' }),
      el('div', { class: 'form-grid' },

  // ================= واجهة التطبيق =================
  // store_settings (صف واحد): الرئيسية الافتراضية (القسم والترتيب) والتحديث الإجباري. التطبيق يقراها من نسخة 2.0.5.
  const HOME_SORTS = [
    ['bestSelling', 'الأكثر مبيعاً'],
    ['newest', 'الأحدث'],
    ['cheapest', 'الأرخص'],
    ['bulkOffers', 'عروض الكمية'],
  ];

  async function openAppUi() {
    renderStaffCard();
    $('appui-home').replaceChildren(el('div', { class: 'muted', text: 'جاري التحميل...' }));
    $('appui-row').replaceChildren();
    $('appui-update').replaceChildren();
    if (!adm.categories.length) await loadCategories();
    // صف المنتجات يحتاج قائمة المنتجات (البحث والصور والمخزون)
    if (!adm.productsLoaded) await loadProducts();
    const { data, error } = await db.from('store_settings').select('*').eq('id', 1).maybeSingle();
    if (error) { $('appui-home').replaceChildren(el('div', { class: 'error', text: friendlyError(error) })); return; }
    const s = data || {};
    renderAppUiHome(s);
    renderAppUiRow(s);

  // صف منتجات بالعرض بالرئيسية بدل البانر (store_settings.home_row_*). التطبيق يقراه من نسخة 2.0.7.
  const ROW_MAX_PICKED = 30;
  function renderAppUiRow(s) {
    if (!('home_row_on' in s)) {
      $('appui-row').replaceChildren(
        el('h3', { text: '🛍️ صف المنتجات بالرئيسية (بدل البانر)', style: 'margin:0' }),
        el('div', { class: 'help', text: 'بعده ما مفعّل بقاعدة البيانات.' }),
      );
      return;
    }
    const on = el('input', { type: 'checkbox' });
    on.checked = s.home_row_on === true;
    const title = el('input', { class: 'field', maxlength: 40, placeholder: 'مثال: 👗 ملابس', value: s.home_row_title || '' });
    const subtitle = el('input', { class: 'field', maxlength: 60, placeholder: 'مثال: وصلت جديد (اختياري)', value: s.home_row_subtitle || '' });
    const srcCat = el('input', { type: 'radio', name: 'row-src', value: 'category' });
    const srcProd = el('input', { type: 'radio', name: 'row-src', value: 'products' });
    (s.home_row_source === 'products' ? srcProd : srcCat).checked = true;
    const catOptions = () => adm.categories.map((c) => el('option', { value: c.id, text: c.name }));
    const cat = el('select', { class: 'field' }, el('option', { value: '', text: 'اختاروا القسم...' }), ...catOptions());
    cat.value = s.home_row_category_id ? String(s.home_row_category_id) : '';
    const limit = el('input', { class: 'field', type: 'number', min: 3, max: 20, step: 1, value: s.home_row_limit ?? 10 });
    const allCat = el('select', { class: 'field' }, el('option', { value: '', text: 'نفس منتجات الصف' }), ...catOptions());
    allCat.value = s.home_row_all_category_id ? String(s.home_row_all_category_id) : '';
    const picked = (Array.isArray(s.home_row_product_ids) ? s.home_row_product_ids : []).map(Number).filter(Boolean);

    const catBox = el('div');
    const prodBox = el('div', { style: 'display:grid;gap:8px' });
    const pickedList = el('div', { style: 'display:grid;gap:6px' });
    const search = el('input', { class: 'field', type: 'search', placeholder: 'ابحثوا باسم المنتج أو رقمه وضيفوه للصف...' });
    const results = el('div', { style: 'display:grid;gap:4px;max-height:260px;overflow:auto' });
    const preview = el('div', { class: 'help', style: 'font-weight:700;color:#1E7B3A' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, 'حفظ');

    const product = (id) => adm.products.find((p) => p.id === id);
    const thumb = (p) => {
      const src = p && Array.isArray(p.image_url) ? p.image_url[0] : null;
      return src
        ? el('img', { src, alt: '', loading: 'lazy', style: 'width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none' })
        : el('span', { style: 'width:38px;height:38px;border-radius:8px;background:#f0ece8;flex:none' });
    };
    const move = (i, d) => {
      const j = i + d;
      if (j < 0 || j >= picked.length) return;
      [picked[i], picked[j]] = [picked[j], picked[i]];
      refresh();
    };

    const refresh = () => {
      err.textContent = '';
      const isProd = srcProd.checked;
      catBox.style.display = isProd ? 'none' : '';
      prodBox.style.display = isProd ? '' : 'none';
      const n = Math.max(3, Math.min(20, Math.round(Number(limit.value) || 10)));
      // كم منتج يشوف الزبون هسه (المتوفر بس)
      let shown;
      if (isProd) {
        shown = picked.filter((id) => Number((product(id) || {}).stock) > 0).length;
      } else {
        shown = cat.value ? adm.products.filter((p) => String(p.category_id) === cat.value && Number(p.stock) > 0).length : 0;
      }
      shown = Math.min(shown, n);
      preview.textContent = !on.checked
        ? 'مطفي: الزبون يشوف البانر مثل قبل.'
        : shown
          ? `الزبون يشوف بالصف: ${shown} ${shown === 1 ? 'منتج' : 'منتجات'}${isProd ? ' (بالترتيب الي فوك)' : ' (الأحدث أولاً)'}.`
          : '⚠️ ماكو منتجات متوفرة بالصف، فالتطبيق راح يطلع البانر بداله.';
      preview.style.color = on.checked && !shown ? '#b26a00' : '#1E7B3A';

      pickedList.replaceChildren(
        ...(picked.length ? [] : [el('div', { class: 'muted', style: 'font-size:13px', text: 'ما اخترتوا منتجات بعد.' })]),
        ...picked.map((id, i) => {
          const p = product(id) || { id, name: 'منتج #' + id, stock: 0 };
          const out = !(Number(p.stock) > 0);
          return el('div', { style: `display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 8px;${out ? 'opacity:.55' : ''}` },
            el('span', { class: 'num', style: 'color:#999;min-width:18px', text: i + 1 }),
            thumb(p),
            el('span', { style: 'flex:1;font-size:13px;font-weight:600', text: `${p.name}${out ? ' (نافد، ما يطلع)' : ''} · ${money(p.price)}` }),
            el('button', { class: 'btn btn-sm', type: 'button', 'aria-label': 'لفوك', disabled: i === 0 ? '' : null, onclick: () => move(i, -1) }, '▲'),
            el('button', { class: 'btn btn-sm', type: 'button', 'aria-label': 'لجوه', disabled: i === picked.length - 1 ? '' : null, onclick: () => move(i, 1) }, '▼'),
            el('button', { class: 'btn btn-sm', type: 'button', 'aria-label': 'شيل', onclick: () => { picked.splice(i, 1); refresh(); } }, '✕'),
          );
        }),
      );

      const q = search.value.trim();
      if (!q) { results.replaceChildren(); return; }
      const rows = adm.products
        .filter((p) => String(p.id) === q.replace('#', '') || (p.name || '').includes(q))
        .slice(0, 40);
      results.replaceChildren(
        ...(rows.length ? [] : [el('div', { class: 'muted', text: 'ماكو نتائج' })]),
        ...rows.map((p) => {
          const added = picked.includes(p.id);
          const full = picked.length >= ROW_MAX_PICKED;
          const btn = el('button', { class: 'btn btn-sm', type: 'button', disabled: added || full ? '' : null },
            added ? 'مضاف ✓' : full ? `الحد ${ROW_MAX_PICKED}` : '+ إضافة');
          btn.addEventListener('click', () => { picked.push(p.id); refresh(); });
          return el('div', { style: 'display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0' },
            thumb(p),
            el('span', { style: 'flex:1;font-size:13px', text: `#${p.id} · ${p.name} · ${money(p.price)} د.ع · مخزون ${p.stock}` }),
            btn);
        }),
      );
    };
    [on, srcCat, srcProd, cat].forEach((x) => x.addEventListener('change', refresh));
    limit.addEventListener('input', refresh);
    search.addEventListener('input', refresh);

    save.addEventListener('click', async () => {
      err.textContent = '';
      const isProd = srcProd.checked;
      const n = Math.round(Number(limit.value));
      if (on.checked && title.value.trim().length < 2) { err.textContent = 'اكتبوا عنوان الصف (مثلاً: 👗 ملابس)'; return; }
      if (on.checked && !isProd && !cat.value) { err.textContent = 'اختاروا القسم'; return; }
      if (on.checked && isProd && !picked.length) { err.textContent = 'ضيفوا منتج واحد على الأقل'; return; }
      if (!Number.isInteger(n) || n < 3 || n > 20) { err.textContent = 'أكثر عدد بالصف من 3 إلى 20'; return; }
      const row = {
        home_row_on: on.checked,
        home_row_title: title.value.trim() || null,
        home_row_subtitle: subtitle.value.trim() || null,
        home_row_source: isProd ? 'products' : 'category',
        home_row_category_id: cat.value ? Number(cat.value) : null,
        home_row_product_ids: picked,
        home_row_limit: n,
        home_row_all_category_id: allCat.value ? Number(allCat.value) : null,
        updated_at: new Date().toISOString(),
      };
      save.disabled = true;
      const { error } = await db.from('store_settings').update(row).eq('id', 1);
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(row.home_row_on ? 'انحفظ ✅ الصف يطلع بالرئيسية بدل البانر' : 'انحفظ ✅ الصف مطفي، والبانر يرجع');
    });

    catBox.append(el('label', { class: 'lbl', text: 'القسم (تطلع أحدث منتجاته المتوفرة تلقائياً)' }), cat);
    prodBox.append(
      el('label', { class: 'lbl', text: `المنتجات بالترتيب (لحد ${ROW_MAX_PICKED})، والنافد يختفي من الصف وحده` }),
      pickedList, search, results,
    );
    $('appui-row').replaceChildren(
      el('h3', { text: '🛍️ صف المنتجات بالرئيسية (بدل البانر)', style: 'margin:0' }),
      el('div', { class: 'help', text: 'صف منتجات يتصفحه الزبون بالعرض، بمكان البانر. إذا طفيتوه أو ماكو منتجات متوفرة بيه، البانر يرجع. يشتغل من نسخة 2.0.7 وفوگ؛ النسخ الأقدم تبقى تشوف البانر.' }),
      el('label', { class: 'check' }, on, 'تشغيل الصف بدل البانر'),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'العنوان' }), title),
        el('div', null, el('label', { class: 'lbl', text: 'سطر صغير يمّ العنوان (اختياري)' }), subtitle),
      ),
      el('div', { style: 'display:flex;gap:16px;flex-wrap:wrap;margin-top:4px' },
        el('label', { class: 'check' }, srcCat, 'من قسم'),
        el('label', { class: 'check' }, srcProd, 'منتجات أختارها بنفسي'),
      ),
      catBox,
      prodBox,
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'أكثر عدد بالصف (3 إلى 20)' }), limit),
        el('div', null, el('label', { class: 'lbl', text: 'زر «عرض الكل» يفتح' }), allCat),
      ),
      preview,
      err,
      el('div', null, save),
    );
    refresh();
  }

  function renderAppUiUpdate(s) {
    const on = el('input', { type: 'checkbox' });
    on.checked = s.force_update_on === true;
    const minA = el('input', { class: 'field', type: 'number', min: 1, step: 1, dir: 'ltr', placeholder: 'فارغ', value: s.min_build_android ?? '' });
    const minI = el('input', { class: 'field', type: 'number', min: 1, step: 1, dir: 'ltr', placeholder: 'فارغ', value: s.min_build_ios ?? '' });
    const err = el('div', { class: 'error', role: 'alert' });
    const save = el('button', { class: 'btn btn-primary', type: 'button' }, 'حفظ');
    const readMin = (input, label) => {
      if (input.value === '') return null;
      const n = Number(input.value);
      if (!Number.isInteger(n) || n < 1) throw new Error(`رقم البناء لـ ${label} لازم رقم صحيح، أو اتركه فارغ`);
      return n;
    };
    save.addEventListener('click', async () => {
      err.textContent = '';
      let row;
      try {
        row = { force_update_on: on.checked, min_build_android: readMin(minA, 'أندرويد'), min_build_ios: readMin(minI, 'آيفون'), updated_at: new Date().toISOString() };
      } catch (e) { err.textContent = e.message; return; }
      if ((row.min_build_android || row.min_build_ios)
        && !confirm('تأكدتوا إن رقم البناء هذا نازل بالمتجر وموافق عليه؟\nإذا كتبتوا رقم أعلى من اللي بالمتجر، الزبائن ينحبسون بشاشة التحديث وما يلگون تحديث.')) return;
      save.disabled = true;
      const { error } = await db.from('store_settings').update(row).eq('id', 1);
      save.disabled = false;
      if (error) { err.textContent = friendlyError(error); return; }
      toast(row.force_update_on ? 'انحفظ ✅ الزبائن ينجبرون على آخر نسخة' : 'انحفظ ✅ التحديث الإجباري مطفي');
    });
    $('appui-update').replaceChildren(
      el('h3', { text: '⬆️ التحديث الإجباري', style: 'margin:0' }),
      el('div', { class: 'help', text: 'إذا شغّال: كل ما تنزل نسخة جديدة بالمتجر، الزبون اللي عنده نسخة أقدم تطلعله شاشة "حدّثوا الآن" ما تتسكر لحد ما يحدّث. أندرويد يحدّث من داخل التطبيق (Google Play)، وآيفون يوديه للـ App Store. يشتغل على النسخ اللي بيها هالميزة (2.0.5 وفوگ)، فالزبائن اللي عدهم نسخة أقدم لازم يحدّثون مرة وحدة بنفسهم.' }),
      el('label', { class: 'check' }, on, 'إجبار الزبائن على آخر نسخة من المتجر'),
      el('div', { class: 'help', style: 'color:#b26a00;font-weight:700', text: '⚠️ إذا Google Play ينشر النسخة تدريجياً (Staged rollout)، اللي ما وصلته بعد ما ينجبر لحد ما توصله. وآيفون ممكن يتأخر لحد يوم بعد نزول النسخة بالـ App Store.' }),
      el('details', null,
        el('summary', { style: 'cursor:pointer;font-weight:700;margin-top:6px', text: 'احتياط: أقل رقم بناء مسموح (اختياري)' }),
        el('div', { class: 'help', text: 'أي نسخة رقم بنائها أقل من هذا الرقم تنجبر تحدّث، حتى لو الإجبار فوگ مطفي. اكتبوا بس رقم نسخة نازلة بالمتجر.' }),
        el('div', { class: 'form-grid' },
          el('div', null, el('label', { class: 'lbl', text: 'أندرويد (رقم البناء)' }), minA),
          el('div', null, el('label', { class: 'lbl', text: 'آيفون (رقم البناء)' }), minI),
        ),
      ),
      err,
      el('div', null, save),
    );
  }

  // ================= الدردشة (بدل تيليگرام) =================
  // الموظف يرد على الزبون من هنا: نص أو كارت منتج. الرد يوصل للزبون بالتطبيق + إشعار، ونسخة بموضوعه بتيليگرام.
  const chat = { threads: [], openId: null, msgs: [], lastId: 0, thread: null, listTimer: null, threadTimer: null,
    primed: false, lastCustomerAt: '', products: null, picking: null };
  const chatAgo = (iso) => {
    if (!iso) return '';
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'هسه';
    if (m < 60) return `${m} د`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} س`;
    return new Date(iso).toLocaleDateString('en-GB');
  };

  // كل 15 ثانية: القائمة + عدد اللي تنتظر رد + تنبيه إذا زبون راسل
  async function chatPoll() {
    const { data, error } = await db.rpc('admin_chat_threads', { p_limit: 120 });
    if (error) return;
    chat.threads = data || [];
    const waiting = chat.threads.filter((t) => t.needs_reply && !t.blocked).length;
    const badge = $('chat-count');
    badge.textContent = waiting;
    badge.classList.toggle('hidden', !waiting);
    const newest = chat.threads.reduce((m, t) => (t.last_customer_at && t.last_customer_at > m ? t.last_customer_at : m), '');
    if (chat.primed && newest > chat.lastCustomerAt) {
      const t = chat.threads.find((x) => x.last_customer_at === newest);
      const text = t ? `زبون ${t.id}: ${(t.last && t.last.text) || ''}` : 'رسالة جديدة';
      beep();
      if (adm.section !== 'chat' || chat.openId !== (t && t.id)) toast('💬 ' + text);
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        try { new Notification('MODO - رسالة زبون', { body: text, tag: 'modo-chat' }); } catch { /* تجاهل */ }
      }
    }
    chat.lastCustomerAt = newest > chat.lastCustomerAt ? newest : chat.lastCustomerAt;
    chat.primed = true;
    $('chat-sync').textContent = 'آخر تحديث ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (adm.section === 'chat') renderChatThreads();
  }

  async function openChat() {
    if (!chat.primed) await chatPoll();
    renderChatThreads();
    if (chat.openId) openThread(chat.openId);
  }

  function stopThreadPoll() { clearInterval(chat.threadTimer); chat.threadTimer = null; }

  function renderChatThreads() {
    const list = chat.threads;
    if (!list.length) {
      $('chat-threads').replaceChildren(el('div', { class: 'chat-empty', text: 'ماكو محادثات لحد هسه' }));
      return;
    }
    $('chat-threads').replaceChildren(...list.map((t) => {
      const last = t.last || {};
      const who = last.sender === 'staff' ? 'أنتو: ' : last.sender === 'report' ? '⚠️ ' : '';
      return el('div', { class: 'chat-thread' + (t.id === chat.openId ? ' on' : ''), onclick: () => openThread(t.id) },
        el('div', { class: 't1' },
          t.needs_reply && !t.blocked ? el('span', { class: 'dot', title: 'بانتظار رد' }) : null,
          el('span', { text: `زبون ${t.id}` }),
          el('span', { class: 'badge', text: t.registered ? 'حساب' : 'ضيف' }),
          t.platform ? el('span', { class: 'badge', text: t.platform === 'ios' ? 'آيفون' : 'أندرويد' }) : null,
          t.blocked ? el('span', { class: 'badge red', text: 'محظور' }) : null,
          el('span', { class: 'spacer', style: 'flex:1' }),
          el('span', { class: 'help', style: 'margin:0', text: chatAgo(last.at || t.last_at) }),
        ),
        el('div', { class: 't2', text: who + (last.text || '') }),
      );
    }));
  }

  async function openThread(id) {
    chat.openId = id;
    chat.msgs = [];
    chat.lastId = 0;
    chat.picking = null;
    $('chat-wrap').classList.add('viewing');
    renderChatThreads();
    $('chat-view').replaceChildren(el('div', { class: 'chat-empty', text: 'جاري التحميل...' }));
    await loadThreadMsgs(true);
    stopThreadPoll();
    chat.threadTimer = setInterval(() => { if (adm.section === 'chat' && !document.hidden) loadThreadMsgs(false); }, 4000);
  }

  async function loadThreadMsgs(full) {
    const id = chat.openId;
    if (!id) return;
    const { data, error } = await db.rpc('admin_chat_messages', { p_thread_id: id, p_after_id: full ? 0 : chat.lastId });
    if (id !== chat.openId) return;
    if (error) { $('chat-view').replaceChildren(el('div', { class: 'chat-empty error', text: friendlyError(error) })); stopThreadPoll(); return; }
    const fresh = data.messages || [];
    chat.thread = data.thread;
    if (full) chat.msgs = fresh; else chat.msgs = chat.msgs.concat(fresh);
    if (fresh.length) chat.lastId = fresh[fresh.length - 1].id;
    if (full || fresh.length || !$('chat-msgs')) renderThread(full || fresh.length > 0);
  }

  function renderBubble(m) {
    const cls = m.sender === 'staff' ? 'staff' : m.sender === 'report' ? 'report' : 'cust';
    const time = new Date(m.at).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const p = m.product;
    return el('div', { class: 'bubble ' + cls },
      m.sender === 'report' ? '⚠️ الزبون بلّغ عن المحادثة: ' : null,
      p ? el('a', { class: 'prod', href: `p.html?id=${p.id}`, target: '_blank', rel: 'noopener' },
            p.image ? el('img', { src: p.image, alt: '' }) : null,
            el('div', null,
              el('div', { style: 'font-weight:800', text: p.name }),
              el('div', { class: 'help', style: 'margin:0', text: `${money(p.price)} د.ع · #${p.id}${Number(p.stock) > 0 ? '' : ' · ⚠️ نفد'}` }))) : null,
      m.body ? el('div', { text: m.body }) : null,
      el('div', { class: 'meta', text: (m.sender === 'staff' ? (m.staff || 'MODO') + ' · ' : '') + time }),
    );
  }

  function renderThread(scroll) {
    const t = chat.thread || {};
    const box = $('chat-view');
    const keepText = $('chat-text') ? $('chat-text').value : '';
    const prevScroll = $('chat-msgs') ? $('chat-msgs').scrollTop : 0;
    const msgs = el('div', { class: 'chat-msgs', id: 'chat-msgs' },
      ...(chat.msgs.length ? chat.msgs.map(renderBubble) : [el('div', { class: 'chat-empty', text: 'ماكو رسائل' })]));
    const block = el('button', { class: 'btn btn-sm', type: 'button', style: t.blocked ? '' : 'color:var(--danger, #c62828)' }, t.blocked ? 'فك الحظر' : 'حظر');
    block.addEventListener('click', async () => {
      if (!t.blocked && !(await confirmDialog('حظر الزبون؟', 'ما يگدر يرسل رسائل بعد، وتگدرون تفكون الحظر بأي وقت.', 'حظر'))) return;
      const { error } = await db.rpc('admin_chat_block', { p_thread_id: t.id, p_blocked: !t.blocked });
      if (error) { toast(friendlyError(error), true); return; }
      toast(t.blocked ? 'انفك الحظر' : 'انحظر الزبون');
      await loadThreadMsgs(true);
      chatPoll();
    });
    box.replaceChildren(
      el('div', { class: 'chat-head' },
        el('button', { class: 'btn btn-ghost btn-sm', type: 'button', 'aria-label': 'رجوع', onclick: () => { $('chat-wrap').classList.remove('viewing'); } }, '→'),
        el('b', { style: 'flex:1', text: `زبون ${t.id} · ${t.registered ? 'عنده حساب' : 'ضيف'}${t.platform ? ' · ' + (t.platform === 'ios' ? 'آيفون' : 'أندرويد') : ''}` }),
        block),
      msgs,
      t.blocked ? el('div', { class: 'chat-compose' }, el('div', { class: 'help', text: '🚫 الزبون محظور. فكوا الحظر حتى تراسلونه.' })) : renderComposer(keepText),
    );
    if (scroll) msgs.scrollTop = msgs.scrollHeight; else msgs.scrollTop = prevScroll;
  }

  function renderComposer(keepText) {
    const text = el('textarea', { class: 'field', id: 'chat-text', rows: 2, placeholder: 'اكتبوا الرد...', maxlength: 2000 });
    text.value = keepText || '';
    const send = el('button', { class: 'btn btn-primary', type: 'button' }, 'إرسال');
    const prodBtn = el('button', { class: 'btn', type: 'button', title: 'إرسال منتج' }, '🛍️ منتج');
    const picker = el('div');
    const doSend = async (extra = {}) => {
      const body = { action: 'staff_send', thread_id: chat.openId, text: text.value.trim() || null, ...extra };
      if (!body.text && !body.product_id) return;
      send.disabled = true; prodBtn.disabled = true;
      const { data, error } = await db.functions.invoke('chat-bot', { body });
      send.disabled = false; prodBtn.disabled = false;
      if (error || !data || !data.ok) {
        let msg = (data && data.error) || '';
        try { if (!msg && error && error.context) msg = (await error.context.json()).error || ''; } catch { /* تجاهل */ }
        toast(msg || 'ما انرسل، جرّبوا مرة ثانية', true);
        return;
      }
      text.value = '';
      chat.picking = null;
      await loadThreadMsgs(false);
      renderThread(true);
      chatPoll();
    };
    send.addEventListener('click', () => doSend());
    text.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) doSend(); });
    prodBtn.addEventListener('click', async () => {
      if (picker.childElementCount) { picker.replaceChildren(); return; }
      if (!chat.products) {
        picker.replaceChildren(el('div', { class: 'help', text: 'جاري تحميل المنتجات...' }));
        const { data } = await db.from('products').select('id, name, price, stock, image_url').gt('stock', 0).order('id', { ascending: false }).limit(1000);
        chat.products = data || [];
      }
      const search = el('input', { class: 'field', placeholder: 'ابحثوا باسم المنتج أو رقمه...' });
      const results = el('div', { class: 'chat-picker' });
      const fill = () => {
        const q = search.value.trim().replace('#', '');
        const rows = chat.products.filter((p) => !q || String(p.id) === q || (p.name || '').includes(q)).slice(0, 40);
        results.replaceChildren(...rows.map((p) => {
          const imgs = Array.isArray(p.image_url) ? p.image_url : [];
          const pick = () => {
            if (imgs.length <= 1) { doSend({ product_id: p.id, image_index: 1 }); return; }
            // أكثر من صورة: الموظف يختار الصورة اللي تنرسل
            results.replaceChildren(
              el('div', { class: 'help', text: `اختاروا صورة "${p.name}":` }),
              el('div', { class: 'chat-imgs' }, ...imgs.slice(0, 12).map((u, i) => el('img', { src: u, alt: `صورة ${i + 1}`, title: `صورة ${i + 1}`, onclick: () => doSend({ product_id: p.id, image_index: i + 1 }) }))));
          };
          return el('div', { class: 'pi', onclick: pick },
            imgs[0] ? el('img', { src: imgs[0], alt: '' }) : null,
            el('div', null, el('div', { style: 'font-weight:700', text: p.name }),
              el('div', { class: 'help', style: 'margin:0', text: `#${p.id} · ${money(p.price)} د.ع${imgs.length > 1 ? ` · ${imgs.length} صور` : ''}` })));
        }));
      };
      search.addEventListener('input', fill);
      picker.replaceChildren(search, results);
      fill();
      search.focus();
    });
    return el('div', { class: 'chat-compose' },
      picker,
      el('div', { class: 'row' }, text, el('div', { style: 'display:grid;gap:6px' }, send, prodBtn)),
      el('div', { class: 'help', style: 'margin:0', text: 'Ctrl+Enter للإرسال. الرد يوصل للزبون بالتطبيق ويه إشعار.' }));
  }

  // ---- الموظفين (أدمن بس): حساب محدود يشوف الطلبات والدردشة ----
  async function renderStaffCard() {
    const box = $('appui-staff');
    if (adm.role !== 'admin') { box.replaceChildren(); return; }
    const { data, error } = await db.rpc('admin_staff_list');
    if (error) { box.replaceChildren(el('div', { class: 'error', text: friendlyError(error) })); return; }
    const email = el('input', { class: 'field', type: 'email', dir: 'ltr', placeholder: 'email@example.com' });
    const name = el('input', { class: 'field', maxlength: 40, placeholder: 'مثلاً: ياسر' });
    const err = el('div', { class: 'error', role: 'alert' });
    const add = el('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'إضافة موظف');
    add.addEventListener('click', async () => {
      err.textContent = '';
      add.disabled = true;
      const { error: e } = await db.rpc('admin_add_staff', { p_email: email.value.trim(), p_name: name.value.trim() });
      add.disabled = false;
      if (e) { err.textContent = friendlyError(e); return; }
      toast('انضاف الموظف ✅');
      renderStaffCard();
    });
    box.replaceChildren(
      el('h3', { text: '👥 الموظفين', style: 'margin:0' }),
      el('div', { class: 'help', text: 'الموظف يسوي حساب بتطبيق MODO بإيميله، وبعدين تضيفونه هنا. يدخل لهذي الصفحة بنفس الإيميل وكلمة السر، ويشوف بس "الطلبات" و"الدردشة" (ما يشوف المنتجات والأسعار والإعدادات). وإذا سجّل دخول بتطبيق MODO بنفس الحساب، توصله إشعارات الطلبات والرسائل (من نسخة 2.0.6).' }),
      ...(data || []).map((s) => {
        const rm = el('button', { class: 'btn btn-sm', type: 'button', style: 'color:var(--danger, #c62828)' }, 'إزالة');
        rm.addEventListener('click', async () => {
          if (!(await confirmDialog('إزالة الموظف؟', `${s.name} (${s.email}) ما يگدر يدخل للطلبات والدردشة بعد.`, 'إزالة'))) return;
          const { error: e } = await db.rpc('admin_remove_staff', { p_user_id: s.user_id });
          if (e) { toast(friendlyError(e), true); return; }
          renderStaffCard();
        });
        return el('div', { style: 'display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0' },
          el('b', { text: s.name }), el('span', { class: 'help', style: 'margin:0;flex:1', dir: 'ltr', text: s.email }), rm);
      }),
      el('div', { class: 'form-grid' },
        el('div', null, el('label', { class: 'lbl', text: 'إيميل حساب الموظف' }), email),
        el('div', null, el('label', { class: 'lbl', text: 'الاسم (يطلع للزبون ويه الرد)' }), name)),
      err,
      el('div', null, add),
    );
  }

  // ================= الأحداث =================
  $('login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    unlockAudio();
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || !password) { $('login-error').textContent = 'اكتب البريد وكلمة المرور'; return; }
    $('login-error').textContent = '';
    $('login-btn').disabled = true;
    $('login-btn').textContent = 'جاري الدخول...';
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) { showLogin(friendlyError(error)); return; }
    $('password').value = '';
    await showApp();
  });

  $('logout-btn').addEventListener('click', async () => {
    await db.auth.signOut();
    state.orders = [];
    state.itemsCache.clear();
    adm.products = []; adm.productsLoaded = false; adm.clips = []; adm.clipsLoaded = false; adm.looks = []; adm.stories = []; adm.splash = [];
    $('splash-editor').replaceChildren();
    $('look-editor').replaceChildren();
    $('story-editor').replaceChildren();
    $('inf-editor').replaceChildren();
    $('inf-apps').replaceChildren();
    adm.influencers = [];
    adm.infApps = [];
    chat.threads = []; chat.openId = null; chat.msgs = []; chat.primed = false; chat.products = null;
    clearInterval(chat.listTimer);
    $('chat-threads').replaceChildren();
    $('chat-view').replaceChildren(el('div', { class: 'chat-empty', text: 'اختاروا محادثة من القائمة' }));
    $('appui-staff').replaceChildren();
    showSection('orders');
    closeDetail();
    showLogin();
  });

  $('refresh-btn').addEventListener('click', () => {
    unlockAudio();
    if (adm.section === 'products') { loadProducts(); return; }
    if (adm.section === 'clips') { loadClips(); return; }
    if (adm.section === 'push') { loadPushLog(); return; }
    if (adm.section === 'looks') { loadLooks(); return; }
    if (adm.section === 'stories') { loadStories(); return; }
    if (adm.section === 'splash') { loadSplash(); return; }
    if (adm.section === 'chat') { chatPoll(); if (chat.openId) loadThreadMsgs(true); return; }
    state.itemsCache.clear();
    loadOrders();
  });

  $('notify-btn').addEventListener('click', async () => {
    unlockAudio();
    if ('Notification' in window) await Notification.requestPermission();
    updateNotifyBtn();
    beep();
  });

  let searchTimer;
  $('search').addEventListener('input', (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = ev.target.value; renderList(); }, 150);
  });

  $('range').addEventListener('change', (ev) => {
    state.rangeDays = Number(ev.target.value);
    loadOrders();
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && state.selectedId && !$('confirm-dialog').open) closeDetail();
  });
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').classList.contains('hidden')) pollNew(); });
  setInterval(() => { if (!$('app').classList.contains('hidden')) renderList(); }, 60000);

  db.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') showLogin();
    if (event === 'PASSWORD_RECOVERY') setTimeout(showRecovery, 0);
  });

  (async () => {
    const { data, error } = await db.auth.getSession();
    if (OPENED_FROM_RECOVERY) {
      if (data.session) showRecovery();
      else { clearAuthHash(); showLogin(error ? friendlyError(error) : 'الرابط منتهي أو مستخدم، اطلب رابط جديد من "نسيت كلمة المرور؟"'); }
      return;
    }
    if (data.session) await showApp();
    else showLogin();
  })();
})();
</script>
</body>
</html>
