<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF773D">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>أرقامي | MODO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23FF773D'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F3; --surface: #FFFFFF; --ink: #1E1B18; --muted: #7C746D; --line: #ECE7E2;
    --brand: #FF773D; --brand-dark: #E2581C; --brand-soft: #FFEEE6; --ok: #1E7B3A; --ok-soft: #E5F5EA; --bad: #B42318;
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151311; --surface: #1F1C1A; --ink: #F3EFEB; --muted: #A69D95; --line: #34302C; --brand-soft: #3A2419; --brand-dark: #FF9A6B; --ok: #6FCF8E; --ok-soft: #1C3324; --bad: #F2867A; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header b { font-size: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.4; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .code { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; letter-spacing: 1px; }
  .due { text-align: center; background: var(--brand); color: #fff; border: 0; }
  .due .k { opacity: .9; font-size: 14px; }
  .due .v { font-size: 34px; font-weight: 700; margin: 2px 0; }
  .due .s { font-size: 13px; opacity: .9; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; }
  .pill { font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { color: var(--bad); }
  ul { padding-inline-start: 20px; margin: 0; }
  li { margin: 4px 0; font-size: 14px; }
  a { color: var(--brand-dark); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo" aria-hidden="true">M</div><b>MODO</b></header>
  <main id="app"><div class="empty">جاري التحميل...</div></main>
  <footer>الأرقام تتحدث لحالها كل ما ينفتح الرابط · © 2026 MODO</footer>
</div>
<script>
  // صفحة المؤثر: أرقامه بس (بدون أي معلومة عن الزبائن)، من public.influencer_dashboard برمز سري بالرابط.
  const SUPABASE_URL = 'https://pajxormplmloivyankji.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhanhvcm1wbG1sb2l2eWFua2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0ODQ3OTksImV4cCI6MjA3NjA2MDc5OX0.eEPB_Gt5HywU9oGNXLpSNc4IA7CTTL7CX-EMKDE3yec';
  const SITE_URL = 'https://teaizteaiz46-blip.github.io/Modo-orders/';

  const app = document.getElementById('app');
  const money = (v) => Math.round(Number(v) || 0).toLocaleString('en-US');
  const dDay = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Baghdad', day: 'numeric', month: 'numeric' });
  const dTime = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { timeZone: 'Asia/Baghdad', hour: 'numeric', minute: '2-digit' });
  // "5/11 · 1:16 م": اليوم/الشهر بالأرقام، والوقت بالعربي
  const when = (iso) => {
    const d = new Date(iso);
    return el('span', { class: 'grow' }, el('span', { class: 'num', text: dDay.format(d) }), ' · ', dTime.format(d));
  };

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else node.setAttribute(k, String(v));
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  const stat = (k, v) => el('div', { class: 'stat' }, el('div', { class: 'k', text: k }), el('div', { class: 'v num', text: money(v) }));
  const STATES = {
    counted: ['واصل ✓ ينحسب', 'ok'],
    in_progress: ['بالطريق', ''],
    cancelled: ['ملغي', 'bad'],
    not_counted: ['واصل · ما ينحسب', ''],
  };

  function render(d) {
    const balance = Number(d.earned) - Number(d.paid);
    const adLink = `${SITE_URL}app.html?utm_source=influencer&utm_campaign=inf_${String(d.code).toLowerCase()}`;
    app.replaceChildren(
      el('div', { class: 'card' },
        el('h1', { text: `أهلاً ${d.name} 👋` }),
        el('div', { class: 'muted', text: d.active ? 'هاي أرقام كودك ويه MODO.' : 'كودك موقوف حالياً.' }),
        el('span', { class: 'code num', text: d.code }),
      ),
      el('div', { class: 'card due' },
        el('div', { class: 'k', text: 'الباقي إلك' }),
        el('div', { class: 'v', text: `${money(balance)} د.ع` }),
        el('div', { class: 's', text: `العمولة الكلية ${money(d.earned)} · المدفوع ${money(d.paid)}` }),
      ),
      el('div', { class: 'card' },
        el('h2', { text: 'الأرقام' }),
        el('div', { class: 'grid' },
          stat('زيارات رابطك', d.visits),
          stat('طلبات بكودك', d.orders),
          stat('واصلة وتنحسب', d.counted),
          stat('بالطريق', d.in_progress),
        ),
      ),
      el('div', { class: 'card' },
        el('h2', { text: 'آخر الطلبات بكودك' }),
        d.recent.length
          ? el('div', null, ...d.recent.map((r) => {
              const [label, cls] = STATES[r.state] || STATES.in_progress;
              return el('div', { class: 'row' },
                when(r.at),
                el('span', { class: 'pill ' + cls, text: label }),
                el('b', { class: 'num', text: r.amount ? `+${money(r.amount)}` : '' }),
              );
            }))
          : el('div', { class: 'muted', text: 'لسه ماكو طلبات بكودك.' }),
      ),
      d.payouts.length ? el('div', { class: 'card' },
        el('h2', { text: 'الدفعات اللي استلمتها' }),
        ...d.payouts.map((p) => el('div', { class: 'row' },
          when(p.at),
          el('b', { text: `${money(p.amount)} د.ع` }),
        )),
      ) : null,
      el('div', { class: 'card' },
        el('h2', { text: 'شلون تنحسب العمولة' }),
        el('ul', null,
          el('li', { text: `${money(d.commission)} د.ع على كل زبون جديد يطلب بكودك ويوصله طلبه.` }),
          el('li', { text: `الزبون ياخذ خصم ${money(d.discount)} د.ع على أول طلب إله.` }),
          el('li', { text: 'الطلب الملغي أو المرتجع ما ينحسب، وطلباتك انت بكودك ما تنحسب.' }),
          el('li', null, 'رابطك للإعلان: ', el('a', { href: adLink, text: 'رابط التطبيق' }), ' (يفتح المتجر حسب نوع الموبايل).'),
        ),
      ),
    );
  }

  // للمعاينة بدون مؤثر حقيقي: inf.html?demo=1
  const DEMO = {
    name: 'زينب', code: 'ZAINAB', discount: 1000, commission: 750, active: true,
    visits: 1240, orders: 58, in_progress: 11, cancelled: 6, counted: 41, sales: 1230000, earned: 30750, paid: 20000,
    recent: [
      { at: new Date().toISOString(), state: 'in_progress', amount: null },
      { at: new Date(Date.now() - 36e5 * 5).toISOString(), state: 'counted', amount: 750 },
      { at: new Date(Date.now() - 36e5 * 20).toISOString(), state: 'cancelled', amount: null },
      { at: new Date(Date.now() - 36e5 * 30).toISOString(), state: 'counted', amount: 750 },
    ],
    payouts: [{ amount: 20000, at: new Date(Date.now() - 864e5 * 3).toISOString() }],
  };

  (async () => {
    const params = new URLSearchParams(location.search);
    if (params.get('demo') === '1') { render(DEMO); return; }
    const token = params.get('t') || '';
    if (!/^[0-9a-f-]{36}$/i.test(token)) {
      app.replaceChildren(el('div', { class: 'empty', text: 'الرابط ناقص. اطلب رابطك من MODO.' }));
      return;
    }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/influencer_dashboard`, {
        method: 'POST',
        headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: token }),
      });
      const data = await res.json();
      if (!res.ok || !data) throw new Error('not found');
      render(data);
    } catch {
      app.replaceChildren(el('div', { class: 'empty', text: 'ما لگينا هذا الرابط. تأكد منه أو اطلب رابط جديد من MODO.' }));
    }
  })();
</script>
</body>
</html>
