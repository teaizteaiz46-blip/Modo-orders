<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF773D">
<title>MODO</title>
<meta name="description" content="تسوّق من MODO: حجابات، شالات، عطور وملابس بتوصيل لكل العراق.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23FF773D'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F3; --surface: #FFFFFF; --ink: #1E1B18; --muted: #7C746D; --line: #ECE7E2;
    --brand: #FF773D; --brand-dark: #E2581C; --brand-soft: #FFEEE6; --green: #1E7B3A; --green-soft: #E5F5EA;
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151311; --surface: #1F1C1A; --ink: #F3EFEB; --muted: #A69D95; --line: #34302C;
      --brand-soft: #3A2419; --green: #6FD08F; --green-soft: #173222;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header b { font-size: 18px; letter-spacing: .5px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--line); aspect-ratio: 1; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; }
  .body { padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; line-height: 1.45; }
  .price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .price .now { font-size: 24px; font-weight: 700; color: var(--brand-dark); }
  .price .old { color: var(--muted); text-decoration: line-through; }
  .num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .tiers { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--brand-soft); }
  .tiers div { font-weight: 600; }
  .stock { margin-top: 10px; font-weight: 600; font-size: 14px; }
  .stock.in { color: var(--green); }
  .stock.out { color: #B42318; }
  .desc { margin-top: 14px; color: var(--muted); white-space: pre-line; }
  .actions { display: grid; gap: 10px; margin-top: 18px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; font-weight: 700; font-size: 16px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .state { padding: 60px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo" aria-hidden="true">M</div><b>MODO</b></header>
  <main id="app"><div class="state">جاري التحميل...</div></main>
</div>
<script>
(() => {
  'use strict';
  // صفحة منتج عامة: رابط إعلانات الكتالوج بفيسبوك وانستغرام يوصل هنا.
  // إذا التطبيق منصّب يفتح المنتج بيه، وإذا لا يودّي للمتجر.
  const SUPABASE_URL = 'https://pajxormplmloivyankji.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhanhvcm1wbG1sb2l2eWFua2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0ODQ3OTksImV4cCI6MjA3NjA2MDc5OX0.eEPB_Gt5HywU9oGNXLpSNc4IA7CTTL7CX-EMKDE3yec';
  const ANDROID_PACKAGE = 'iq.ameerazax.velin';
  const PLAY_URL = `https://play.google.com/store/apps/details?id=${ANDROID_PACKAGE}`;
  const APP_STORE_URL = 'https://apps.apple.com/app/id6754703322';

  const app = document.getElementById('app');
  const id = Number(new URLSearchParams(location.search).get('id'));
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const money = (v) => Math.round(Number(v) || 0).toLocaleString('en-US');
  const pieces = (n) => n === 2 ? 'قطعتين' : `${n} قطع`;

  // ---- تسجيل الزيارات بجدول page_visits (insert فقط) ----
  // ما يأخر فتح الصفحة ولا الانتقال، وأي خطأ يفشل بصمت.
  const params = new URLSearchParams(location.search);
  const clip = (v, max) => (v ? String(v).slice(0, max) : null);
  // المصدر: utm_source إذا موجود، وإلا meta إذا الزيارة من إعلان فيسبوك/انستغرام (fbclid)، وإلا direct
  const utmSource = params.get('utm_source') || (params.get('fbclid') ? 'meta' : 'direct');

  function visitorId() {
    const KEY = 'modo_visitor_id';
    try {
      let v = localStorage.getItem(KEY);
      if (!v) {
        v = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
        localStorage.setItem(KEY, v);
      }
      return v;
    } catch {
      return null;
    }
  }

  function track(event) {
    try {
      fetch(`${SUPABASE_URL}/rest/v1/page_visits`, {
        method: 'POST',
        keepalive: true, // يكمّل حتى لو الصفحة انتقلت للمتجر أو التطبيق
        headers: {
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal', // الجدول ما يسمح بالقراءة
        },
        body: JSON.stringify({
          event,
          product_id: Number.isInteger(id) && id > 0 ? id : null,
          utm_source: clip(utmSource, 100),
          utm_campaign: clip(params.get('utm_campaign'), 200),
          referrer: clip(document.referrer, 300),
          visitor_id: clip(visitorId(), 64),
        }),
      }).catch(() => {});
    } catch {}
  }

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, String(v));
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  function appLink(productId) {
    const deep = `modoiraq://product/${productId}`;
    // أندرويد: intent يفتح التطبيق، وإذا مو منصّب يروح لـ Google Play تلقائياً
    if (isAndroid) {
      return `intent://product/${productId}#Intent;scheme=modoiraq;package=${ANDROID_PACKAGE};` +
        `S.browser_fallback_url=${encodeURIComponent(PLAY_URL)};end`;
    }
    return deep;
  }

  function openApp(productId) {
    if (isIOS) {
      // إذا التطبيق مو منصّب، الصفحة تبقى ظاهرة؛ نحوّل لـ App Store بعد لحظة
      const started = Date.now();
      setTimeout(() => {
        if (!document.hidden && Date.now() - started < 2500) location.href = APP_STORE_URL;
      }, 1500);
    }
    location.href = appLink(productId);
  }

  function storeButtons() {
    return el('div', { class: 'stores' },
      el('a', { class: 'btn', href: PLAY_URL, rel: 'noopener', onclick: () => track('click_play') }, 'Google Play'),
      el('a', { class: 'btn', href: APP_STORE_URL, rel: 'noopener', onclick: () => track('click_appstore') }, 'App Store'),
    );
  }

  function render(p) {
    document.title = `${p.name} | MODO`;
    const images = (Array.isArray(p.image_url) ? p.image_url : []).filter(Boolean);
    const price = Number(p.price) || 0;
    const old = Number(p.old_price) || 0;
    const tiers = (Array.isArray(p.bulk_tiers) ? p.bulk_tiers : [])
      .filter((t) => Number.isInteger(t.qty) && t.qty > 1 && Number(t.price) > 0)
      .sort((a, b) => a.qty - b.qty);
    const inStock = Number(p.stock) > 0;

    app.replaceChildren(el('div', { class: 'card' },
      images.length
        ? el('div', { class: 'gallery' }, images.map((src, i) => el('img', { src, alt: i === 0 ? p.name : '', loading: i ? 'lazy' : 'eager' })))
        : null,
      el('div', { class: 'body' },
        el('h1', { text: p.name }),
        el('div', { class: 'price' },
          el('span', { class: 'now' }, el('span', { class: 'num', text: money(price) }), ' د.ع'),
          old > price ? el('span', { class: 'old' }, el('span', { class: 'num', text: money(old) })) : null,
        ),
        tiers.length
          ? el('div', { class: 'tiers' }, tiers.map((t) => el('div', null,
              `${pieces(t.qty)} بـ `, el('span', { class: 'num', text: money(t.price) }), ' د.ع',
              t.free_delivery === true ? ' + توصيل مجاني' : '')))
          : null,
        el('div', { class: 'stock ' + (inStock ? 'in' : 'out'), text: inStock ? 'متوفر' : 'نفد حالياً' }),
        p.description ? el('div', { class: 'desc', text: p.description }) : null,
        el('div', { class: 'actions' },
          el('button', { class: 'btn primary', type: 'button', onclick: () => { track('click_app'); openApp(p.id); } }, 'اطلبه من تطبيق MODO'),
          storeButtons(),
        ),
        el('div', { class: 'note', text: 'الدفع نقداً عند الاستلام · توصيل لكل المحافظات' }),
      ),
    ));
  }

  function renderMissing() {
    app.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'body' },
      el('div', { class: 'state', text: 'هذا المنتج غير متوفر حالياً، شوف منتجاتنا الثانية بالتطبيق.' }),
      el('div', { class: 'actions' }, storeButtons()),
    )));
  }

  async function load() {
    if (!Number.isInteger(id) || id <= 0) return renderMissing();
    try {
      const cols = 'id,name,price,old_price,image_url,description,stock,bulk_tiers';
      const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=${cols}`, {
        headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
      });
      const rows = res.ok ? await res.json() : [];
      if (!rows.length) return renderMissing();
      render(rows[0]);
    } catch {
      renderMissing();
    }
  }

  track('view');
  load();
})();
</script>
</body>
</html>
